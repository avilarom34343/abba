/**
 * js/lib/store.js
 * ---------------------------------------------------------------------------
 * MockDatabaseProvider — capa de datos en memoria + localStorage.
 *
 * Implementa la MISMA forma de tablas que se usarían en Supabase/Postgres
 * (ver esquema al final del archivo). Cuando se conecte Supabase, esta es la
 * única pieza que hay que reemplazar: las vistas (js/views/*) y el resto de
 * la app solo hablan con `ABBA.store`, nunca con localStorage directamente.
 *
 * Para migrar a Supabase real:
 *   1. Crear js/lib/store.supabase.js implementando la misma interfaz pública
 *      (list, get, insert, update, remove) devolviendo Promises.
 *   2. Sustituir la asignación de `window.ABBA.store` al final de este archivo.
 *   3. Añadir Row Level Security en Postgres usando clinic_id (ver sección
 *      "RLS" al final) — el aislamiento por clínica que aquí se hace en JS
 *      debe reforzarse también en la base de datos, nunca confiar solo en
 *      el cliente.
 * ---------------------------------------------------------------------------
 */
(function () {
  const STORAGE_KEY = "abba_patient_db_v1";

  const TABLES = [
    "clinics", "users", "patients", "staff", "doctors", "services",
    "appointments", "points_transactions", "loyalty_levels", "rewards",
    "reward_redemptions", "referrals", "qr_codes", "qr_scans",
    "automations", "automation_logs", "campaigns", "messages",
    "reviews", "patient_events", "notifications", "patient_messages",
    "ocupados", "push_subs", "arco_requests", "google_reviews"
  ];

  function emptyDb() {
    const db = {};
    TABLES.forEach((t) => (db[t] = []));
    return db;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyDb();
      const parsed = JSON.parse(raw);
      const db = emptyDb();
      TABLES.forEach((t) => { if (Array.isArray(parsed[t])) db[t] = parsed[t]; });
      return db;
    } catch (e) {
      console.warn("[store] localStorage no disponible, usando memoria volátil.", e);
      return emptyDb();
    }
  }

  let db = load();

  // Sincronización: el sitio del paciente y el del doctor comparten la misma
  // base local. Cuando una pestaña escribe, las demás reciben el evento
  // "storage" y recargan — así la notificación de una reseña o un mensaje le
  // llega al doctor al instante, sin refrescar. (Con Supabase esto se
  // reemplaza por Realtime: supabase.channel(...).on("postgres_changes"...).)
  window.addEventListener("storage", (e) => {
    if (e.key !== STORAGE_KEY) return;
    db = load();
    window.dispatchEvent(new CustomEvent("abba:sync"));
  });
  // Se guarda de inmediato en cada cambio (nada de esperar unos milisegundos
  // "por si acaso" — eso podía perder el último cambio si la página se
  // cerraba o recargaba justo después de una acción).
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { /* modo privado, cuota llena, etc. */ }
  }

  // Ids imposibles de adivinar (UUID): nunca /paciente/123.
  function uid(prefix) {
    const r = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID().replace(/-/g, "") : Array.from({ length: 4 }, () => Math.random().toString(36).slice(2, 10)).join("");
    return (prefix ? prefix + "_" : "") + r;
  }

  function assertTable(table) {
    if (!TABLES.includes(table)) throw new Error(`[store] Tabla desconocida: ${table}`);
  }

  /**
   * Aislamiento por clínica: cualquier lectura que no sea explícitamente
   * "cross-clinic" (uso exclusivo del admin ABBA) debe pasar clinicId.
   */
  const store = {
    TABLES,

    list(table, filterFn) {
      assertTable(table);
      const rows = db[table].slice();
      return filterFn ? rows.filter(filterFn) : rows;
    },

    listByClinic(table, clinicId, filterFn) {
      assertTable(table);
      if (!clinicId) throw new Error("[store] listByClinic requiere clinicId (aislamiento de datos).");
      return db[table].filter((r) => r.clinic_id === clinicId && (!filterFn || filterFn(r)));
    },

    get(table, id) {
      assertTable(table);
      return db[table].find((r) => r.id === id) || null;
    },

    insert(table, record) {
      assertTable(table);
      const row = Object.assign({ id: uid(table.slice(0, 3)), created_at: new Date().toISOString() }, record);
      db[table].push(row);
      persist();
      return row;
    },

    update(table, id, patch) {
      assertTable(table);
      const row = db[table].find((r) => r.id === id);
      if (!row) return null;
      Object.assign(row, patch, { updated_at: new Date().toISOString() });
      persist();
      return row;
    },

    remove(table, id) {
      assertTable(table);
      const idx = db[table].findIndex((r) => r.id === id);
      if (idx === -1) return false;
      db[table].splice(idx, 1);
      persist();
      return true;
    },

    /** Vacía TODO (usado solo por el botón de reseteo de datos demo). */
    resetAll() {
      db = emptyDb();
      persist();
    },

    isEmpty() {
      return db.clinics.length === 0;
    },

    /** Aplica branding de la clínica (logo/colores) a las variables CSS. */
    applyClinicBranding(clinic) {
      const root = document.documentElement;
      if (clinic && clinic.brand_color) {
        root.style.setProperty("--brand-900", clinic.brand_color);
      } else {
        root.style.removeProperty("--brand-900");
      }
    }
  };

  window.ABBA = window.ABBA || {};
  window.ABBA.store = store;
  window.ABBA.uid = uid;
})();

/**
 * ---------------------------------------------------------------------------
 * ESQUEMA CONCEPTUAL (para migración a Postgres/Supabase)
 * ---------------------------------------------------------------------------
 * clinics(id, name, logo_url, brand_color, address, phone, whatsapp,
 *   maps_url, reviews_url, plan, status, created_at)
 * users(id, clinic_id null-able, role[SUPER_ADMIN|CLINIC_ADMIN|STAFF|PATIENT],
 *   email, phone, auth_provider_id)
 * patients(id, clinic_id, user_id, first_name, last_name, phone, email,
 *   points_balance, level_id, last_visit_at, created_at)
 * staff(id, clinic_id, user_id, role, name)
 * doctors(id, clinic_id, name, specialty, active)
 * services(id, clinic_id, name, duration_min, points_awarded, active)
 * appointments(id, clinic_id, patient_id, doctor_id, service_id, date, time,
 *   status[pending|confirmed|completed|cancelled|no_show], location, created_at)
 * points_transactions(id, clinic_id, patient_id, amount, type, description, created_at)
 * loyalty_levels(id, clinic_id, name, min_points, max_points, icon, sort_order)
 * rewards(id, clinic_id, name, description, points_cost, active)
 * reward_redemptions(id, clinic_id, patient_id, reward_id, status[pending|used], created_at)
 * referrals(id, clinic_id, patient_id, code, referred_patient_id null-able,
 *   status[pending|completed], points_awarded, created_at)
 * qr_codes(id, clinic_id, name, destination, active, scan_count, created_at)
 * qr_scans(id, qr_id, clinic_id, created_at, resulted_in_signup boolean)
 * automations(id, clinic_id, event_key, name, active, message_template, channel)
 * automation_logs(id, clinic_id, automation_id, patient_id, status, created_at)
 * campaigns(id, clinic_id, segment, message, status, created_at, sent_count)
 * messages(id, clinic_id, patient_id, channel, direction, body, status[sent|failed|pending], created_at)
 * reviews(id, clinic_id, patient_id, rating, left_review boolean, created_at)
 * patient_events(id, clinic_id, patient_id, event_key, payload_json, created_at)
 *
 * RLS (Row Level Security) — política base para cada tabla con clinic_id:
 *   USING (clinic_id = current_setting('request.jwt.claims.clinic_id')
 *          OR current_setting('request.jwt.claims.role') = 'SUPER_ADMIN')
 * Para `patients`, además: un PATIENT solo puede leer su propia fila
 *   (user_id = auth.uid()).
 * ---------------------------------------------------------------------------
 */


/* ---- lib/nube.js ---- */
/**
 * js/lib/nube.js — la base de datos real (Supabase).
 * ---------------------------------------------------------------------------
 * Solo se activa en las versiones publicadas (window.ABBA_NUBE = { url, llave });
 * la demo sigue guardando en el navegador.
 *  - Misma interfaz que store.js (list/get/insert/update/remove, sin esperas):
 *    trabaja sobre una copia en memoria que se llena al entrar y se mantiene al
 *    día en vivo; cada cambio se guarda en la base en segundo plano y en orden.
 *  - El paciente nunca escribe directo: sus acciones (lib/acciones.js) corren
 *    en el servidor con el mismo código, y aquí solo se ve el resultado.
 *  - Cuentas: equipo = usuario + contraseña; paciente = clínica + celular +
 *    contraseña. Las contraseñas las guarda cifradas el sistema de cuentas.
 * ---------------------------------------------------------------------------
 */
(function () {
  const CFG = window.ABBA_NUBE;
  if (!CFG) return;
  const sb = window.supabase.createClient(CFG.url, CFG.llave, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "abba_nube_" + (window.ABBA_APP || "app") }
  });
  const local = window.ABBA.store;
  const TABLES = local.TABLES;
  const SOLO_EN_MEMORIA = ["ocupados"];
  const EN_VIVO = ["clinics", "patients", "doctors", "services", "appointments", "points_transactions", "loyalty_levels",
    "rewards", "reward_redemptions", "referrals", "automations", "automation_logs", "campaigns", "reviews", "notifications", "patient_messages", "google_reviews"];
  const DOMINIO = "abba.example";
  let db = {};
  TABLES.forEach((t) => { db[t] = []; });

  // ---- Forma de la base ↔ forma de la app
  function aFila(t, r) {
    const f = Object.assign({}, r.data || {});
    f.id = r.id;
    f.created_at = r.created_at;
    if (r.updated_at) f.updated_at = r.updated_at;
    if (t !== "clinics" && r.clinic_id != null) f.clinic_id = r.clinic_id;
    if (t !== "patients" && r.patient_id != null) f.patient_id = r.patient_id;
    return f;
  }
  function aBase(t, f) {
    const data = JSON.parse(JSON.stringify(f));
    delete data.id; delete data.created_at; delete data.updated_at;
    return {
      id: f.id,
      clinic_id: t === "clinics" ? f.id : (f.clinic_id || null),
      patient_id: t === "patients" ? f.id : (f.patient_id || null),
      created_at: f.created_at,
      data
    };
  }
  function limpio(obj) { return JSON.parse(JSON.stringify(obj, (k, v) => (v === undefined ? null : v))); }
  function uid(prefix) { return (prefix ? prefix + "_" : "") + crypto.randomUUID().replace(/-/g, ""); }
  function soyPaciente() { const s = window.ABBA.auth && window.ABBA.auth.getSession(); return !!(s && s.role === "PATIENT"); }

  // ---- Avisar a la pantalla que hay datos nuevos (agrupado)
  let tAviso = null;
  function avisar() { clearTimeout(tAviso); tAviso = setTimeout(() => window.dispatchEvent(new CustomEvent("abba:sync")), 150); }

  // ---- Cola de guardado: en orden, con reintentos
  let cola = Promise.resolve();
  let avisoError = 0;
  function fallo(e) {
    console.error("[nube]", e);
    if (Date.now() - avisoError > 8000 && window.ABBA.views && window.ABBA.views.shared) {
      avisoError = Date.now();
      window.ABBA.views.shared.toast("No se pudo guardar un cambio. Revisa tu internet.", "danger");
    }
  }
  function enCola(fn) {
    cola = cola.then(async () => {
      for (let intento = 0; intento < 3; intento++) {
        try {
          const { error } = await fn();
          if (!error) return;
          if (error.code && String(error.code).length === 5) { fallo(error); return; } // error de la base: no se reintenta
          if (intento === 2) fallo(error);
        } catch (e) { if (intento === 2) fallo(e); }
        await new Promise((r) => setTimeout(r, 800 * (intento + 1)));
      }
    });
  }

  // ---- El "store" con la base real (misma interfaz que el local)
  const store = {
    TABLES,
    list(table, filterFn) { const rows = (db[table] || []).slice(); return filterFn ? rows.filter(filterFn) : rows; },
    listByClinic(table, clinicId, filterFn) {
      if (!clinicId) throw new Error("[store] listByClinic requiere clinicId (aislamiento de datos).");
      return (db[table] || []).filter((r) => r.clinic_id === clinicId && (!filterFn || filterFn(r)));
    },
    get(table, id) { return (db[table] || []).find((r) => r.id === id) || null; },
    insert(table, record) {
      const row = Object.assign({ id: uid(table.slice(0, 3)), created_at: new Date().toISOString() }, record);
      db[table].push(row);
      if (!SOLO_EN_MEMORIA.includes(table) && !soyPaciente()) { const fila = aBase(table, row); enCola(() => sb.from(table).insert(fila)); }
      avisar();
      return row;
    },
    update(table, id, patch) {
      const row = store.get(table, id);
      if (!row) return null;
      Object.assign(row, patch, { updated_at: new Date().toISOString() });
      if (!SOLO_EN_MEMORIA.includes(table) && !soyPaciente()) { const cambios = limpio(patch); enCola(() => sb.rpc("guardar_cambios", { tabla: table, fila: id, cambios })); }
      return row;
    },
    remove(table, id) {
      const before = (db[table] || []).length;
      db[table] = (db[table] || []).filter((r) => r.id !== id);
      if (db[table].length === before) return false;
      if (!SOLO_EN_MEMORIA.includes(table) && !soyPaciente()) enCola(() => sb.from(table).delete().eq("id", id));
      avisar();
      return true;
    },
    resetAll() {},
    isEmpty() { return db.clinics.length === 0; },
    applyClinicBranding: local.applyClinicBranding
  };
  window.ABBA.store = store;
  window.ABBA.uid = uid;

  // ---- Cambios en vivo
  function ponerFila(t, f) {
    const actual = store.get(t, f.id);
    if (actual) { Object.keys(actual).forEach((k) => { delete actual[k]; }); Object.assign(actual, f); }
    else db[t].push(f);
  }
  let canal = null;
  function enVivo() {
    if (canal) sb.removeChannel(canal);
    canal = sb.channel("abba-" + Math.random().toString(36).slice(2));
    EN_VIVO.forEach((t) => canal.on("postgres_changes", { event: "*", schema: "public", table: t }, (p) => {
      if (p.eventType === "DELETE") { const id = p.old && p.old.id; db[t] = db[t].filter((r) => r.id !== id); }
      else if (p.new && p.new.id) ponerFila(t, aFila(t, p.new));
      avisar();
    }));
    canal.subscribe();
  }

  // ---- Cargar todo lo que esta cuenta puede ver
  async function cargar() {
    const s = window.ABBA.auth.getSession();
    const nuevo = {};
    TABLES.forEach((t) => { nuevo[t] = []; });
    await Promise.all(TABLES.filter((t) => !SOLO_EN_MEMORIA.includes(t)).map(async (t) => {
      for (let desde = 0; ; desde += 1000) {
        const { data, error } = await sb.from(t).select("id, clinic_id, patient_id, created_at, updated_at, data").order("created_at").range(desde, desde + 999);
        if (error) throw error;
        data.forEach((r) => nuevo[t].push(aFila(t, r)));
        if (data.length < 1000) break;
      }
    }));
    TABLES.forEach((t) => { db[t] = nuevo[t]; });
    if (s && s.role === "PATIENT") await refrescarOcupados();
    enVivo();
    avisar();
  }
  /** Horarios ya tomados por otros pacientes (sin sus datos), para agendar. */
  async function refrescarOcupados() {
    const s = window.ABBA.auth.getSession();
    if (!s || s.role !== "PATIENT") return;
    const { data } = await sb.rpc("horarios_ocupados");
    db.ocupados = (data || []).map((o) => ({ id: o.id, clinic_id: s.clinicId, doctor_id: o.doctor_id, service_id: o.service_id, date: o.date, time: o.time }));
  }
  async function clinicasPublicas() {
    const { data } = await sb.rpc("clinicas_activas");
    db.clinics = (data || []).map((c) => ({ id: c.id, name: c.name, status: "active" }));
  }

  // ---- Llamadas al servidor (función "abba")
  async function llamar(accion, datos) {
    const { data } = await sb.auth.getSession();
    const token = data && data.session ? data.session.access_token : CFG.llave;
    let res, j = null;
    try {
      res = await fetch(CFG.url + "/functions/v1/abba", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: CFG.llave, Authorization: "Bearer " + token },
        body: JSON.stringify({ accion, datos: datos || {} })
      });
      j = await res.json();
    } catch (e) { return { error: "No pudimos conectar con ABBA. Revisa tu internet e inténtalo de nuevo." }; }
    return j || { error: "No pudimos conectar con ABBA. Inténtalo de nuevo." };
  }
  function aplicarCambios(cambios) {
    (cambios || []).forEach((c) => {
      if (c.tipo === "remove") db[c.tabla] = (db[c.tabla] || []).filter((r) => r.id !== c.id);
      else if (c.fila && db[c.tabla]) ponerFila(c.tabla, aFila(c.tabla, c.fila));
    });
    avisar();
  }

  // ---- Sesión
  let original = null;
  async function perfilYDatos() {
    const { data: perfil, error } = await sb.rpc("mi_perfil");
    if (error || !perfil) return { error: "Esta cuenta no tiene acceso. Contacta a ABBA." };
    const session = { role: perfil.rol, clinicId: perfil.clinic_id || null, patientId: perfil.patient_id || null, userId: perfil.user_id || null };
    original.setSession(session);
    await cargar();
    if (session.clinicId) {
      const c = store.get("clinics", session.clinicId);
      if (!c || c.status !== "active") { await salir(); return { error: "Esta clínica está desactivada. Contacta a ABBA para más información." }; }
    }
    return { session };
  }
  async function salir() {
    original.logout();
    TABLES.forEach((t) => { db[t] = []; });
    if (canal) { sb.removeChannel(canal); canal = null; }
    try { await sb.auth.signOut(); } catch (e) { /* sin internet: la sesión local ya se borró */ }
    if (window.ABBA_APP === "patient") await clinicasPublicas().catch(() => {});
  }
  /** El servidor dice con qué cuenta entrar; la sesión se inicia desde este
   *  celular (así cada paciente cuenta por separado en los límites de intentos). */
  async function entrarComoPaciente(r, password, mensaje) {
    if (!r || r.error) return r || { error: "No pudimos conectar con ABBA. Inténtalo de nuevo." };
    const { error } = await sb.auth.signInWithPassword({ email: r.correo, password });
    if (error) return { error: mensaje };
    const p = await perfilYDatos();
    return p.error ? p : { session: p.session, patient: store.get("patients", p.session.patientId) };
  }

  function conectar() {
    const auth = window.ABBA.auth, acciones = window.ABBA.acciones;
    original = { setSession: auth.setSession, logout: auth.logout };
    // Doctores y ABBA. Si tienen la verificación en dos pasos activa, NO se carga
    // nada hasta escribir el código de su app (devuelve { pedirCodigo }).
    auth.loginWithCredentials = async ({ username, password, allowedRoles }) => {
      const usuario = String(username || "").trim().toLowerCase();
      const { error } = await sb.auth.signInWithPassword({ email: `u-${usuario}@${DOMINIO}`, password });
      if (error) return { error: /rate|many|too/i.test(error.message || "") ? "Demasiados intentos. Espera unos minutos." : "Usuario o contraseña incorrectos." };
      const terminar = async () => {
        const r = await perfilYDatos();
        if (r.error) return r;
        if (allowedRoles && !allowedRoles.includes(r.session.role)) { await salir(); return { error: "Este usuario no tiene acceso aquí." }; }
        registrarAcceso(null, "entrar");
        return r;
      };
      if (await faltaSegundoPaso()) {
        return {
          pedirCodigo: async (codigo) => {
            const f = await factorTotp();
            if (!f) return { error: "No encontramos tu verificación en dos pasos. Contacta a ABBA." };
            const v = await sb.auth.mfa.challengeAndVerify({ factorId: f.id, code: String(codigo || "").replace(/\D/g, "") });
            if (v.error) return { error: "Código incorrecto o vencido. Escribe el que aparece ahora en tu app." };
            return terminar();
          },
          cancelar: () => salir()
        };
      }
      return terminar();
    };
    auth.loginPatient = async (datos) => entrarComoPaciente(await llamar("entrar", { clinicId: datos.clinicId, phone: datos.phone }), datos.password, "Celular o contraseña incorrectos para esta clínica.");
    auth.registerPatient = async (datos) => entrarComoPaciente(await llamar("registro", datos), datos.password, "Tu cuenta quedó creada. Entra con tu celular y tu contraseña.");
    auth.logout = () => { salir(); };
    auth.createClinicWithDoctor = async (datos) => {
      const r = await llamar("crear_clinica", datos);
      if (r.error) return r;
      await cargar();
      return { clinic: store.get("clinics", r.clinicId) || { id: r.clinicId, name: datos.clinicName } };
    };
    auth.borrarClinica = async (clinicId) => {
      const r = await llamar("borrar_clinica", { clinicId });
      if (!r.error) await cargar();
      return r;
    };
    // Primero se comprueba la contraseña actual (aparte, sin tocar la sesión abierta) y luego se cambia.
    auth.cambiarContrasena = async ({ actual, nueva }) => {
      if (String(nueva || "").length < 6) return { error: "La contraseña nueva debe tener al menos 6 caracteres." };
      if (actual === nueva) return { error: "La contraseña nueva debe ser distinta a la actual." };
      const { data } = await sb.auth.getUser();
      const correo = data && data.user && data.user.email;
      if (!correo) return { error: "Tu sesión terminó. Vuelve a entrar." };
      const prueba = await fetch(CFG.url + "/auth/v1/token?grant_type=password", {
        method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.llave }, body: JSON.stringify({ email: correo, password: actual })
      });
      if (!prueba.ok) return { error: prueba.status === 429 ? "Demasiados intentos. Espera unos minutos." : "Tu contraseña actual no es correcta." };
      const { error } = await sb.auth.updateUser({ password: nueva });
      if (error) return { error: /different|same/i.test(error.message) ? "La contraseña nueva debe ser distinta a la actual." : "No pudimos cambiarla. Inténtalo de nuevo." };
      return {};
    };
    auth.restablecerPaciente = (patientId) => llamar("restablecer_paciente", { patientId });
    auth.restablecerDoctor = (clinicId) => llamar("restablecer_doctor", { clinicId });
    // WhatsApp de una clínica (solo ABBA): los datos van directo al servidor y no se vuelven a mostrar.
    auth.whatsappConectar = async (datos) => { const r = await llamar("whatsapp_conectar", datos); if (!r.error) await cargar(); return r; };
    auth.whatsappDesconectar = async (clinicId) => { const r = await llamar("whatsapp_desconectar", { clinicId }); if (!r.error) await cargar(); return r; };
    // Reseñas de Google: el doctor da permiso en Google; la llave queda solo en el servidor.
    auth.googleConectar = (clinicId) => llamar("google_conectar", { clinicId });
    auth.googleElegir = async (ubicacion, clinicId) => { const r = await llamar("google_elegir", { ubicacion, clinicId }); if (!r.error) await cargar(); return r; };
    auth.googleDesconectar = async (clinicId) => { const r = await llamar("google_desconectar", { clinicId }); if (!r.error) await cargar(); return r; };
    auth.googleRevisar = async (clinicId) => { const r = await llamar("google_revisar", { clinicId }); if (!r.error) await cargar(); return r; };
    // Borrar la cuenta: primero se comprueba la contraseña (aparte, sin tocar la sesión).
    acciones.eliminarCuenta = async ({ password }) => {
      const ok = await contrasenaCorrecta(password);
      if (ok !== true) return { error: ok };
      const r = await llamar("eliminar_cuenta", {});
      if (r.error) return r;
      await salir();
      return {};
    };
    auth.eliminarPaciente = async (patientId) => { const r = await llamar("eliminar_paciente", { patientId }); if (!r.error) await cargar(); return r; };
    ["agendar", "canjear", "calificar", "resenaGoogle", "mensaje", "perfil", "leerMensajes", "whatsappPreferencia"].forEach((nombre) => {
      acciones[nombre] = async (datos) => {
        const r = await llamar("accion", { nombre, datos });
        if (r.error) {
          if (nombre === "agendar") refrescarOcupados().then(avisar).catch(() => {});
          return { error: r.error };
        }
        aplicarCambios(r.cambios);
        return r.resultado || {};
      };
    });
    acciones.escaneo = (datos) => llamar("escaneo", datos);
    sb.auth.onAuthStateChange((evento) => {
      if (evento === "SIGNED_OUT" && original && auth.getSession()) { original.logout(); window.ABBA.router && window.ABBA.router.go("#/"); }
    });
  }

  /** Arranque: recupera la sesión (si había) y carga los datos antes de mostrar nada. */
  async function iniciar() {
    conectar();
    const app = document.getElementById("app");
    if (app && !app.children.length) app.innerHTML = '<p style="padding:48px 24px;text-align:center;color:#6e6e73;font:500 16px/1.4 Inter,system-ui,sans-serif">Cargando…</p>';
    try {
      const { data } = await sb.auth.getSession();
      // Una sesión a medias (sin el código de dos pasos) no cuenta: se vuelve a entrar.
      if (data && data.session && !(await faltaSegundoPaso())) { const r = await perfilYDatos(); if (r.error) await salir(); }
      else if (data && data.session) await salir();
      else original.logout();
      if (!window.ABBA.auth.getSession() && window.ABBA_APP === "patient") await clinicasPublicas();
    } catch (e) {
      console.error("[nube] arranque", e);
      if (app) app.innerHTML = '<p style="padding:48px 24px;text-align:center;color:#6e6e73;font:500 16px/1.4 Inter,system-ui,sans-serif">No pudimos conectar con ABBA. Revisa tu internet y recarga la página.</p>';
      throw e;
    }
    if (app) app.innerHTML = "";
    if (window.ABBA_APP === "patient") setInterval(() => refrescarOcupados().catch(() => {}), 120000);
  }

  // ---- Avisos en el celular del doctor (aunque tenga la app cerrada)
  function llaveBytes(b64) {
    const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (b64.length % 4)) % 4));
    return Uint8Array.from(s, (c) => c.charCodeAt(0));
  }
  async function avisosActivos() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && (await reg.pushManager.getSubscription());
    return !!(sub && Notification.permission === "granted");
  }
  async function activarAvisos() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      return { error: "Este celular todavía no permite avisos. En iPhone: abre ABBA Doctors en Safari, toca Compartir → Agregar a inicio, y actívalos desde ese ícono." };
    }
    const permiso = await Notification.requestPermission();
    if (permiso !== "granted") return { error: "No se activaron: hay que permitir las notificaciones." };
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const { llave, error } = await llamar("vapid", {});
    if (error || !llave) return { error: error || "No pudimos activar los avisos. Inténtalo de nuevo." };
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: llaveBytes(llave) });
    const j = sub.toJSON(), s = window.ABBA.auth.getSession();
    if (!store.listByClinic("push_subs", s.clinicId, (x) => x.endpoint === j.endpoint).length) {
      store.insert("push_subs", { clinic_id: s.clinicId, endpoint: j.endpoint, keys: j.keys, user_id: s.userId || null, dispositivo: navigator.userAgent.slice(0, 160) });
    }
    return {};
  }

  // ---- Verificación en dos pasos (doctores y ABBA), con una app de autenticación
  async function factorTotp() {
    const { data } = await sb.auth.mfa.listFactors();
    return data && data.totp ? data.totp.find((f) => f.status === "verified") || null : null;
  }
  async function faltaSegundoPaso() {
    const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    return !!(data && data.nextLevel === "aal2" && data.currentLevel !== "aal2");
  }
  const dosPasos = {
    async activo() { return !!(await factorTotp()); },
    /** Paso 1: da el QR para escanear con la app (Google Authenticator, Microsoft Authenticator…). */
    async preparar() {
      const { data: l } = await sb.auth.mfa.listFactors();
      for (const f of ((l && l.all) || []).filter((x) => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId: f.id });
      const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "ABBA " + new Date().toISOString().slice(0, 10) });
      if (error) return { error: "No se pudo preparar. Inténtalo de nuevo." };
      return { factorId: data.id, qr: data.totp.qr_code, clave: data.totp.secret };
    },
    /** Paso 2: confirma con el primer código de la app. */
    async confirmar(factorId, codigo) {
      const v = await sb.auth.mfa.challengeAndVerify({ factorId, code: String(codigo || "").replace(/\D/g, "") });
      return v.error ? { error: "Código incorrecto. Escribe el que aparece ahora en tu app." } : {};
    },
    async quitar() {
      const f = await factorTotp();
      if (!f) return {};
      const r = await sb.auth.mfa.unenroll({ factorId: f.id });
      return r.error ? { error: "Para quitarla, vuelve a entrar con tu código y luego intenta otra vez." } : {};
    }
  };
  /** true, o el motivo por el que la contraseña no sirve. */
  async function contrasenaCorrecta(password) {
    const { data } = await sb.auth.getUser();
    const correo = data && data.user && data.user.email;
    if (!correo) return "Tu sesión terminó. Vuelve a entrar.";
    const r = await fetch(CFG.url + "/auth/v1/token?grant_type=password", { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.llave }, body: JSON.stringify({ email: correo, password }) });
    return r.ok ? true : r.status === 429 ? "Demasiados intentos. Espera unos minutos." : "La contraseña no es correcta.";
  }
  // ---- Bitácora de accesos: quién vio fichas de pacientes y cuándo entró
  function registrarAcceso(paciente, que) { sb.rpc("registrar_acceso", { paciente: paciente || null, que: que || "ver" }).then(() => {}, () => {}); }
  async function verBitacora(filtro) {
    const { data, error } = await sb.rpc("ver_bitacora", { clinica: (filtro && filtro.clinica) || null, paciente: (filtro && filtro.paciente) || null, limite: (filtro && filtro.limite) || 200 });
    return error ? { error: "No se pudo leer la bitácora." } : { filas: data || [] };
  }

  window.ABBA.nube = { iniciar, cargar, llamar, activarAvisos, avisosActivos, refrescarOcupados, cliente: sb, dosPasos, registrarAcceso, verBitacora };
})();


/* ---- lib/events.js ---- */
/**
 * js/lib/events.js
 * ---------------------------------------------------------------------------
 * Bus de eventos simple (pub/sub). Las automatizaciones (js/lib/automations.js)
 * escuchan estos eventos y deciden qué hacer. Esta separación es justo lo que
 * permite conectar Make/n8n/Zapier más adelante: en vez de "escuchar" el
 * evento en el navegador, se podría hacer POST a un webhook desde el backend.
 * ---------------------------------------------------------------------------
 */
(function () {
  const EVENTS = {
    PATIENT_REGISTERED: "PATIENT_REGISTERED",
    APPOINTMENT_BOOKED: "APPOINTMENT_BOOKED",
    APPOINTMENT_CONFIRMED: "APPOINTMENT_CONFIRMED",
    APPOINTMENT_REMINDER: "APPOINTMENT_REMINDER",
    APPOINTMENT_RESCHEDULED: "APPOINTMENT_RESCHEDULED",
    APPOINTMENT_COMPLETED: "APPOINTMENT_COMPLETED",
    APPOINTMENT_NO_SHOW: "APPOINTMENT_NO_SHOW",
    APPOINTMENT_CANCELLED: "APPOINTMENT_CANCELLED",
    CLINIC_REPLIED: "CLINIC_REPLIED",
    PATIENT_INACTIVE: "PATIENT_INACTIVE",
    POINTS_EARNED: "POINTS_EARNED",
    LEVEL_UP: "LEVEL_UP",
    REWARD_REDEEMED: "REWARD_REDEEMED",
    BIRTHDAY: "BIRTHDAY",
    REFERRAL_COMPLETED: "REFERRAL_COMPLETED",
    REVIEW_REQUESTED: "REVIEW_REQUESTED"
  };

  const listeners = {};

  const bus = {
    EVENTS,
    on(eventKey, handler) {
      (listeners[eventKey] = listeners[eventKey] || []).push(handler);
      return () => bus.off(eventKey, handler);
    },
    off(eventKey, handler) {
      if (!listeners[eventKey]) return;
      listeners[eventKey] = listeners[eventKey].filter((h) => h !== handler);
    },
    emit(eventKey, payload) {
      const store = window.ABBA.store;
      // Quién lo provocó: lo que hace el propio equipo de la clínica no se le avisa a sí mismo.
      payload = Object.assign({ origen: window.ABBA_APP || "" }, payload || {});
      // Toda emisión queda registrada en patient_events (auditoría / futura IA).
      if (payload.clinicId) {
        const row = { clinic_id: payload.clinicId, patient_id: payload.patientId || null, event_key: eventKey, payload_json: JSON.stringify(payload) };
        // En el servidor el evento se procesa aquí mismo: que la base no lo mande otra vez.
        if (window.ABBA_SERVIDOR) row.procesado = true;
        store.insert("patient_events", row);
      }
      // Con la base de datos real, los mensajes automáticos y los avisos los corre
      // el servidor al recibir el evento (nunca el navegador).
      if (window.ABBA_NUBE) return;
      bus.despachar(eventKey, payload);
    },
    /** Corre lo que escucha un evento (sin volver a registrarlo). */
    despachar(eventKey, payload) {
      (listeners[eventKey] || []).forEach((handler) => {
        try { handler(payload); } catch (e) { console.error(`[events] error en handler de ${eventKey}`, e); }
      });
    }
  };

  window.ABBA = window.ABBA || {};
  window.ABBA.events = bus;
})();


/* ---- lib/puntos.js ---- */
/**
 * Puntos de la clínica — TODO sale de lo que el doctor configura en
 * Fidelización ("Puntos por acción") y de los puntos de cada servicio.
 * Nada de cantidades fijas en el código: si el doctor cambia un valor, la
 * app del paciente lo muestra y se otorga exactamente eso.
 */
(function () {
  // Valores iniciales de una clínica nueva (el doctor los cambia cuando quiera).
  const DEFAULTS = { registro: 100, referido: 300, invitado: 200, resena: 50, cumpleanos: 100, cita: 100 };
  const ETIQUETAS = {
    registro: ["Bienvenida", "Al crear su cuenta"],
    referido: ["Invitar a un amigo", "Para quien invita, cuando su amigo se registra"],
    invitado: ["Amigo invitado", "Para quien se registra con un código"],
    resena: ["Opinión en la app", "Al calificar su cita dentro de la app (nunca por reseñas de Google)"],
    cumpleanos: ["Cumpleaños", "Se suman solos el día de su cumpleaños"]
  };

  function config(clinicOrId) {
    const clinic = typeof clinicOrId === "string" ? window.ABBA.store.get("clinics", clinicOrId) : clinicOrId;
    const cfg = Object.assign({}, DEFAULTS);
    const saved = (clinic && clinic.points_config) || {};
    Object.keys(DEFAULTS).forEach((k) => { if (saved[k] != null && saved[k] !== "" && !isNaN(Number(saved[k]))) cfg[k] = Math.max(0, Math.round(Number(saved[k]))); });
    return cfg;
  }

  /** Puntos por asistir: los del servicio (los edita el doctor en Mi clínica). */
  function porServicio(clinicOrId, service) {
    if (service && service.points_awarded != null && service.points_awarded !== "" && !isNaN(Number(service.points_awarded))) return Math.max(0, Math.round(Number(service.points_awarded)));
    return config(clinicOrId).cita;
  }

  /** Suma (o resta) puntos: deja el movimiento, actualiza saldo y nivel, y
   *  avisa si el paciente subió de nivel. Devuelve { amount, balance, levelUp }. */
  function otorgar({ patientId, amount, type, description, silencioso, ref }) {
    const store = window.ABBA.store, utils = window.ABBA.utils, events = window.ABBA.events;
    const patient = store.get("patients", patientId);
    amount = Math.round(Number(amount) || 0);
    if (!patient || !amount) return { amount: 0, balance: patient ? patient.points_balance : 0, levelUp: null };
    // `ref` evita darlos dos veces (p. ej. el cumpleaños de este año).
    if (ref && store.listByClinic("points_transactions", patient.clinic_id, (t) => t.patient_id === patient.id && t.ref === ref).length) return { amount: 0, balance: patient.points_balance, levelUp: null };
    const levels = store.listByClinic("loyalty_levels", patient.clinic_id);
    const before = utils.computeLevel(patient.points_balance || 0, levels).current;
    const balance = Math.max(0, (patient.points_balance || 0) + amount);
    const after = utils.computeLevel(balance, levels).current;
    store.insert("points_transactions", { clinic_id: patient.clinic_id, patient_id: patient.id, amount, type, description, ref: ref || null });
    store.update("patients", patient.id, { points_balance: balance, level_id: after ? after.id : patient.level_id });
    const subio = before && after && before.id !== after.id && after.min_points > before.min_points ? after : null;
    if (subio && !silencioso) events.emit(events.EVENTS.LEVEL_UP, { clinicId: patient.clinic_id, patientId: patient.id, levelName: subio.name, vars: { nivel: subio.name } });
    return { amount, balance, levelUp: subio };
  }

  window.ABBA.puntos = { DEFAULTS, ETIQUETAS, config, porServicio, otorgar };
})();


/* ---- lib/auth.js ---- */
/**
 * js/lib/auth.js
 * ---------------------------------------------------------------------------
 * Sesión mock. NO se guardan contraseñas en texto real de producción — esto
 * es un simulador de sesión para la demo. Al conectar Supabase Auth:
 *   - registerPatient/loginPatient deben llamar a supabase.auth.signUp /
 *     signInWithPassword (o signInWithOtp usando el WhatsApp/teléfono).
 *   - getSession() debe leer supabase.auth.getSession().
 *   - El aislamiento por rol/clínica se refuerza con RLS en la base de datos,
 *     esto de aquí es solo la capa de UI.
 * ---------------------------------------------------------------------------
 */
(function () {
  // Una sesión por sitio (paciente / doctor / admin): si están en el mismo
  // dominio, entrar en uno ya no saca de los otros.
  const SESSION_KEY = "abba_session_v1_" + (window.ABBA_APP || "default");
  const ROLES = { SUPER_ADMIN: "SUPER_ADMIN", CLINIC_ADMIN: "CLINIC_ADMIN", STAFF: "STAFF", PATIENT: "PATIENT" };

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function setSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }
  function logout() {
    localStorage.removeItem(SESSION_KEY);
  }

  function normUser(u) { return String(u || "").trim().toLowerCase().replace(/\s+/g, ""); }

  /** Últimos 10 dígitos del celular: así "+52 55 1234 5678" y "5512345678"
   *  cuentan como el mismo número. */
  function normPhone(v) { return String(v || "").replace(/\D/g, "").slice(-10); }

  // Versión del aviso de privacidad que acepta el paciente (cambiarla cuando el abogado lo apruebe
  // o cambie; queda guardada con la fecha en que cada paciente lo aceptó).
  const AVISO_VERSION = "2026-10-08-borrador";

  /** Registro universal: clínica + nombre(s) + apellidos + celular + contraseña.
   *  El celular es con lo que el paciente entra después. Contraseña en texto
   *  plano SOLO mientras no hay backend (con Supabase Auth se guarda cifrada).
   *  Nada se guarda si no aceptó el aviso de privacidad (consentimiento expreso);
   *  el permiso para WhatsApp es aparte y opcional. */
  function registerPatient({ clinicId, qrId, firstName, lastName, phone, email, password, referralCode, aceptaPrivacidad, aceptaWhatsApp }) {
    const store = window.ABBA.store;
    const events = window.ABBA.events;
    const clinic = store.get("clinics", clinicId);
    if (!clinic || clinic.status !== "active") return { error: "Elige una clínica válida." };
    if (aceptaPrivacidad !== true) return { error: "Para crear tu cuenta necesitas aceptar el aviso de privacidad." };
    firstName = String(firstName || "").trim().replace(/\s+/g, " ");
    lastName = String(lastName || "").trim().replace(/\s+/g, " ");
    if (!firstName || !lastName) return { error: "Escribe tu nombre y tus apellidos." };
    const tel = normPhone(phone);
    if (tel.length < 10) return { error: "Escribe tu celular a 10 dígitos." };
    if (store.listByClinic("patients", clinicId, (p) => normPhone(p.phone) === tel).length) return { error: "Ese celular ya tiene cuenta en esta clínica. Entra con él." };
    if (password != null && String(password).length < 6) return { error: "La contraseña debe tener al menos 6 caracteres." };

    // Puntos: los que configuró el doctor en Fidelización (ver lib/puntos.js).
    const P = window.ABBA.puntos, cfg = P.config(clinic);

    const user = store.insert("users", { role: ROLES.PATIENT, phone: phone || null, email: email || null });
    const levels = store.listByClinic("loyalty_levels", clinicId);
    const baseLevel = levels.slice().sort((a, b) => a.min_points - b.min_points)[0];

    const ahora = new Date().toISOString();
    const patient = store.insert("patients", {
      clinic_id: clinicId, user_id: user.id, first_name: firstName, last_name: lastName,
      username: null, password: password || null,
      phone: phone || "", email: email || null, points_balance: 0, level_id: baseLevel ? baseLevel.id : null,
      last_visit_at: null, source_qr_id: qrId || null,
      // Consentimiento expreso: qué versión del aviso aceptó y cuándo (en el servidor, la hora es la del servidor).
      privacidad_version: AVISO_VERSION, privacidad_aceptada_at: ahora,
      whatsapp_optin: aceptaWhatsApp === true, whatsapp_optin_at: aceptaWhatsApp === true ? ahora : null,
      whatsapp_optin_version: aceptaWhatsApp === true ? AVISO_VERSION : null
    });

    P.otorgar({ patientId: patient.id, amount: cfg.registro, type: "signup", description: "Puntos de bienvenida", silencioso: true });

    // --- Código de referido (si vino uno y es válido) ---
    if (referralCode) {
      const code = referralCode.trim().toUpperCase();
      const referrer = store.listByClinic("patients", clinicId).find((p) => p.id !== patient.id && ("REF-" + p.id.slice(-5).toUpperCase()) === code);
      if (referrer) {
        P.otorgar({ patientId: patient.id, amount: cfg.invitado, type: "referral", description: "Bono por registrarte con un código de referido", silencioso: true });
        P.otorgar({ patientId: referrer.id, amount: cfg.referido, type: "referral", description: `Referido completado — ${firstName} se registró con tu código` });
        store.insert("referrals", { clinic_id: clinicId, patient_id: referrer.id, code, referred_patient_id: patient.id, status: "completed", points_awarded: cfg.referido });
        events.emit(events.EVENTS.REFERRAL_COMPLETED, { clinicId, patientId: referrer.id, referredName: firstName, vars: { amigo: firstName, puntos_ganados: cfg.referido } });
      }
    }

    if (qrId) {
      const qr = store.list("qr_codes", (q) => q.id === qrId)[0];
      if (qr) store.update("qr_codes", qr.id, { signup_count: (qr.signup_count || 0) + 1 });
    }

    events.emit(events.EVENTS.PATIENT_REGISTERED, { clinicId, patientId: patient.id });

    const session = { role: ROLES.PATIENT, userId: user.id, patientId: patient.id, clinicId };
    setSession(session);
    return { session, patient: store.get("patients", patient.id) };
  }


  /** Inicio de sesión del paciente: clínica + celular + contraseña.
   *  Las cuentas viejas que se hicieron con usuario también pueden entrar con él. */
  function loginPatient({ clinicId, phone, password }) {
    const store = window.ABBA.store;
    const clinic = store.get("clinics", clinicId);
    if (!clinic || clinic.status !== "active") return { error: "Esta clínica no está disponible." };
    const tel = normPhone(phone), uname = normUser(phone);
    const patient = store.listByClinic("patients", clinicId, (p) => p.password === password && ((tel.length === 10 && normPhone(p.phone) === tel) || (p.username && p.username === uname)))[0];
    if (!patient) return { error: "Celular o contraseña incorrectos para esta clínica." };
    const session = { role: ROLES.PATIENT, userId: patient.user_id, patientId: patient.id, clinicId };
    setSession(session);
    return { session, patient };
  }

  /** Demo: acceso directo por rol para mostrar el dashboard de doctor/admin. */
  function loginStaff({ role, clinicId }) {
    const session = { role, clinicId: clinicId || null };
    setSession(session);
    return { session };
  }

  /** Crea una clínica y, en el mismo paso, el usuario/contraseña de su doctor
   *  (esto es lo que hará el equipo de ABBA desde el panel de administrador
   *  cada vez que entre un cliente nuevo). `password` se guarda en texto
   *  plano SOLO porque todavía no hay backend — en cuanto se conecte
   *  Supabase Auth, esto se reemplaza por su sistema de contraseñas
   *  (hasheadas del lado del servidor), nunca a mano. */
  function createClinicWithDoctor({ clinicId, clinicName, doctorUsername, doctorPassword }) {
    const store = window.ABBA.store;
    if (store.get("clinics", clinicId)) return { error: "Ese identificador ya está en uso." };
    if (store.list("users", (u) => u.username === doctorUsername).length) return { error: "Ese usuario ya existe." };

    const clinic = store.insert("clinics", {
      id: clinicId, name: clinicName, logo_url: null, brand_color: null,
      address: "", phone: "", whatsapp: "", maps_url: "", reviews_url: "",
      plan: "Pro", status: "active"
    });
    const user = store.insert("users", {
      role: ROLES.CLINIC_ADMIN, clinic_id: clinicId,
      username: doctorUsername, password: doctorPassword
    });

    // Niveles y estado base para que la clínica no arranque vacía de config.
    store.insert("loyalty_levels", { clinic_id: clinicId, name: "Inicial", min_points: 0, max_points: 499, icon: "inicial", sort_order: 1 });
    store.insert("loyalty_levels", { clinic_id: clinicId, name: "Frecuente", min_points: 500, max_points: 1499, icon: "frecuente", sort_order: 2 });
    store.insert("loyalty_levels", { clinic_id: clinicId, name: "VIP", min_points: 1500, max_points: 2999, icon: "vip", sort_order: 3 });
    store.insert("loyalty_levels", { clinic_id: clinicId, name: "Premium", min_points: 3000, max_points: 999999, icon: "premium", sort_order: 4 });
    store.insert("qr_codes", { clinic_id: clinicId, name: "Recepción", destination: "join", active: true, scan_count: 0, signup_count: 0 });
    window.ABBA.demoData && window.ABBA.demoData.seedClinicDefaults && window.ABBA.demoData.seedClinicDefaults(clinicId);
    store.update("clinics", clinicId, { automations_v2: true, automations_v3: true });

    return { clinic, user };
  }

  /** Borra una clínica y TODO lo que le pertenece (con la base real, también las cuentas). */
  function borrarClinica(clinicId) {
    const store = window.ABBA.store;
    store.TABLES.forEach((table) => {
      if (table === "clinics") return;
      store.list(table, (r) => r.clinic_id === clinicId).forEach((r) => store.remove(table, r.id));
    });
    store.remove("clinics", clinicId);
    return {};
  }

  /** Login real por usuario/contraseña — para ABBA (SUPER_ADMIN) y ABBA Doctors. */
  function loginWithCredentials({ username, password, allowedRoles }) {
    const store = window.ABBA.store;
    const user = store.list("users", (u) => u.username === username && u.password === password)[0];
    if (!user) return { error: "Usuario o contraseña incorrectos." };
    if (allowedRoles && !allowedRoles.includes(user.role)) return { error: "Este usuario no tiene acceso aquí." };
    // Un cliente "apagado" por ABBA no puede entrar, aunque su usuario/contraseña sean correctos.
    if (user.clinic_id) {
      const clinic = store.get("clinics", user.clinic_id);
      if (!clinic || clinic.status !== "active") return { error: "Esta clínica está desactivada. Contacta a ABBA para más información." };
    }
    const session = { role: user.role, userId: user.id, clinicId: user.clinic_id || null };
    setSession(session);
    return { session, user };
  }

  // ---- Contraseñas (con la base real, lib/nube.js las cambia en el sistema de cuentas)
  /** Contraseña provisional fácil de dictar: sin letras que se confunden (l, o, i, 0, 1). */
  function contrasenaTemporal() {
    const abc = "abcdefghjkmnpqrstuvwxyz23456789";
    return Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => abc[b % abc.length]).join("");
  }
  /** Quien tiene la sesión (doctor, ABBA o paciente) cambia su propia contraseña. */
  function cambiarContrasena({ actual, nueva }) {
    const store = window.ABBA.store, s = getSession();
    if (!s) return { error: "Tu sesión terminó. Vuelve a entrar." };
    if (String(nueva || "").length < 6) return { error: "La contraseña nueva debe tener al menos 6 caracteres." };
    if (actual === nueva) return { error: "La contraseña nueva debe ser distinta a la actual." };
    const tabla = s.role === ROLES.PATIENT ? "patients" : "users";
    const fila = store.get(tabla, s.role === ROLES.PATIENT ? s.patientId : s.userId);
    if (!fila || fila.password !== actual) return { error: "Tu contraseña actual no es correcta." };
    store.update(tabla, fila.id, { password: nueva });

  /** El doctor le da una contraseña nueva a un paciente que olvidó la suya. */
  function restablecerPaciente(patientId) {
    const store = window.ABBA.store, s = getSession();
    const p = store.get("patients", patientId);
    if (!s || !p || p.clinic_id !== s.clinicId || (s.role !== ROLES.CLINIC_ADMIN && s.role !== ROLES.STAFF)) return { error: "No encontramos la cuenta de ese paciente." };
    const password = contrasenaTemporal();
    store.update("patients", p.id, { password });
    return { password };
  }
  /** ABBA le da una contraseña nueva al doctor de una clínica. */
  function restablecerDoctor(clinicId) {
    const store = window.ABBA.store, s = getSession();
    const u = store.list("users", (x) => x.role === ROLES.CLINIC_ADMIN && x.clinic_id === clinicId)[0];
    if (!s || s.role !== ROLES.SUPER_ADMIN || !u) return { error: "Esta clínica no tiene cuenta de doctor." };
