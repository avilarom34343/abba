  /** Único lugar que cambia el estado de una cita — lo usan el selector
   *  manual y el chat de citas, así nunca se duplica la lógica de puntos. */
  function setAppointmentStatus(appt, newStatus) {
    const before = appt.status;
    if (newStatus === before) return;
    store.update("appointments", appt.id, { status: newStatus });
    const ctx = { clinicId: appt.clinic_id, patientId: appt.patient_id, appointmentId: appt.id };
    const EV = events.EVENTS;
    if (newStatus === "completed") completeAppointment(appt);
    // Aviso dentro del portal del paciente (esto sí le llega; WhatsApp va por su automatización).
    if (newStatus === "confirmed") {
      notify.replyToPatient({ clinicId: appt.clinic_id, patientId: appt.patient_id, body: `Tu cita de ${appt.service_name} del ${formatDateLong(appt.date)} a las ${appt.time} quedó confirmada. Te esperamos.` });
      events.emit(EV.APPOINTMENT_CONFIRMED, ctx);
    }
    if (newStatus === "cancelled") {
      notify.replyToPatient({ clinicId: appt.clinic_id, patientId: appt.patient_id, body: `Tu cita de ${appt.service_name} del ${formatDateLong(appt.date)} quedó cancelada. Cuando quieras, agenda una nueva desde tu portal.` });
      events.emit(EV.APPOINTMENT_CANCELLED, ctx);
    }
    if (newStatus === "no_show") events.emit(EV.APPOINTMENT_NO_SHOW, ctx);
  }

  /** Asistió: suma los puntos de su servicio (los que puso el doctor), guarda
   *  la visita y dispara "asistió". La opinión se la pide el motor unas horas después. */
  function completeAppointment(appt) {
    const service = store.get("services", appt.service_id);
    const patient = store.get("patients", appt.patient_id);
    if (!patient) return;
    const gained = window.ABBA.puntos.porServicio(appt.clinic_id, service);
    const r = window.ABBA.puntos.otorgar({ patientId: patient.id, amount: gained, type: "visit", description: `Asistencia: ${appt.service_name}`, ref: "cita:" + appt.id, silencioso: true });
    // La "última visita" es la FECHA DE LA CITA (no el momento en que se marcó).
    const prev = patient.last_visit_at ? utils.localDate(patient.last_visit_at) : null;
    const visit = !prev || appt.date > prev ? new Date(utils.instante(appt.date, "12:00")).toISOString() : patient.last_visit_at;
    store.update("patients", patient.id, { last_visit_at: visit });
    store.update("appointments", appt.id, { completed_at: new Date().toISOString() });

    const ctx = { clinicId: appt.clinic_id, patientId: patient.id, appointmentId: appt.id, vars: { puntos_ganados: r.amount } };
    events.emit(events.EVENTS.APPOINTMENT_COMPLETED, ctx);
    events.emit(events.EVENTS.POINTS_EARNED, ctx);
    if (r.levelUp) events.emit(events.EVENTS.LEVEL_UP, { clinicId: appt.clinic_id, patientId: patient.id, levelName: r.levelUp.name, vars: { nivel: r.levelUp.name } });
  }

  function rescheduleAppointmentAndNotify(appt, newDate, newTime) {
    store.update("appointments", appt.id, { date: newDate, time: newTime, status: "confirmed" });
    const patient = store.get("patients", appt.patient_id);
    const body = `Hola ${patient.first_name}, tu cita de ${appt.service_name} quedó reagendada para el ${formatDateLong(newDate)} a las ${newTime}.`;
    notify.replyToPatient({ clinicId: appt.clinic_id, patientId: appt.patient_id, body });
    // El WhatsApp sale por la automatización "Cita reagendada" (texto editable).
    events.emit(events.EVENTS.APPOINTMENT_RESCHEDULED, { clinicId: appt.clinic_id, patientId: appt.patient_id, appointmentId: appt.id });
    return { status: whatsapp.isConnected(appt.clinic_id) ? "sent" : "blocked" };
  }

  // ============================================================ Chat/voz de citas (IA)
  function buildDoctorChatWidget(cid, onUpdate, enModal) {
    const wrap = el("div", { class: "card card-pad doc-chat" + (enModal ? " en-modal" : "") });
    wrap.appendChild(el("div", { class: "doc-chat-cab" }, [
      el("div", { class: "doc-chat-dot", "data-dot-slot": "", "data-dot-tam": enModal ? "110" : "130", "data-dot-frase": enModal ? "" : "Escríbeme qué pasó con tus citas y yo las actualizo.", "data-dot-gesto": "saludar" }, [I("sparkle", { size: 22 })]),
      el("div", { class: "doc-chat-tit" }, [
        el("b", {}, ["Tu asistente de agenda: escríbele o háblale"]),
        el("p", { class: "text-soft text-sm" }, ['Ej: "Ximena no asistió, reagenda a Valeria el martes a las 8" o "¿qué citas tengo mañana?"'])
      ]),
    ]));
    wrap.appendChild(el("p", { class: "text-soft text-xs mt-2" }, ["Asistente automático de agenda: actualiza citas y contesta sobre tu agenda. No da orientación clínica. Revisa siempre lo que cambió."]));

    const bar = el("div", { class: "ai-bar mt-3" });
    const input = el("input", { type: "text", placeholder: "Escribe o usa el micrófono…" });
    const micBtn = el("button", { class: "btn btn-secondary btn-icon", "aria-label": "Hablar" }, [
      el("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.8", "stroke-linecap": "round" }, [el("path", { d: "M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" }), el("path", { d: "M19 11a7 7 0 0 1-14 0M12 19v3" })])
    ]);
    const sendBtn = el("button", { class: "btn btn-primary btn-icon", "aria-label": "Enviar" }, [
      el("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round" }, [el("path", { d: "M5 12h14M13 5l7 7-7 7" })])
    ]);
    bar.appendChild(input); bar.appendChild(micBtn); bar.appendChild(sendBtn);
    wrap.appendChild(bar);

    const log = el("div", { class: "ai-thread mt-3" });
    wrap.appendChild(log);

    // Reconocimiento de voz nativo del navegador — sin API, sin costo.
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.disabled = true;
      micBtn.title = "Tu navegador no soporta dictado por voz (funciona en Chrome/Edge)";
    } else {
      const rec = new SR();
      rec.lang = "es-MX";
      rec.interimResults = false;
      rec.onresult = (e) => { input.value = e.results[0][0].transcript; submit(); };
      rec.onerror = () => toast("No se pudo escuchar el micrófono", "danger");
      micBtn.addEventListener("click", () => { toast("Escuchando…"); rec.start(); });
    }

    async function submit() {
      const message = input.value.trim();
      if (!message) return;
      log.appendChild(el("div", { class: "ai-msg user" }, [message]));
      input.value = "";
      const typing = el("div", { class: "ai-msg bot typing" }, [el("i"), el("i"), el("i")]);
      log.appendChild(typing);
      window.ABBA.dot("pensar");

      const appts = store.listByClinic("appointments", cid, (a) => a.status !== "cancelled" && a.status !== "completed")
        .map((a) => ({ id: a.id, patientName: patientName(store.get("patients", a.patient_id)), service: a.service_name, date: a.date, time: a.time, status: a.status }));

      const result = await window.ABBA.ai.parseDoctorUpdates({ message, appointments: appts });
      typing.remove();
      window.ABBA.dot("pensar-fin");
      window.ABBA.dot(result.updates.length ? "celebrar" : "asentir");
      log.appendChild(el("div", { class: "ai-msg bot" }, [result.response]));

      result.updates.forEach((u) => {
        const apptRef = appts.find((a) => norm(a.patientName).includes(norm(u.patientName.split(" ")[0])));
        const appt = apptRef ? store.get("appointments", apptRef.id) : null;
        if (!appt) { log.appendChild(el("div", { class: "ai-msg bot" }, [`No encontré la cita de "${u.patientName}".`])); return; }
        const name = apptRef.patientName;
        if (u.status === "reschedule" && u.newDate && u.newTime) {
          const send = rescheduleAppointmentAndNotify(appt, u.newDate, u.newTime);
          log.appendChild(el("div", { class: "ai-msg bot" }, [`${name}: reagendada al ${formatDateLong(u.newDate)} a las ${u.newTime}. Ya lo ve en su portal${send.status === "sent" ? " y le llegó por WhatsApp" : " (WhatsApp aún no conectado)"}.`]));
        } else if (["confirmed", "pending", "completed", "cancelled", "no_show"].includes(u.status)) {
          setAppointmentStatus(appt, u.status);
          const label = { confirmed: "confirmada", pending: "pendiente", completed: "asistió (puntos sumados)", cancelled: "cancelada", no_show: "no asistió" }[u.status];
          log.appendChild(el("div", { class: "ai-msg bot" }, [`${name}: ${label}`]));
        }
      });
      if (result.updates.length) {
        onUpdate();
      }
      if (!enModal) log.scrollIntoView({ behavior: "smooth", block: "end" });
    }
    function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    sendBtn.addEventListener("click", submit);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

    return wrap;
  }

  // ============================================================ Pacientes
  // Todo con el reloj de la clínica (utils.patientVisitInfo): última visita =
  // la cita completada más reciente; próxima cita = la siguiente de hoy en
  // adelante. Antes se restaban milisegundos y salían días corridos o "9999".
  function visitLabel(v) {
    if (v.neverVisited) return `Sin visitas · registrado ${relDays(v.daysSinceSignup)}`;
    return `Última visita ${relDays(v.daysSinceVisit)} (${formatDate(v.lastVisit)})`;
  }
  function renderPatients(params, container) {
    const cid = clinicId();
    const content = el("div", {});
    const total = store.listByClinic("patients", cid).length;
    content.appendChild(el("div", { class: "page-header", style: "padding-inline:0;" }, [el("h1", {}, ["Pacientes"]), el("p", {}, [`${total} registrados en tu clínica`])]));
    const search = el("input", { type: "search", class: "search-input", placeholder: "Buscar por nombre, usuario o teléfono" });
    content.appendChild(search);
    const chips = el("div", { class: "chip-row mt-3" });
    const filters = ["Todos", "Activos", "Inactivos", "VIP", "Nuevos", "Con próxima cita", "Sin visitas", "Con recompensa por entregar"];
    const chipEls = filters.map((f, i) => el("button", { class: "chip" + (i === 0 ? " active" : "") }, [f]));
    chipEls.forEach((c) => chips.appendChild(c));
    content.appendChild(chips);
    const listWrap = el("div", { class: "mt-4" });
    content.appendChild(listWrap);

    const levels = store.listByClinic("loyalty_levels", cid);
    let activeFilter = "Todos", term = "";
    try { if (sessionStorage.getItem("abba_patient_filter") === "rewards") { activeFilter = "Con recompensa por entregar"; sessionStorage.removeItem("abba_patient_filter"); } } catch (e) {}
    const pendingRewards = new Set(store.listByClinic("reward_redemptions", cid, (r) => r.status === "pending").map((r) => r.patient_id));

    function draw() {
      chipEls.forEach((c, i) => c.classList.toggle("active", filters[i] === activeFilter));
      listWrap.innerHTML = "";
      const rows = store.listByClinic("patients", cid).map((p) => ({ p, v: patientVisitInfo(p), lvl: computeLevel(p.points_balance, levels).current })).filter(({ p, v, lvl }) => {
        const inactiveDays = v.neverVisited ? v.daysSinceSignup : v.daysSinceVisit;
        if (activeFilter === "Activos" && !(v.next || (!v.neverVisited && v.daysSinceVisit <= 60))) return false;
        if (activeFilter === "Inactivos" && (v.next || inactiveDays <= 60)) return false;

        if (activeFilter === "Nuevos" && v.daysSinceSignup > 14) return false;

        return true;
      });

  // ============================================================ Derechos ARCO
  const ARCO_TIPOS = { acceso: "Acceso", rectificacion: "Rectificación", cancelacion: "Cancelación", oposicion: "Oposición", eliminar_cuenta: "Eliminar cuenta y datos", revocar: "Revocar consentimiento" };

  /** La ley da 20 días hábiles para responder desde que se recibe la solicitud. */
  function diasHabiles(desdeIso, n) {
    let d = utils.localDate(desdeIso), contados = 0;
    while (contados < n) { d = utils.addDays(d, 1); const w = utils.dayOfWeek(d); if (w !== 0 && w !== 6) contados++; }
    return d;
  }
  function seccionArco(cid, rerender) {
    const wrap = el("div", {});
    const lista = store.listByClinic("arco_requests", cid).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));

    wrap.appendChild(el("h2", { class: "section-title mt-6" }, [`Solicitudes de privacidad (ARCO)${abiertas ? ` · ${abiertas} por atender` : ""}`]));
    if (!lista.length) {

    }
    const ul = el("ul", { class: "card" });
    lista.forEach((x) => {
      const [cls, txt] = ARCO_ESTADOS[x.estado || "recibida"] || ARCO_ESTADOS.recibida;
      const limite = diasHabiles(x.created_at, 20);
      ul.appendChild(el("li", { class: "list-item", onclick: () => abrirArco(x, rerender) }, [
        el("div", { class: "main" }, [el("b", {}, [`${ARCO_TIPOS[x.tipo] || x.tipo} · ${x.nombre || "Sin nombre"}`]), el("span", {}, [`Folio ${String(x.id).slice(-6).toUpperCase()} · recibida ${formatDate(x.created_at)} · responder a más tardar el ${formatDateLong(limite)}`])]),
        el("span", { class: "badge " + cls }, [txt])
      ]));
    });
    wrap.appendChild(ul);
    return wrap;
  }

  // ============================================================ Automatizaciones
  // Los momentos (y sus variables) viven en lib/automations.js: el mismo motor

  function friendlyEventLabels() { return Object.fromEntries(automations.DISPARADORES.map((d) => [d.key, d.label])); }
  /** "24 h antes", "3 h después", "60 días": el momento exacto que eligió el doctor. */
  function momentoExtra(a) {
    const d = automations.disparador(a.event_key);
    if (!d) return "";
    if (d.tipo === "antes_cita") return ` · ${automations.horas(a)} h antes`;
    if (d.tipo === "despues_cita") return ` · ${automations.horas(a)} h después`;
    if (a.event_key === window.ABBA.events.EVENTS.PATIENT_INACTIVE) return ` · ${automations.dias(a)} días`;
    return "";
  }
  /** Con WhatsApp conectado, cada texto lo revisa WhatsApp (Meta) antes de poder salir. */

    let [cls, txt] = map[a.plantilla_estado] || map.pendiente;
    // Mientras WhatsApp revisa un texto nuevo, sigue saliendo el que ya aprobó.
    if (a.plantilla_aprobada && (a.plantilla_estado === "pendiente" || a.plantilla_estado === "en_revision")) txt += " (sale el texto anterior)";
    return el("span", { class: "badge " + cls, title: a.plantilla_motivo || "" }, [txt]);
  }

    const msg = el("textarea", { rows: "4", placeholder: "Escribe tu mensaje. Puedes usar {{nombre}} y {{puntos}}." }, [existing ? existing.message || "" : ""]);

    drop.addEventListener("click", () => picker.click());

  function estimateSegmentSize(cid, segment) {
    const patients = store.listByClinic("patients", cid);
    const levels = store.listByClinic("loyalty_levels", cid);
    const month = todayISO().slice(5, 7);
    if (segment === "Pacientes inactivos") return automations.getPatientsAtRisk(cid, 60).length;
    if (segment === "VIP") return patients.filter((p) => { const l = computeLevel(p.points_balance, levels).current; return l && (l.name === "VIP" || l.name === "Premium"); }).length;
    if (segment === "Nuevo") return patients.filter((p) => utils.daysSince(p.created_at) <= 14).length;
    if (segment === "Sin próxima cita") return patients.filter((p) => !patientVisitInfo(p).next).length;
    if (segment === "Con próxima cita") return patients.filter((p) => !!patientVisitInfo(p).next).length;
    if (segment === "Cumpleaños del mes") return patients.filter((p) => p.birthday && p.birthday.slice(5, 7) === month).length;
    return patients.length;
  }

    const cid = clinicId();

      listWrap.appendChild(el("div", { class: "flex-between", style: "margin-bottom:10px;" }, [

      ]));

  function sendReactivationMessage(patient) {

    const result = automations.enviarAhora(automation, { clinicId: patient.clinic_id, patientId: patient.id, texto: "Hola {{nombre}}, hace tiempo no te vemos en {{clinica}}. Agenda cuando quieras: {{enlace}}" });
    notify.replyToPatient({ clinicId: patient.clinic_id, patientId: patient.id, body: result.body });
    if (result.status === "queued") toast("Mensaje en camino por WhatsApp", "success");
    else if (result.status === "failed") toast("Le llegó a su portal. Por WhatsApp no: " + (result.reason || "no se pudo enviar."));
    else toast("Le llegó a su portal. Por WhatsApp aún no (no conectado).");

  // ============================================================ Reseñas (Google Maps y en la app)
  // Las de Google llegan solas cada 30 minutos cuando la clínica conecta su Perfil
  // de Negocio; de cada una nueva llega un aviso (urgente si es de 3 estrellas o menos).
  const VUELTA_GOOGLE = {
    ok: ["Listo: Google quedó conectado y ya trajimos tus reseñas.", "success"],
    elegir: ["Tu cuenta de Google tiene varios negocios: elige cuál es tu clínica.", null],
    sin_permiso: ["No se dio el permiso en Google. Puedes intentarlo otra vez.", "danger"],
    caducado: ["El enlace caducó. Toca «Conectar con Google» otra vez.", "danger"],
    sin_llave: ["Google no dio el acceso completo. Quita a ABBA de tu cuenta de Google y vuelve a conectar.", "danger"],
    sin_negocio: ["Esa cuenta de Google no administra ningún negocio en Google Maps. Entra con la que administra la ficha de tu clínica.", "danger"],
    error: ["No se pudo conectar con Google. Inténtalo de nuevo en unos minutos.", "danger"]
  };
  // Las nuevas se marcan como vistas al abrir esta pantalla, pero siguen resaltadas mientras estés en ella.
  const resaltadasAhora = new Set();

  function renderResenas(params, container) {
    const cid = clinicId(), c = clinic();
    const rerender = () => renderResenas(params, resetContainer());
    const vuelta = new URLSearchParams(location.hash.split("?")[1] || "").get("google");
    if (vuelta && VUELTA_GOOGLE[vuelta]) {
      toast(VUELTA_GOOGLE[vuelta][0], VUELTA_GOOGLE[vuelta][1] || undefined);
      history.replaceState(null, "", "#/doctor/resenas");
    }
    const lista = resenasGoogle(cid);
    lista.filter((r) => r.nueva && !r.vista).forEach((r) => resaltadasAhora.add(r.id));
    const content = el("div", {});
    content.appendChild(el("div", { class: "page-header", style: "padding-inline:0;" }, [el("h1", {}, ["Reseñas"]), el("p", {}, ["Lo que dicen de tu clínica en Google Maps y lo que califican tus pacientes en la app."])]));
    content.appendChild(tarjetaGoogle(c, rerender));

    const pestanas = [["google", "Google Maps"], ["app", "En la app"]];
    const filtros = [["todas", "Todas"], ["nuevas", "Nuevas"], ["bajas", "3 estrellas o menos"], ["sin_respuesta", "Sin responder"]];
    let pestana = "google", filtro = "todas";
    const fila = el("div", { class: "chip-row mt-5" });
    const pestEls = pestanas.map(([k, label]) => el("button", { class: "chip", onclick: () => { pestana = k; dibujar(); } }, [label]));
    pestEls.forEach((b) => fila.appendChild(b));
    content.appendChild(fila);
    const filaFiltros = el("div", { class: "chip-row mt-2" });
    const filtroEls = filtros.map(([k, label]) => el("button", { class: "chip", onclick: () => { filtro = k; dibujar(); } }, [label]));
    filtroEls.forEach((b) => filaFiltros.appendChild(b));
    content.appendChild(filaFiltros);
    const host = el("div", { class: "mt-4" });
    content.appendChild(host);

    function dibujar() {
      pestEls.forEach((b, i) => b.classList.toggle("active", pestanas[i][0] === pestana));
      filtroEls.forEach((b, i) => b.classList.toggle("active", filtros[i][0] === filtro));
      filaFiltros.style.display = pestana === "google" ? "" : "none";
      host.innerHTML = "";
      if (pestana === "app") { host.appendChild(opinionesApp(cid)); return; }
      const filas = lista.filter((r) => filtro === "todas" || (filtro === "nuevas" ? resaltadasAhora.has(r.id) : filtro === "bajas" ? r.estrellas && r.estrellas <= 3 : !r.respuesta));
      if (!filas.length) {
        host.appendChild(emptyState({ title: lista.length ? "Nada con ese filtro" : "Todavía no hay reseñas de Google", text: c.google_conectado ? "Cuando alguien deje una reseña en Google, aparece aquí y te avisamos." : "Conecta Google Maps arriba para verlas aquí." }));
        return;
      }

      if (!nube) card.appendChild(el("p", { class: "text-soft text-sm mt-2" }, [DEMO ? "En la demo no se conecta Google. Abajo ves reseñas de ejemplo." : "Se conecta en la versión real (con la base de datos)."]));
      else if (puede) card.appendChild(el("button", { class: "btn btn-primary btn-sm mt-3", onclick: async (e) => {
        const b = e.currentTarget; b.disabled = true;

        el("p", { class: "text-soft text-xs", style: "margin:2px 0 0;" }, [c.google_revisado_at ? `Revisado ${timeAgo(c.google_revisado_at)} · se revisa solo cada 30 minutos` : "Se revisa solo cada 30 minutos"])

    const mapa = c.google_maps || c.maps_url;
    card.appendChild(el("div", { style: "display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;" }, [

        const b = e.currentTarget; b.disabled = true;

      ])
    ]));
    const filters = [["all", "Todas"], ["urgent", "Urgentes"], ["message", "Mensajes"], ["review", "Opiniones"], ["booking", "Citas"]];
    let active = "all";
    try { const f = sessionStorage.getItem("abba_notif_filter"); if (f) { active = f === "review_low" ? "urgent" : f; sessionStorage.removeItem("abba_notif_filter"); } } catch (e) {}

      chipEls.forEach((c, i) => c.classList.toggle("active", filters[i][0] === active));

      if (!rows.length) { host.appendChild(emptyState({ title: "Nada por aquí", text: "Cuando un paciente haga algo, te avisamos al momento." })); return; }
      rows.forEach((n) => host.appendChild(notifRow(n, () => renderNotifications(params, resetContainer()))));

    chipEls.forEach((c, i) => c.addEventListener("click", () => { active = filters[i][0]; draw(); }));

  function notifRow(n, refresh) {
    const p = n.patient_id ? store.get("patients", n.patient_id) : null;

  /** "Avisos en este celular": con la base real llegan aunque la app esté cerrada. */

  async function enableSystemNotifications() {
    if (window.ABBA.nube) {
      const r = await window.ABBA.nube.activarAvisos().catch(() => ({ error: "No pudimos activar los avisos. Inténtalo de nuevo." }));

      if (!r.error) window.ABBA.router.render({ keepScroll: true });

      toast(p === "granted" ? "Listo: te avisaremos aunque tengas otra pestaña abierta" : "No se activaron los avisos del sistema", p === "granted" ? "success" : "danger");
      if (p === "granted") window.ABBA.router.render({ keepScroll: true });

  // ---- Avisos en vivo --------------------------------------------------------
  // Cuando llega una notificación nueva (el paciente hizo algo en su portal),

  let seenIds = null;
  function checkLive() {
    const cid = clinicId();
    if (!cid || !session() || session().role === "PATIENT") return;
    const all = notify.list(cid);
    if (seenIds === null) { seenIds = new Set(all.map((n) => n.id)); return; }
    const fresh = all.filter((n) => !seenIds.has(n.id));

    fresh.slice(0, 3).reverse().forEach(showLiveToast);
    if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
      fresh.slice(0, 3).forEach((n) => { try { new Notification(n.title, { body: n.body, tag: n.id, requireInteraction: n.priority === "urgent" }); } catch (e) {} });
    }
    // Refrescar la campana y la pantalla si es una lista que muestra esto.

  }
  function showLiveToast(n) {
    let root = document.getElementById("live-root");
    if (!root) { root = el("div", { id: "live-root", "aria-live": "assertive" }); document.body.appendChild(root); }
    const p = n.patient_id ? store.get("patients", n.patient_id) : null;
    const card = el("div", { class: "live-toast" + (n.priority === "urgent" ? " urgent" : "") }, [
      el("span", { class: "notif-ico t-" + n.type }, [I(NOTIF_ICON[n.type] || "bell", { size: 18 })]),
      el("div", { class: "live-main" }, [el("b", {}, [n.title]), el("p", {}, [n.body])]),
      el("div", { class: "live-actions" }, [
        p && p.phone && n.priority === "urgent" ? el("a", { class: "btn btn-primary btn-sm", href: "tel:" + p.phone, onclick: () => notify.markRead(n.id) }, [I("phone", { size: 14 }), "Llamar"]) : null,
        el("button", { class: "icon-btn", "aria-label": "Cerrar", onclick: () => card.remove() }, [I("close", { size: 14 })])
      ])
    ]);
    card.addEventListener("click", (e) => { if (e.target.closest("a,button")) return; card.remove(); if (!abrirAviso(n, p)) window.ABBA.router.go("#/doctor/notifications"); });
    root.appendChild(card);
    setTimeout(() => card.classList.add("out"), n.priority === "urgent" ? 14000 : 7000);
    setTimeout(() => card.remove(), n.priority === "urgent" ? 14500 : 7500);
  }
  window.addEventListener("abba:sync", checkLive);
  setInterval(checkLive, 4000); // respaldo por si el navegador no avisa del cambio
  setTimeout(checkLive, 0);

  // ============================================================ Más (menú móvil)
  function renderMore(params, container) {

    if (!DEMO) ul.appendChild(el("li", { class: "list-item", onclick: cambiarContrasena }, [el("div", { class: "main" }, [el("b", {}, ["Cambiar contraseña"])])]));
    if (window.ABBA.nube) ul.appendChild(el("li", { class: "list-item", onclick: verificacionDosPasos }, [el("div", { class: "main" }, [el("b", {}, ["Verificación en dos pasos"])])]));
    ul.appendChild(el("li", { class: "list-item", onclick: () => { auth.logout(); window.ABBA.router.go("#/"); } }, [el("div", { class: "main" }, [el("b", { style: "color:var(--danger-600);" }, ["Cerrar sesión"])])]));

  window.ABBA.views = window.ABBA.views || {};

  };
})();
