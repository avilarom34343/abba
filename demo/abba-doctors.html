<script>
/* ---- fx/movimiento.js ---- */
/**
 * Capa de movimiento de las apps ABBA (GSAP + ScrollTrigger + SplitText).
 * No toca la lógica de las vistas: mira cuándo cambia #app y anima lo que hay.
 *
 *   .fx-titulo / h1 de página    sube por líneas
 *   tarjetas, filas, listas      aparecen escalonadas al entrar en pantalla
 *   [data-contar]                cuenta desde 0 hasta su valor
 *   [data-barra]                 crece con el scroll
 *   .fx-horizontal               se fija y avanza de lado (solo escritorio)
 *   .btn-primary, .btn-claro     se acercan al cursor
 *   tarjetas                     luz jade que sigue al puntero
 *
 * Tesis de movimiento: entradas de 450-700 ms que frenan suave, sin rebote en la
 * interfaz (el rebote es solo del personaje), escalonados de menos de 400 ms en total.
 * Con "reducir movimiento" todo aparece en su lugar, sin desplazarse.
 */
(function () {
  const gsap = window.gsap, ST = window.ScrollTrigger, Split = window.SplitText;
  const app = document.getElementById("app");
  const reducir = window.matchMedia("(prefers-reduced-motion: reduce)");
  const fx = (window.ABBA.fx = { personaje: null });
  if (gsap) gsap.registerPlugin(...[ST, Split].filter(Boolean));
  const conMovimiento = () => !!gsap && !reducir.matches;

  const TITULOS = ".fx-titulo, .page-header h1, .px-title h1, .px-hello, .px-section-head h2, .px-profile-head h1, .px-welcome-inner h1";
  const REVELAR = [
    ".fx-sube", ".kpi-card", ".ad-num", ".clinic-tile", ".today-item", "ul.card > .list-item", ".data-table tbody tr", ".ad-evento",
    ".px-appt", ".px-reward", ".px-reward-mini", ".auto-card", ".camp-card", ".notif", ".px-list li", ".px-earn-row", ".px-menu-row",
    ".px-ticket", ".card-pad", ".px-empty-card", ".px-review", ".px-banner", ".px-invite", ".px-hero-stat", ".px-balance",
    ".px-assistant", ".px-card-form", ".join-perks li", ".empty-state", ".integration-banner", ".chip-row", ".search-input", ".px-seg", ".px-welcome-list li"
  ].join(",");
  const POP = ".ai-msg, .ai-option-btn, .doc-bubble, .px-bubble";
  const LUZ = ".kpi-card, .ad-num, .clinic-tile, .today-item, .px-reward, .auto-card, .camp-card, .px-reward-mini, .notif, .px-appt, .ad-etapa, .doc-dato";
  const IMAN = ".btn-primary, .btn-claro, .px-send, .fx-iman";
  const fmt = (n) => Math.round(n).toLocaleString("es-MX");

  // ------------------------------------------------------------ personaje
  // Los cuatro personajes viven en cada app; el líder cambia: DOT en ABBA, Perla en Doctors, Brote en Clientes.
  const MODO = { admin: "acompanante", doctor: "asistente", patient: "asistente" }[window.ABBA_APP] || "acompanante";
  function montarPersonaje() {
    const Equipo = window.ABBA_EQUIPO_CLASE;
    if (!Equipo || fx.personaje) return;
    try {
      fx.personaje = new Equipo({
        modo: MODO, lider: window.ABBA_FORMA || "dot", nombreLider: window.ABBA_NOMBRE,
        alClic: MODO === "asistente" ? () => window.ABBA.asistente && window.ABBA.asistente.abrir() : null
      });
      fx.personaje.reubicar();
    } catch (e) { console.warn("[fx] no se pudieron crear los personajes", e); }
  }
  window.addEventListener("abba:personaje", montarPersonaje);
  montarPersonaje();
  window.addEventListener("abba:dot", (e) => {
    const p = fx.personaje; if (!p) return;
    const { gesto, frase, quien } = e.detail || {};
    if (gesto) p.gesto(gesto, quien);
    if (frase) p.decir(frase, quien);
  });

  // Hueco en el encabezado de cada página: qué personaje aparece y qué dice.
  const HUECOS = {
    "#/doctor/appointments": ["capi", "¿Quién vino hoy? Cuéntaselo a Perla aquí abajo.", "senalar-izq"],
    "#/doctor/patients": ["brote", "Aquí están todos tus pacientes. Búscalos por nombre o teléfono.", "saludar"],
    "#/doctor/at-risk": ["brote", "Escríbeles hoy: hace tiempo que no vienen.", "senalar-izq"],
    "#/doctor/loyalty": ["capi", "Tú decides cuántos puntos vale cada visita.", "asentir"],
    "#/doctor/automations": ["dot", "Estos mensajes salen solos cuando pasa algo.", "girar"],
    "#/doctor/campaigns": ["capi", "Arma una campaña con foto o video para un grupo.", "saltar"],
    "#/doctor/notifications": ["dot", "Lo urgente aparece primero.", "senalar-izq"],
    "#/doctor/more": ["brote", "Aquí está todo lo demás.", "saludar"],
    "#/patient/points": ["capi", "Así vas sumando puntos.", "senalar-izq"],
    "#/patient/appointments": ["perla", "Aquí ves tus citas y le escribes al doctor.", "saludar"],
    "#/patient/rewards": ["capi", "Esto puedes canjear con tus puntos.", "saltar"],
    "#/patient/profile": ["dot", "Invita a un amigo y los dos ganan puntos.", "saludar"],
  };
  function ponerHuecoCabecera() {
    const def = HUECOS[location.hash.split("?")[0]];
    const cab = def && app.querySelector(".page-header, .px-title");
    if (!cab || cab.querySelector("[data-dot-slot]")) return;
    const [quien, frase, gesto] = def;
    const h = document.createElement("div");
    h.className = "cab-slot";
    Object.assign(h.dataset, { dotSlot: "", dotQuien: quien, dotFrase: frase, dotGesto: gesto, dotTam: cab.classList.contains("px-title") ? "92" : "120" });
    cab.classList.add("con-dot");
    cab.appendChild(h);
  }
  // El modal tiene sus propios huecos (el asistente abierto desde el personaje)
  const modalRoot = document.getElementById("modal-root");
  if (modalRoot) new MutationObserver(() => { if (fx.personaje) fx.personaje.reubicar(); }).observe(modalRoot, { childList: true });

  // ------------------------------------------------------------ cuándo animar
  // Los cambios que hacen GSAP (el tramo fijo, la división de titulares) o esta misma capa
  // no cuentan: si contaran, cada ajuste dispararía otro y la página se quedaría pensando.
  let ctx = null, mm = null, ultimaRuta = null, programado = false, cambioPantalla = false, tRefresco = 0;
  const nuevos = new Set();
  const PROPIOS = ".pin-spacer, .fx-horizontal, .cab-slot, .fx-brillo, [class^='fx-linea'], [class^='fx-palabra']";
  const observador = new MutationObserver((muts) => {
    for (const m of muts) {
      if (m.target === app) {
        if (Array.from(m.addedNodes).some((n) => n.nodeType === 1 && !n.matches(PROPIOS))) cambioPantalla = true;
      } else {
        m.addedNodes.forEach((n) => { if (n.nodeType === 1 && !n.matches(PROPIOS) && !(n.parentElement && n.parentElement.closest(PROPIOS + ", .fx-titulo-hecho"))) nuevos.add(n); });
      }
    }
    if ((cambioPantalla || nuevos.size) && !programado) { programado = true; queueMicrotask(procesar); }
  });
  const observar = () => observador.observe(app, { childList: true, subtree: true });
  observar();
  // Ejecuta trabajo propio sin escucharse a sí mismo.
  function sinEscuchar(fn) {
    observador.disconnect();
    try { fn(); } finally { observar(); }
  }
  function refrescarLuego() {
    cancelAnimationFrame(tRefresco);
    tRefresco = requestAnimationFrame(() => sinEscuchar(() => { if (ST) ST.refresh(); if (fx.personaje) fx.personaje.reubicar(); }));
  }

  function procesar() {
    programado = false;
    if (cambioPantalla) { cambioPantalla = false; nuevos.clear(); sinEscuchar(prepararPantalla); }
    else if (nuevos.size) { const lista = Array.from(nuevos); nuevos.clear(); sinEscuchar(() => actualizarParcial(lista)); }
  }

  // ------------------------------------------------------------ pantalla completa
  function prepararPantalla() {
    const ruta = location.hash.split("?")[0];
    const refresco = ruta === ultimaRuta;           // misma pantalla redibujada (sincronización): sin entradas
    ultimaRuta = ruta;
    if (ctx) ctx.revert();
    if (mm) mm.revert();
    ctx = null; mm = null;
    ponerHuecoCabecera();
    marcarLuz(app);
    if (fx.personaje) fx.personaje.reubicar();
    if (!conMovimiento()) { app.querySelectorAll("[data-contar]").forEach((n) => { n.textContent = fmt(+n.dataset.contar || 0); }); return; }

    // El tramo fijo va primero: así los ScrollTrigger de abajo se calculan con su espacio ya puesto.
    mm = gsap.matchMedia();
    mm.add("(min-width: 900px)", () => { app.querySelectorAll(".fx-horizontal").forEach(horizontal); });
    mm.add("(max-width: 899px)", () => {
      app.querySelectorAll(".fx-horizontal .ad-etapa").forEach((n) => { delete n.dataset.fxVisto; revelarLibre([n]); });
      app.querySelectorAll(".fx-horizontal [data-contar]").forEach(contar);
    });

    ctx = gsap.context(() => {
      if (!refresco) {
        app.querySelectorAll(TITULOS).forEach(titular);
        revelar(app.querySelectorAll(REVELAR));
        app.querySelectorAll("[data-contar]").forEach((n) => { if (!n.closest(".fx-horizontal")) contar(n); });
        escenas();
      }
      app.querySelectorAll(".ad-barras").forEach(barras);
      app.querySelectorAll(".fx-barra-svg").forEach((r, i) => gsap.from(r, { scaleY: 0, transformOrigin: "50% 100%", duration: 0.7, delay: 0.1 + i * 0.03, ease: "power3.out" }));
      indicadorNav();
    }, app);

    refrescarLuego();
  }

  // ------------------------------------------------------------ cambios dentro de la pantalla (filtros, chat)
  function actualizarParcial(nodos) {
    marcarLuz(app);
    if (fx.personaje) fx.personaje.reubicar();
    if (!conMovimiento()) return;
    if (ctx) ctx.add(() => animarParcial(nodos)); else animarParcial(nodos);
  }
  function animarParcial(nodos) {
    const revelables = [], pops = [];
    nodos.forEach((n) => {
      if (!app.contains(n)) return;
      if (n.matches(POP)) pops.push(n);
      if (n.matches(REVELAR)) revelables.push(n);
      n.querySelectorAll(REVELAR).forEach((x) => revelables.push(x));
      n.querySelectorAll(".fx-barra-svg").forEach((r, i) => gsap.from(r, { scaleY: 0, transformOrigin: "50% 100%", duration: 0.6, delay: i * 0.03, ease: "power3.out" }));
      if (n.matches("[data-contar]")) contar(n);
      n.querySelectorAll("[data-contar]").forEach(contar);
    });
    if (pops.length) gsap.from(pops, { y: 14, scale: 0.96, opacity: 0, duration: 0.45, stagger: 0.06, ease: "power3.out", clearProps: "transform,opacity" });
    if (revelables.length) revelar(revelables, true);
    refrescarLuego();
  }

  // ------------------------------------------------------------ piezas
  function titular(h) {
    if (h.dataset.fxTitulo) return;
    h.dataset.fxTitulo = "1";
    const r = h.getBoundingClientRect();
    const st = r.top > innerHeight * 0.9 ? { trigger: h, start: "top 88%", once: true } : null;
    if (Split && Split.create) {
      h.classList.add("fx-titulo-hecho");
      Split.create(h, {
        type: "lines", mask: "lines", linesClass: "fx-linea", autoSplit: true,
        onSplit(self) {
          return gsap.from(self.lines, { yPercent: 105, duration: 0.85, ease: "expo.out", stagger: 0.07, scrollTrigger: st || undefined });
        }
      });
    } else {
      gsap.from(h, { y: 30, opacity: 0, duration: 0.7, scrollTrigger: st || undefined });
    }
  }

  function revelar(nodos, rapido) { revelarLibre(Array.from(nodos).filter((n) => !n.closest(".fx-horizontal")), rapido); }
  function revelarLibre(nodos, rapido) {
    const vh = innerHeight, ahora = [], luego = [];
    Array.from(nodos).forEach((n) => {
      if (n.dataset.fxVisto) return;
      n.dataset.fxVisto = "1";
      const r = n.getBoundingClientRect();
      (r.top < vh * 0.94 ? ahora : luego).push(n);
    });
    if (ahora.length) {
      gsap.from(ahora, { y: rapido ? 14 : 26, opacity: 0, duration: rapido ? 0.4 : 0.6, ease: "power3.out", clearProps: "transform,opacity",
        stagger: { each: rapido ? 0.025 : 0.045, amount: Math.min(rapido ? 0.25 : 0.36, ahora.length * 0.045) } });
    }
    if (luego.length && ST) {
      gsap.set(luego, { y: 34, opacity: 0 });
      ST.batch(luego, {
        start: "top 92%", once: true,
        onEnter: (lote) => gsap.to(lote, { y: 0, opacity: 1, duration: 0.65, stagger: { each: 0.05, amount: Math.min(0.36, lote.length * 0.05) }, ease: "power3.out", overwrite: true, clearProps: "transform,opacity" })
      });
    }
  }

  function contar(n) {
    if (n.dataset.fxContado) return;
    n.dataset.fxContado = "1";
    const fin = parseFloat(n.dataset.contar) || 0;
    const obj = { v: 0 };
    n.textContent = "0";
    const r = n.getBoundingClientRect();
    gsap.to(obj, {
      v: fin, duration: fin > 999 ? 1.6 : 1.2, ease: "power2.out",
      onUpdate: () => { n.textContent = fmt(obj.v); },
      scrollTrigger: r.top > innerHeight * 0.92 ? { trigger: n, start: "top 90%", once: true } : undefined
    });
  }

  function barras(caja) {
    const cols = caja.querySelectorAll("[data-barra]");
    const valores = caja.querySelectorAll(".ad-barra-valor");
    const tl = gsap.timeline({ scrollTrigger: { trigger: caja, start: "top 88%", end: "bottom 55%", scrub: 0.6 } });
    tl.from(cols, { scaleY: 0, transformOrigin: "50% 100%", ease: "power2.out", stagger: 0.06, duration: 0.5 }, 0)
      .from(valores, { opacity: 0, y: 8, stagger: 0.06, duration: 0.3 }, 0.25);
  }

  function escenas() {
    // Las portadas pino: el texto se separa un poco del fondo al bajar
    app.querySelectorAll(".ad-hero, .doc-hero, .ad-pagina-cab").forEach((s) => {
      const txt = s.firstElementChild;
      if (!txt) return;
      gsap.to(txt, { yPercent: -10, opacity: 0.35, ease: "none", scrollTrigger: { trigger: s, start: "top top", end: "bottom top", scrub: true } });
    });
    app.querySelectorAll(".ad-cab").forEach((c) => {
      const p = c.querySelector("p");
      if (p) gsap.from(p, { y: 14, opacity: 0, duration: 0.6, delay: 0.15, scrollTrigger: c.getBoundingClientRect().top > innerHeight * 0.9 ? { trigger: c, start: "top 88%", once: true } : undefined });
    });
    const tarjeta = app.querySelector(".membership-card");
    if (tarjeta && !tarjeta.classList.contains("card-reveal")) {
      gsap.from(tarjeta, { y: 40, rotateX: 18, opacity: 0, transformPerspective: 900, duration: 0.9, ease: "expo.out", clearProps: "transform,opacity" });
      const brillo = document.createElement("span");
      brillo.className = "fx-brillo"; brillo.setAttribute("aria-hidden", "true");
      tarjeta.appendChild(brillo);
      gsap.fromTo(brillo, { xPercent: -120 }, { xPercent: 220, duration: 1.3, delay: 0.5, ease: "power2.inOut" });
    }
    app.querySelectorAll(".px-ring .fg").forEach((c) => {
      const fin = c.getAttribute("stroke-dashoffset"), total = c.getAttribute("stroke-dasharray");
      gsap.fromTo(c, { attr: { "stroke-dashoffset": total } }, { attr: { "stroke-dashoffset": fin }, duration: 1.1, delay: 0.2, ease: "power2.out" });
    });
    app.querySelectorAll(".membership-progress .fill, .px-hero-track i, .px-mini-track i, .ad-etapa-barra i").forEach((b) => {
      if (b.closest(".fx-horizontal")) return;
      gsap.from(b, { scaleX: 0, transformOrigin: "0 50%", duration: 1, delay: 0.3, ease: "power3.out" });
    });
  }

  // El recorrido del paciente: la sección se fija y las etapas pasan de lado.
  function horizontal(sec) {
    const pista = sec.querySelector(".ad-rec-pista");
    if (!pista) return;
    const distancia = () => Math.max(0, pista.scrollWidth - pista.clientWidth);
    if (distancia() < 40) { revelar(sec.querySelectorAll(".ad-etapa")); return; }
    const etapas = Array.from(pista.children);
    const avance = gsap.to(etapas, {
      x: () => -distancia(), ease: "none",
      scrollTrigger: { trigger: sec, start: "top top+=24", end: () => "+=" + distancia() * 1.4, pin: true, pinSpacing: true, scrub: 0.8, invalidateOnRefresh: true, anticipatePin: 1 }
    });
    const linea = sec.querySelector(".ad-rec-progreso i");
    if (linea) gsap.fromTo(linea, { scaleX: 0 }, { scaleX: 1, ease: "none", transformOrigin: "0 50%", scrollTrigger: { trigger: sec, start: "top top+=24", end: () => "+=" + distancia() * 1.4, scrub: 0.8, invalidateOnRefresh: true } });
    etapas.forEach((et, i) => {
      const valor = et.querySelector("[data-contar]");
      const barra = et.querySelector(".ad-etapa-barra i");
      const tl = gsap.timeline({ scrollTrigger: { trigger: et, containerAnimation: avance, start: i === 0 ? "left 100%" : "left 85%", toggleActions: "play none none reverse" } });
      tl.from(et, { opacity: 0.25, y: 24, duration: 0.5, ease: "power3.out" }, 0);
      if (barra) tl.from(barra, { scaleX: 0, transformOrigin: "0 50%", duration: 0.8, ease: "power3.out" }, 0.1);
      if (valor && !valor.dataset.fxContado) {
        valor.dataset.fxContado = "1";
        const fin = parseFloat(valor.dataset.contar) || 0, obj = { v: 0 };
        valor.textContent = "0";
        tl.to(obj, { v: fin, duration: 1, ease: "power2.out", onUpdate: () => { valor.textContent = fmt(obj.v); } }, 0);
      }
    });
  }

  // Barra lateral: la pastilla del menú se desliza desde donde estaba.
  let navPrevio = null;
  function indicadorNav() {
    const nav = app.querySelector(".sidebar nav");
    const luz = nav && nav.querySelector(".nav-luz");
    const activo = nav && nav.querySelector("a.active");
    if (!luz || !activo) return;
    const destino = { y: activo.offsetTop, h: activo.offsetHeight };
    gsap.set(luz, { opacity: 1, height: destino.h });
    if (navPrevio != null && navPrevio !== destino.y) gsap.fromTo(luz, { y: navPrevio }, { y: destino.y, duration: 0.45, ease: "power3.out" });
    else gsap.set(luz, { y: destino.y });
    navPrevio = destino.y;
  }

  function marcarLuz(raiz) { raiz.querySelectorAll(LUZ).forEach((n) => n.classList.add("fx-luz")); }

  // ------------------------------------------------------------ luz que sigue al cursor (tarjetas)
  document.addEventListener("pointermove", (e) => {
    const t = e.target.closest && e.target.closest(".fx-luz");
    if (!t) return;
    const r = t.getBoundingClientRect();
    t.style.setProperty("--mx", (e.clientX - r.left).toFixed(0) + "px");
    t.style.setProperty("--my", (e.clientY - r.top).toFixed(0) + "px");
  }, { passive: true });

  // ------------------------------------------------------------ botones que se acercan al cursor
  const imanes = new WeakMap();
  document.addEventListener("pointermove", (e) => {
    if (!conMovimiento() || e.pointerType !== "mouse") return;
    const b = e.target.closest && e.target.closest(IMAN);
    if (!b || b.disabled) return;
    let q = imanes.get(b);
    if (!q) {
      q = { x: gsap.quickTo(b, "x", { duration: 0.35, ease: "power3.out" }), y: gsap.quickTo(b, "y", { duration: 0.35, ease: "power3.out" }) };
      imanes.set(b, q);
      b.addEventListener("pointerleave", () => { q.x(0); q.y(0); });
    }
    const r = b.getBoundingClientRect();
    q.x(Math.max(-6, Math.min(6, (e.clientX - (r.left + r.width / 2)) * 0.18)));
    q.y(Math.max(-4, Math.min(4, (e.clientY - (r.top + r.height / 2)) * 0.25)));
  }, { passive: true });

  // Primera pantalla (ya estaba dibujada cuando cargó este archivo)
  if (app.firstElementChild) { cambioPantalla = true; procesar(); }
  window.addEventListener("load", refrescarLuego);
})();

</script>
<script type="module">
// Personaje de ABBA en vivo (DOT y sus dos alternativas) para las apps web.
//
// Se dibuja con Three.js: un shader que "esculpe" el cuerpo con esferas fundidas,
// igual que videos/marca/dot.js (el DOT aprobado para los Reels), pero en tiempo
// real y con lo que una web necesita: brazos que saludan, ojos felices, gestos,
// mirada que sigue al cursor y un "controlador" que lo hace acompañar el scroll.
//
//   crearMotor(canvas, { forma })      solo dibuja (lo usa el estudio de personajes)
//   new Personaje({ modo, forma })     motor + comportamiento (lo usan las apps)
//
// Formas: "dot" (aprobado), "perla" (una muela de gel perlado), "brote" (gel naranja con una hoja),
// "capi" (una cápsula amarilla y perla). Los cuatro forman el equipo de ABBA:
// DOT es la red, Perla los doctores, Brote los pacientes y Capi los números.

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js";

export const FORMAS = {
  dot: {
    id: 0, nombre: "DOT", ojoY: 0.07,
    prof: [0.035, 0.150, 0.110], medio: [0.085, 0.380, 0.265], luz: [0.420, 0.820, 0.620],
    ojo: [0.965, 0.970, 0.955], calido: [0.851, 0.467, 0.341], hoja: [0, 0, 0],
  },
  perla: {
    id: 1, nombre: "Perla", ojoY: 0.17,
    prof: [0.420, 0.520, 0.490], medio: [0.840, 0.890, 0.870], luz: [1.000, 1.000, 0.985],
    ojo: [0.059, 0.239, 0.180], calido: [0.851, 0.467, 0.341], hoja: [0, 0, 0],
  },
  brote: {
    id: 2, nombre: "Brote", ojoY: 0.02,
    prof: [0.420, 0.130, 0.070], medio: [0.860, 0.440, 0.300], luz: [1.000, 0.800, 0.620],
    ojo: [0.040, 0.170, 0.120], calido: [0.950, 0.760, 0.310], hoja: [0.110, 0.430, 0.290],
  },
  capi: {
    id: 3, nombre: "Capi", ojoY: 0.16,
    prof: [0.560, 0.360, 0.050], medio: [0.950, 0.740, 0.250], luz: [1.000, 0.930, 0.700],
    ojo: [0.040, 0.170, 0.120], calido: [0.851, 0.467, 0.341], hoja: [0.800, 0.850, 0.830],
  },
};
export const EQUIPO = ["dot", "perla", "brote", "capi"];

const vertexShader = /* glsl */ `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const fragmentShader = /* glsl */ `
  precision highp float;
  varying vec2 vUv;

  uniform vec2 uRes;
  uniform float uVista;
  uniform vec2 uEscala;      // (ancho, alto): aplastar y estirar
  uniform vec3 uGiro;        // (giro lateral, inclinación, ladeo)
  uniform float uParpadeo;
  uniform float uGuino;      // cierra solo el ojo derecho
  uniform vec2 uMirada;
  uniform vec2 uBrazo;       // (izquierdo, derecho) 0 abajo, 1 arriba
  uniform float uOla;        // fase del saludo
  uniform float uFeliz;      // ojos en arco
  uniform float uSorpresa;   // ojos grandes
  uniform float uPulso;
  uniform float uSombra;
  uniform vec3 uCProf;
  uniform vec3 uCMedio;
  uniform vec3 uCLuz;
  uniform vec3 uCOjo;
  uniform vec3 uCCalido;
  uniform vec3 uCHoja;

  float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
  }
  mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
  float capsula(vec3 p, vec3 a, vec3 b, float r) {
    vec3 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * h) - r;
  }
  float cajaRedonda(vec3 p, vec3 b, float r) {
    vec3 q = abs(p) - b;
    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
  }

  vec3 local(vec3 p) {
    p.y += 0.98; p.xy = rot(uGiro.z) * p.xy; p.y -= 0.98;   // se ladea desde la base
    p.xz = rot(uGiro.x) * p.xz;
    p.yz = rot(uGiro.y) * p.yz;
    p.y = (p.y + 0.98) / uEscala.y - 0.98;                  // aplasta desde el suelo
    p.xz /= uEscala.x;
    return p;
  }

  // Dónde queda la "mano" de un brazo (lado -1 izquierdo, 1 derecho) al levantarlo y saludar.
  vec2 mano(float lado, vec2 base, vec2 alza) {
    float b = lado > 0.0 ? uBrazo.y : uBrazo.x;
    float fase = uOla + (lado > 0.0 ? 0.0 : 1.9);
    vec2 m = base + b * vec2(alza.x * lado, alza.y);
    m.x += sin(fase) * 0.11 * b * lado;
    m.y += cos(fase * 2.0) * 0.025 * b;
    return m;
  }

  float hojaD(vec3 p) {
    vec3 l = p - vec3(0.25, 1.12, 0.0);   // su extremo izquierdo toca la punta del tallo
    l.xy = rot(0.5) * l.xy;
    return (length(l / vec3(0.27, 0.10, 0.07)) - 1.0) * 0.07;
  }

  float cuerpo(vec3 q) {
  #if FORMA == 0
    // DOT: cruz de 4 lóbulos; los de arriba funcionan como brazos
    vec3 f = vec3(1.0, 1.0, 1.6);
    float abre = 1.0 + 0.07 * uPulso;
    float r = 0.44 * (1.0 + 0.05 * uPulso);
    float d = length(q * f * vec3(1.0, 1.06, 1.0)) - 0.66;
    vec2 mi = mano(-1.0, vec2(-0.60, 0.50), vec2(0.16, 0.46)) * abre;
    vec2 md = mano( 1.0, vec2( 0.60, 0.50), vec2(0.16, 0.46)) * abre;
    d = smin(d, length((q - vec3(mi, 0.0)) * f) - r * max(1.0 - 0.2 * uBrazo.x, 0.55), 0.27);
    d = smin(d, length((q - vec3(md, 0.0)) * f) - r * max(1.0 - 0.2 * uBrazo.y, 0.55), 0.27);
    d = smin(d, capsula(q * f, vec3(-0.34, 0.28, 0.0), vec3(mi, 0.0), 0.20) + max(1.0 - uBrazo.x, 0.0) * 0.6, 0.2);
    d = smin(d, capsula(q * f, vec3( 0.34, 0.28, 0.0), vec3(md, 0.0), 0.20) + max(1.0 - uBrazo.y, 0.0) * 0.6, 0.2);
    d = smin(d, length((q - vec3(-0.60, -0.50, 0.0) * abre) * f) - r, 0.27);
    d = smin(d, length((q - vec3( 0.60, -0.50, 0.0) * abre) * f) - r, 0.27);
    return d * 0.62;
  #elif FORMA == 1
    // Perla: una muela con dos raíces y bracitos
    vec3 p = q * vec3(1.0, 1.0, 1.25);
    float d = cajaRedonda(p - vec3(0.0, 0.10, 0.0), vec3(0.40, 0.28, 0.20), 0.30);
    d = smin(d, length(p - vec3(-0.30, 0.46, 0.0)) - 0.32, 0.20);
    d = smin(d, length(p - vec3( 0.30, 0.46, 0.0)) - 0.32, 0.20);
    d = smin(d, capsula(p, vec3(-0.28, -0.15, 0.0), vec3(-0.22, -0.80, 0.0), 0.19), 0.24);
    d = smin(d, capsula(p, vec3( 0.28, -0.15, 0.0), vec3( 0.22, -0.80, 0.0), 0.19), 0.24);
    vec2 mi = mano(-1.0, vec2(-0.86, -0.02), vec2(0.10, 0.62));
    vec2 md = mano( 1.0, vec2( 0.86, -0.02), vec2(0.10, 0.62));
    d = smin(d, capsula(p, vec3(-0.55, 0.02, 0.0), vec3(mi, 0.0), 0.10), 0.10);
    d = smin(d, capsula(p, vec3( 0.55, 0.02, 0.0), vec3(md, 0.0), 0.10), 0.10);
    d = smin(d, length(p - vec3(mi, 0.0)) - 0.14, 0.08);
    d = smin(d, length(p - vec3(md, 0.0)) - 0.14, 0.08);
    return d * 0.7;
  #elif FORMA == 3
    // Capi: una cápsula de dos colores (amarillo arriba, perla abajo) con bracitos y pies
    vec3 p = q * vec3(1.0, 1.0, 1.25);
    float d = capsula(p, vec3(0.0, -0.40, 0.0), vec3(0.0, 0.36, 0.0), 0.56);
    vec2 mi = mano(-1.0, vec2(-0.76, -0.14), vec2(0.12, 0.62));
    vec2 md = mano( 1.0, vec2( 0.76, -0.14), vec2(0.12, 0.62));
    d = smin(d, capsula(p, vec3(-0.46, -0.06, 0.0), vec3(mi, 0.0), 0.10), 0.10);
    d = smin(d, capsula(p, vec3( 0.46, -0.06, 0.0), vec3(md, 0.0), 0.10), 0.10);
    d = smin(d, length(p - vec3(mi, 0.0)) - 0.14, 0.08);
    d = smin(d, length(p - vec3(md, 0.0)) - 0.14, 0.08);
    d = smin(d, length((p - vec3(-0.24, -0.90, 0.06)) * vec3(1.0, 1.6, 1.0)) - 0.17, 0.12);
    d = smin(d, length((p - vec3( 0.24, -0.90, 0.06)) * vec3(1.0, 1.6, 1.0)) - 0.17, 0.12);
    return d * 0.7;
  #else
    // Brote: gota de gel con un tallo y una hoja
    vec3 p = q * vec3(1.0, 1.0, 1.3);
    float d = (length((p - vec3(0.0, -0.13, 0.0)) / vec3(0.80, 0.85, 0.80)) - 1.0) * 0.80;
    vec2 mi = mano(-1.0, vec2(-0.82, -0.20), vec2(0.12, 0.62));
    vec2 md = mano( 1.0, vec2( 0.82, -0.20), vec2(0.12, 0.62));
    d = smin(d, capsula(p, vec3(-0.52, -0.12, 0.0), vec3(mi, 0.0), 0.10), 0.10);
    d = smin(d, capsula(p, vec3( 0.52, -0.12, 0.0), vec3(md, 0.0), 0.10), 0.10);
    d = smin(d, length(p - vec3(mi, 0.0)) - 0.14, 0.08);
    d = smin(d, length(p - vec3(md, 0.0)) - 0.14, 0.08);
    d = smin(d, capsula(p, vec3(0.0, 0.60, 0.0), vec3(0.03, 0.98, 0.0), 0.05), 0.10);
    d = min(d, hojaD(p));
    return d * 0.7;
  #endif
  }

  // "Segundo material": la hoja de Brote o la mitad perla de Capi.
  float esHoja(vec3 q) {
  #if FORMA == 2
    return 1.0 - smoothstep(0.0, 0.01, hojaD(q * vec3(1.0, 1.0, 1.3)));
  #elif FORMA == 3
    return (1.0 - smoothstep(-0.205, -0.155, q.y)) * (1.0 - smoothstep(0.5, 0.58, abs(q.x)));
  #else
    return 0.0;
  #endif
  }

  float mapa(vec3 p) { return cuerpo(local(p)) * min(uEscala.x, uEscala.y); }

  vec3 normal(vec3 p) {
    vec2 e = vec2(0.0015, 0.0);
    return normalize(vec3(
      mapa(p + e.xyy) - mapa(p - e.xyy),
      mapa(p + e.yxy) - mapa(p - e.yxy),
      mapa(p + e.yyx) - mapa(p - e.yyx)));
  }

  float oclusion(vec3 p, vec3 n) {
    float o = 0.0, w = 1.0;
    for (int i = 1; i <= 4; i++) {
      float h = 0.04 * float(i);
      o += w * (h - mapa(p + n * h));
      w *= 0.6;
    }
    return clamp(1.0 - 2.2 * o, 0.0, 1.0);
  }

  float ventana(vec2 p, vec2 c, vec2 t, float borde) {
    vec2 d = abs(p - c) - t;
    float dist = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    return 1.0 - smoothstep(-borde, borde, dist);
  }

  vec3 entorno(vec3 r) {
    vec3 c = mix(vec3(0.01, 0.05, 0.035), vec3(0.45, 0.68, 0.58), smoothstep(-0.2, 1.0, r.y)) * 0.20;
    if (r.z > -0.1) {
      c += vec3(1.0) * 1.05 * ventana(r.xy, vec2(-0.48, 0.62), vec2(0.30, 0.17), 0.10);
      c += vec3(1.0) * 0.75 * ventana(r.xy, vec2(0.50, 0.58), vec2(0.12, 0.13), 0.08);
    }
    return c;
  }

  float pildora(vec2 p, float semiAlto, float semiAncho) {
    float h = max(semiAlto - semiAncho, 0.0);
    return length(vec2(p.x, max(abs(p.y) - h, 0.0))) - semiAncho;
  }

  float ojo(vec2 p, float parp) {
    float alto = 0.155 * (1.0 + 0.22 * uSorpresa);
    float ancho = 0.082 * (1.0 + 0.18 * uSorpresa);
    float cierra = max(1.0 - parp * 0.88, 0.12);
    vec2 pp = vec2(p.x, p.y / cierra);
    float pil = pildora(pp, alto, ancho) * cierra;
    vec2 a = p - vec2(0.0, -0.05);
    float arco = abs(length(a) - 0.115) - 0.034;    // ojo feliz: un arco hacia arriba
    arco = max(arco, -a.y - 0.01);
    return mix(pil, arco, uFeliz);
  }

  vec3 sombrear(vec3 p, vec3 rd) {
    vec3 n = normal(p);
    vec3 v = -rd;
    vec3 q = local(p);
    float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 3.0);

    vec3 luz = normalize(vec3(-0.5, 0.85, 0.65));
    float envolver = clamp((dot(n, luz) + 0.55) / 1.55, 0.0, 1.0);
    vec3 col = mix(uCProf, uCMedio, smoothstep(0.05, 0.75, envolver));
    col = mix(col, uCLuz, pow(envolver, 3.0) * 0.40);
    col += uCLuz * 0.10 * pow(max(n.z, 0.0), 2.0);
    col *= mix(0.55, 1.0, smoothstep(-0.95, 0.15, n.y));
    col += uCLuz * 0.35 * fres * smoothstep(-0.3, 0.7, n.y);
    float hoja = esHoja(q);
    col = mix(col, uCHoja * mix(0.55, 1.35, envolver) + uCLuz * 0.2 * fres, hoja);
  #if FORMA == 3
    col *= 1.0 - 0.28 * exp(-pow((q.y + 0.18) / 0.014, 2.0)) * (1.0 - smoothstep(0.5, 0.58, abs(q.x)));   // la unión de la cápsula
  #endif
    col *= mix(0.55, 1.0, oclusion(p, n));
    float calido = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 1.6)
                 * pow(max(dot(n, normalize(vec3(0.75, -0.65, 0.0))), 0.0), 1.1);
    col = mix(col, uCCalido * 1.15, clamp(calido * 1.9, 0.0, 0.9) * (1.0 - hoja));

    vec2 mirada = uMirada * 0.065;
    float dOjo = min(ojo(q.xy - vec2(-0.205, OJO_Y) - mirada, uParpadeo), ojo(q.xy - vec2(0.205, OJO_Y) - mirada, max(uParpadeo, uGuino)));
    float enOjo = (1.0 - smoothstep(-0.006, 0.006, dOjo)) * smoothstep(0.1, 0.35, q.z) * (1.0 - hoja);
    vec3 tonoOjo = uCOjo * mix(0.90, 1.0, smoothstep(-0.155, 0.155, q.y - OJO_Y));
    col = mix(col, tonoOjo, enOjo);

    vec3 r = reflect(rd, n);
    col += entorno(r) * mix(0.30, 1.0, fres);
    return col;
  }

  void main() {
    vec2 uv = (vUv - 0.5) * 2.0;
    uv.x *= uRes.x / uRes.y;
    float distCam = 6.0;
    vec3 ro = vec3(0.0, -0.06, distCam);
    vec3 rd = normalize(vec3(uv * (uVista / distCam), -1.0));
    float pixel = 2.0 * uVista / uRes.y;

    vec4 fondo = vec4(0.0);
    if (uSombra > 0.01) {
      float t0 = distCam / -rd.z;
      vec3 pz = ro + rd * t0;
      vec2 rad = vec2(0.95 * uEscala.x, 0.12);
      float e = length((pz.xy - vec2(0.0, -1.05)) / rad);
      float a = 0.22 * uSombra * (1.0 - smoothstep(0.15, 1.0, e));
      fondo = vec4(vec3(0.02, 0.09, 0.06) * a, a);
    }

    float t = 3.6, dMin = 1e9, tMin = 0.0;
    bool toca = false;
    for (int i = 0; i < PASOS; i++) {
      vec3 p = ro + rd * t;
      float d = mapa(p);
      if (d < dMin) { dMin = d; tMin = t; }
      if (d < 0.0012) { toca = true; break; }
      t += d * 0.85;
      if (t > 8.5) break;
    }

    if (toca) {
      gl_FragColor = vec4(sombrear(ro + rd * t, rd), 1.0);
    } else if (dMin < pixel * 1.5) {
      float a = 1.0 - smoothstep(0.0, pixel * 1.5, dMin);
      vec3 c = sombrear(ro + rd * tMin, rd);
      gl_FragColor = vec4(c * a, a) + fondo * (1.0 - a);
    } else {
      gl_FragColor = fondo;
    }
  }
`;

const esMovil = () => window.matchMedia("(max-width: 900px), (pointer: coarse)").matches;
const sinMovimiento = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const limitar = (x, a, b) => Math.min(b, Math.max(a, x));
const mezclar = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- Motor (solo dibuja)
export function crearMotor(canvas, { forma = "dot", pasos, preservar = false, vista = 1.55 } = {}) {
  const def = FORMAS[forma] || FORMAS.dot;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false, premultipliedAlpha: true, powerPreference: "low-power", preserveDrawingBuffer: preservar });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);
  const v3 = (c) => new THREE.Vector3(c[0], c[1], c[2]);
  const uniforms = {
    uRes: { value: new THREE.Vector2(256, 256) }, uVista: { value: vista },
    uEscala: { value: new THREE.Vector2(1, 1) }, uGiro: { value: new THREE.Vector3() },
    uParpadeo: { value: 0 }, uGuino: { value: 0 }, uMirada: { value: new THREE.Vector2() }, uBrazo: { value: new THREE.Vector2() },
    uOla: { value: 0 }, uFeliz: { value: 0 }, uSorpresa: { value: 0 }, uPulso: { value: 0 }, uSombra: { value: 0 },
    uCProf: { value: v3(def.prof) }, uCMedio: { value: v3(def.medio) }, uCLuz: { value: v3(def.luz) },
    uCOjo: { value: v3(def.ojo) }, uCCalido: { value: v3(def.calido) }, uCHoja: { value: v3(def.hoja) },
  };
  const material = new THREE.ShaderMaterial({
    vertexShader, fragmentShader, uniforms, transparent: true,
    defines: { FORMA: def.id, PASOS: pasos || (esMovil() ? 80 : 110), OJO_Y: def.ojoY.toFixed(3) },
  });
  const escena = new THREE.Scene();
  escena.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
  const camara = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  let lado = 0;

  return {
    tamano(px) {
      px = Math.round(px);
      if (Math.abs(px - lado) < 8) return;
      lado = px;
      renderer.setSize(px, px, false);
      uniforms.uRes.value.set(px, px);
    },
    dibujar(e) {
      uniforms.uEscala.value.set(e.ancho, e.alto);
      uniforms.uGiro.value.set(e.giro, e.inclinacion, e.ladeo);
      uniforms.uParpadeo.value = e.parpadeo;
      uniforms.uGuino.value = e.guino || 0;
      uniforms.uMirada.value.set(e.miradaX, e.miradaY);
      uniforms.uBrazo.value.set(e.brazoI, e.brazoD);
      uniforms.uOla.value = e.ola;
      uniforms.uFeliz.value = e.feliz;
      uniforms.uSorpresa.value = e.sorpresa;
      uniforms.uPulso.value = e.pulso;
      uniforms.uSombra.value = e.sombra;
      renderer.render(escena, camara);
    },
    destruir() { material.dispose(); renderer.dispose(); },
  };
}

// Respaldo sin WebGL: un DOT dibujado en SVG que se mueve con transformaciones.
function motorSvg(contenedor, forma) {
  const def = FORMAS[forma] || FORMAS.dot;
  const hex = (c) => "#" + c.map((x) => Math.round(limitar(x, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "-1.5 -1.5 3 3");
  svg.setAttribute("aria-hidden", "true");
  svg.style.cssText = "width:100%;height:100%;overflow:visible";
  svg.innerHTML = `<g class="c"><g transform="scale(1,-1)">
    <circle r="0.66" fill="${hex(def.medio)}"/>${[[-0.6, 0.5], [0.6, 0.5], [-0.6, -0.5], [0.6, -0.5]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.44" fill="${hex(def.medio)}"/>`).join("")}
    <rect class="oi" x="-0.287" y="-0.085" width="0.164" height="0.31" rx="0.082" fill="${hex(def.ojo)}"/>
    <rect class="od" x="0.123" y="-0.085" width="0.164" height="0.31" rx="0.082" fill="${hex(def.ojo)}"/></g></g>`;
  contenedor.appendChild(svg);
  const g = svg.querySelector(".c");
  return {
    tamano() {},
    dibujar(e) {
      g.setAttribute("transform", `translate(0 ${0.98 - 0.98 * e.alto}) rotate(${(-e.ladeo * 180) / Math.PI}) scale(${e.ancho} ${e.alto})`);
      svg.querySelectorAll("rect").forEach((r) => r.setAttribute("transform", `translate(${e.miradaX * 0.06} ${e.miradaY * 0.06}) scale(1 ${Math.max(0.12, 1 - e.parpadeo * 0.88)})`));
    },
    destruir() { svg.remove(); },
  };
}

// ---------------------------------------------------------------- Personaje (motor + comportamiento)
// modos:
//   "acompanante"  viaja entre los huecos [data-dot-slot] de cada sección (panel ABBA)
//   "asistente"    descansa en una esquina y entra a los huecos del asistente (Doctors / Clientes)
//   "estudio"      vive dentro de un contenedor fijo, sin viajar (página para elegir personaje)
// Un hueco con data-dot-quien="perla" es solo para Perla; uno sin quien es del líder del equipo.
// El líder descansa en la esquina cuando no tiene hueco; los demás salen de la pantalla.
export class Personaje {
  constructor({ modo = "acompanante", forma = "dot", contenedor = null, etiqueta = null, alClic = null, frasesClic = null, lider = true, equipo = null, indice = 0 } = {}) {
    this.modo = modo;
    this.forma = forma;
    this.nombre = etiqueta || (FORMAS[forma] || FORMAS.dot).nombre;
    this.lider = lider;
    this.equipo = equipo;
    this.indice = indice;
    this.alClic = alClic;
    this.frasesClic = frasesClic || ["¡Hola!", "Aquí sigo.", "¡Eso me hace cosquillas!"];
    this.base = 240;                 // lado del lienzo en px de CSS
    this.x = lider ? innerWidth - 90 : innerWidth + 200; this.y = innerHeight - 90; this.vx = 0; this.vy = 0;
    this.s = 96; this.vs = 0;
    this.tx = this.x; this.ty = this.y; this.ts = this.s;
    this.slots = []; this.activo = null; this.claveActiva = "inicio"; this.ultimoCambio = 0;
    this.vuelo = null;
    this.t = 0; this.proxParpadeo = 1.2 + indice * 0.7; this.parpadeoT = -1;
    this.puntero = null; this.ultimoPuntero = 0;
    this.scrollPrevio = scrollY; this.velScroll = 0;
    this.mira = { x: 0, y: 0 };
    this.oculto = false;
    this.ocupadoHasta = 0; this.proxOcio = 9 + indice * 3.1;
    this.frasesDichas = new Set();
    // canales que mueven los gestos (GSAP los anima)
    this.g = { brazoI: 0, brazoD: 0, ola: 0, feliz: 0, sorpresa: 0, giro: 0, inclina: 0, ladeo: 0, saltoY: 0, sx: 1, sy: 1, mirPeso: 0, mirX: 0, mirY: 0 };

    this.construirDom(contenedor);
    try {
      this.motor = crearMotor(this.lienzo, { forma });
    } catch (e) {
      console.warn("[personaje] sin WebGL, uso la versión simple", e);
      this.lienzo.remove();
      this.motor = motorSvg(this.cuerpo, forma);
    }
    this.motor.tamano(this.base * Math.min(devicePixelRatio || 1, 1.5));

    this.alMoverPuntero = (e) => { this.puntero = { x: e.clientX, y: e.clientY }; this.ultimoPuntero = this.t; };
    addEventListener("pointermove", this.alMoverPuntero, { passive: true });
    this.cuadro = this.cuadro.bind(this);
    this.antes = performance.now();
    this.raf = requestAnimationFrame(this.cuadro);
    if (this.modo !== "estudio" && !this.equipo) {
      try { this.oculto = localStorage.getItem("abba_dot_oculto") === "1"; } catch (e) {}
      this.aplicarOculto();
    }
  }

  construirDom(contenedor) {
    const fijo = this.modo !== "estudio";
    const abreAsistente = this.modo === "asistente" && this.lider && this.alClic;
    this.capa = document.createElement("div");
    this.capa.className = "dot-capa " + (fijo ? "dot-fija" : "dot-en-sitio") + " dot-modo-" + this.modo + " dot-" + this.forma;
    this.cuerpo = document.createElement("div");
    this.cuerpo.className = "dot-cuerpo";
    this.lienzo = document.createElement("canvas");
    this.lienzo.setAttribute("aria-hidden", "true");
    this.toque = document.createElement("button");
    this.toque.type = "button";
    this.toque.className = "dot-toque";
    this.toque.setAttribute("aria-label", abreAsistente ? `${this.nombre}: abrir el asistente` : this.nombre);
    this.toque.addEventListener("click", () => this.clic());
    this.toque.addEventListener("pointerenter", () => { if (!this.vuelo) this.animar({ feliz: 0.8, duration: 0.25 }); });
    this.toque.addEventListener("pointerleave", () => this.animar({ feliz: 0, duration: 0.35 }));
    this.cuerpo.append(this.lienzo, this.toque);
    this.globo = document.createElement("div");
    this.globo.className = "dot-globo";
    this.globo.setAttribute("aria-hidden", "true");
    this.globoNombre = document.createElement("b");
    this.globoNombre.textContent = this.nombre;
    this.globoTexto = document.createElement("span");
    this.globo.append(this.globoNombre, this.globoTexto);
    this.capa.append(this.cuerpo, this.globo);
    if (fijo) {
      this.cerrar = document.createElement("button");
      this.cerrar.type = "button";
      this.cerrar.className = "dot-cerrar";
      this.cerrar.setAttribute("aria-label", this.equipo ? "Ocultar a los personajes" : `Ocultar a ${this.nombre}`);
      this.cerrar.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      this.cerrar.addEventListener("click", (e) => { e.stopPropagation(); if (this.equipo) this.equipo.ocultar(true); else this.ocultar(true); });
      this.capa.appendChild(this.cerrar);
      const encima = (si) => {
        clearTimeout(this.tEncima);
        if (si) this.capa.classList.add("encima");
        else this.tEncima = setTimeout(() => this.capa.classList.remove("encima"), 1400);
      };
      [this.toque, this.cerrar].forEach((b) => {
        b.addEventListener("pointerenter", () => encima(true));
        b.addEventListener("pointerleave", () => encima(false));
        b.addEventListener("focus", () => encima(true));
        b.addEventListener("blur", () => encima(false));
      });
      document.body.appendChild(this.capa);
      if (!this.equipo) {
        this.volver = document.createElement("button");
        this.volver.type = "button";
        this.volver.className = "dot-volver";
        this.volver.textContent = `Mostrar a ${this.nombre}`;
        this.volver.addEventListener("click", () => this.ocultar(false));
        document.body.appendChild(this.volver);
      }
    } else {
      contenedor.appendChild(this.capa);
    }
  }

  ocultar(si) {
    this.oculto = si;
    if (!this.equipo) { try { localStorage.setItem("abba_dot_oculto", si ? "1" : "0"); } catch (e) {} }
    this.aplicarOculto();
    if (!si) {
      this.vuelo = null;
      this.x = this.lider ? innerWidth + 120 : -200;
      this.claveActiva = "volviendo";
      if (this.lider) { this.decir("¡Volvimos!", 2200); this.saludar(); }
    }
  }
  aplicarOculto() {
    this.capa.classList.toggle("oculta", this.oculto);
    if (this.volver) this.volver.classList.toggle("visible", this.oculto);
  }

  // ------------------------------------------------------------ huecos y destino
  reubicar() {
    this.slots = Array.from(document.querySelectorAll("[data-dot-slot]")).filter((el) => (el.dataset.dotQuien ? el.dataset.dotQuien === this.forma : this.lider));
    this.elegirDestino(true);
  }

  // Esquina de descanso del líder. Si otro personaje está parado cerca, se pasa a la otra esquina.
  esquina() {
    const movil = innerWidth < 900;
    const s = this.modo === "asistente" ? (movil ? 68 : 96) : (movil ? 80 : 110);
    const nav = document.querySelector(".bottom-nav");
    const abajo = nav && getComputedStyle(nav).display !== "none" ? nav.getBoundingClientRect().height : 0;
    const y = innerHeight - abajo - s / 2 - (movil ? 8 : 18);
    const der = { x: innerWidth - s / 2 - (movil ? 10 : 22), y, s, lado: "der" };
    if (!this.equipo) return der;
    const barra = document.querySelector(".sidebar");
    const borde = barra && getComputedStyle(barra).display !== "none" ? barra.getBoundingClientRect().right : 0;
    const izq = { x: borde + s / 2 + (movil ? 10 : 22), y, s, lado: "izq" };
    const otros = this.equipo.miembros.filter((m) => m !== this && m.enEscena && m.activo);
    if (!otros.length) return der;
    const lejos = (p) => Math.min(...otros.map((o) => Math.hypot(o.tx - p.x, o.ty - p.y)));
    const actual = this.ladoEsquina === "izq" ? izq : der, otra = actual === izq ? der : izq;
    // Solo cambia si estorba de verdad y en la otra esquina hay más espacio
    if (lejos(actual) < s * 1.7 && lejos(otra) > lejos(actual) + 60) { this.ladoEsquina = otra.lado; return otra; }
    this.ladoEsquina = actual.lado;
    return actual;
  }

  elegirDestino(forzar) {
    const vh = innerHeight;
    const modal = document.querySelector("#modal-root.open");
    let mejor = null, mejorD = Infinity, actualD = Infinity;
    for (const el of this.slots) {
      if (!el.isConnected) continue;
      if (modal && !modal.contains(el)) continue;
      const r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) continue;
      const vis = (Math.min(r.bottom, vh) - Math.max(r.top, 0)) / r.height;
      const d = Math.abs((r.top + r.bottom) / 2 - vh * 0.45);
      if (el === this.activo) actualD = vis >= 0.2 ? d : Infinity;
      if (vis < 0.35) continue;
      if (d < mejorD) { mejorD = d; mejor = el; }
    }
    // histéresis: no cambia de hueco por unos pocos píxeles
    if (!forzar && this.activo && actualD !== Infinity && mejor !== this.activo && mejorD > actualD - 90) mejor = this.activo;
    if (!forzar && this.t - this.ultimoCambio < 0.45 && mejor !== this.activo && actualD !== Infinity) mejor = this.activo;

    let destino, clave;
    if (mejor) {
      const r = mejor.getBoundingClientRect();
      const lado = Math.min(r.width, r.height);
      const s = Math.min(parseFloat(mejor.dataset.dotTam) || lado, lado * 1.25);
      const nav = document.querySelector(".bottom-nav");
      const abajo = nav && getComputedStyle(nav).display !== "none" ? nav.getBoundingClientRect().height : 0;
      destino = { x: r.left + r.width / 2, y: limitar(r.top + r.height / 2, s * 0.5 + 10, vh - abajo - s * 0.5 - 10), s };
      clave = mejor;
    } else if (this.lider) {
      destino = this.esquina(); clave = "esquina-" + (destino.lado || "der");
    } else {
      // sale por el lado más cercano y espera fuera de la pantalla
      const derecha = this.claveActiva === "fuera" ? this.tx > 0 : this.x > innerWidth / 2;
      destino = { x: derecha ? innerWidth + this.s * 0.9 : -this.s * 0.9, y: limitar(this.y, 80, vh - 80), s: this.s };
      clave = "fuera";
    }
    this.tx = destino.x; this.ty = destino.y; this.ts = destino.s;
    this.capa.classList.toggle("sobre-modal", !!(modal && mejor));

    if (clave !== this.claveActiva) {
      const previo = this.claveActiva;
      this.claveActiva = clave; this.activo = mejor; this.ultimoCambio = this.t;
      if (previo !== "inicio") this.despegar();
      else { this.x = this.tx; this.y = this.ty; this.s = this.ts; }
      if (mejor) this.llegarA(mejor, previo === "inicio");
      else this.callar();
    }
  }

  llegarA(el, inmediato) {
    const frase = el.dataset.dotFrase;
    const gesto = el.dataset.dotGesto;
    const espera = (inmediato ? 0.5 : (this.vuelo ? this.vuelo.dur + 0.15 : 0.2)) + this.indice * 0.12;
    clearTimeout(this.tLlegada);
    this.tLlegada = setTimeout(() => {
      if (this.activo !== el) return;
      if (gesto) this.gesto(gesto);
      if (frase && !this.frasesDichas.has(frase)) { this.frasesDichas.add(frase); this.decir(frase); }
      if (this.equipo) this.equipo.alLlegar(this);
    }, espera * 1000);
  }

  despegar() {
    if (sinMovimiento() || this.modo === "estudio") { this.x = this.tx; this.y = this.ty; this.s = this.ts; return; }
    const dist = Math.hypot(this.tx - this.x, this.ty - this.y);
    if (dist < 40) return;
    this.callar();
    this.vuelo = { t: -0.12, dur: limitar(dist / 1500, 0.55, 1.0), x0: this.x, y0: this.y, s0: this.s, h: limitar(dist * 0.28, 50, 190), dir: Math.sign(this.tx - this.x) || 1 };
  }

  get enEscena() { return !this.oculto && this.claveActiva !== "fuera"; }

  // ------------------------------------------------------------ gestos
  animar(vars) {
    if (!window.gsap || sinMovimiento()) { Object.keys(vars).forEach((k) => { if (k in this.g) this.g[k] = vars[k]; }); return null; }
    return window.gsap.to(this.g, Object.assign({ overwrite: "auto", ease: "power2.out" }, vars));
  }
  linea() {
    const gsap = window.gsap;
    if (!gsap || sinMovimiento()) return null;
    this.ocupadoHasta = this.t + 1.6;
    return gsap.timeline({ defaults: { ease: "power2.out" } });
  }
  gesto(nombre) {
    const m = { saludar: "saludar", saltar: "saltar", girar: "girar", asentir: "asentir", negar: "negar", celebrar: "celebrar", pensar: "pensar", sorpresa: "sorprender", "senalar-izq": () => this.senalar(-1), "senalar-der": () => this.senalar(1) }[nombre];
    if (typeof m === "function") m(); else if (m && this[m]) this[m]();
  }
  saludar() {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { brazoD: 1, duration: 0.3, ease: "back.out(2)" }, 0)
      .to(this.g, { feliz: 1, duration: 0.2 }, 0)
      .fromTo(this.g, { ola: 0 }, { ola: Math.PI * 5, duration: 1.4, ease: "sine.inOut" }, 0.1)
      .to(this.g, { brazoD: 0, duration: 0.4, ease: "power2.inOut" }, 1.45)
      .to(this.g, { feliz: 0, duration: 0.3 }, 1.5);
  }
  saltar(alto = 46) {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { sx: 1.14, sy: 0.84, duration: 0.12 })
      .to(this.g, { saltoY: -alto, sx: 0.9, sy: 1.14, duration: 0.28, ease: "power2.out" })
      .to(this.g, { saltoY: 0, sx: 1, sy: 1, duration: 0.25, ease: "power2.in" })
      .to(this.g, { sx: 1.16, sy: 0.84, duration: 0.08 })
      .to(this.g, { sx: 1, sy: 1, duration: 0.55, ease: "elastic.out(1, 0.4)" });
  }
  girar() {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { saltoY: -22, duration: 0.3, ease: "power2.out" }, 0)
      .to(this.g, { giro: Math.PI * 2, duration: 0.9, ease: "power2.inOut" }, 0)
      .to(this.g, { saltoY: 0, duration: 0.3, ease: "power2.in" }, 0.6)
      .set(this.g, { giro: 0 });
  }
  asentir() {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { inclina: 0.24, duration: 0.16 }).to(this.g, { inclina: -0.06, duration: 0.18 })
      .to(this.g, { inclina: 0.18, duration: 0.16 }).to(this.g, { inclina: 0, duration: 0.3, ease: "power2.inOut" });
  }
  negar() {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { mirPeso: 1, mirX: 0, mirY: -0.5, duration: 0.2 }, 0)
      .to(this.g, { giro: 0.42, duration: 0.14 }, 0).to(this.g, { giro: -0.42, duration: 0.2 })
      .to(this.g, { giro: 0.3, duration: 0.18 }).to(this.g, { giro: 0, duration: 0.3, ease: "power2.inOut" })
      .to(this.g, { mirPeso: 0, duration: 0.4 });
  }
  celebrar() {
    const tl = this.linea(); if (!tl) return;
    this.ocupadoHasta = this.t + 2.2;
    tl.to(this.g, { brazoI: 1, brazoD: 1, feliz: 1, duration: 0.25, ease: "back.out(2)" }, 0)
      .fromTo(this.g, { ola: 0 }, { ola: Math.PI * 6, duration: 1.6, ease: "sine.inOut" }, 0)
      .to(this.g, { sx: 1.14, sy: 0.84, duration: 0.1 }, 0.1)
      .to(this.g, { saltoY: -56, sx: 0.9, sy: 1.14, duration: 0.3 }, 0.2)
      .to(this.g, { saltoY: 0, sx: 1, sy: 1, duration: 0.26, ease: "power2.in" }, 0.5)
      .to(this.g, { sx: 1.15, sy: 0.85, duration: 0.08 }, 0.76)
      .to(this.g, { saltoY: -34, sx: 0.94, sy: 1.08, duration: 0.24 }, 0.84)
      .to(this.g, { saltoY: 0, sx: 1, sy: 1, duration: 0.22, ease: "power2.in" }, 1.08)
      .to(this.g, { sx: 1, sy: 1, duration: 0.5, ease: "elastic.out(1, 0.4)" }, 1.3)
      .to(this.g, { brazoI: 0, brazoD: 0, feliz: 0, duration: 0.45, ease: "power2.inOut" }, 1.6);
  }
  pensar(si = true) {
    if (!window.gsap || sinMovimiento()) return;
    window.gsap.killTweensOf(this.g, "ola");
    if (si) {
      this.ocupadoHasta = this.t + 30;
      this.animar({ brazoI: 0.42, mirPeso: 1, mirX: -0.55, mirY: 0.8, ladeo: 0.12, feliz: 0, duration: 0.45 });
      this.pensando = window.gsap.fromTo(this.g, { ola: 0 }, { ola: Math.PI * 2, duration: 2.2, repeat: -1, ease: "none" });
    } else {
      if (this.pensando) this.pensando.kill();
      this.pensando = null;
      this.ocupadoHasta = this.t + 0.5;
      this.animar({ brazoI: 0, mirPeso: 0, ladeo: 0, ola: 0, duration: 0.4 });
    }
  }
  sorprender() {
    const tl = this.linea(); if (!tl) return;
    tl.to(this.g, { sorpresa: 1, saltoY: -12, duration: 0.12 }).to(this.g, { saltoY: 0, duration: 0.2, ease: "power2.in" })
      .to(this.g, { sorpresa: 0, duration: 0.5 }, "+=0.35");
  }
  senalar(dir) {
    const tl = this.linea(); if (!tl) return;
    const brazo = dir > 0 ? "brazoD" : "brazoI";
    tl.to(this.g, { [brazo]: 0.72, ladeo: -0.14 * dir, mirPeso: 1, mirX: dir, mirY: 0.1, feliz: 0.5, duration: 0.35, ease: "back.out(1.6)" })
      .to(this.g, { [brazo]: 0, ladeo: 0, mirPeso: 0, feliz: 0, duration: 0.45, ease: "power2.inOut" }, "+=1.4");
  }
  // Mira hacia un punto de la pantalla un momento (por ejemplo, a otro personaje que llega).
  mirarA(x, y, segundos = 1.6) {
    if (!window.gsap || sinMovimiento() || this.t < this.ocupadoHasta) return;
    const dx = limitar((x - this.x) / 260, -1, 1), dy = limitar(-(y - this.y) / 260, -1, 1);
    window.gsap.timeline()
      .to(this.g, { mirPeso: 1, mirX: dx, mirY: dy, feliz: 0.6, duration: 0.3, ease: "power2.out" })
      .to(this.g, { mirPeso: 0, feliz: 0, duration: 0.5, ease: "power2.inOut" }, "+=" + segundos);
  }

  clic() {
    if (this.modo === "asistente" && this.lider && this.alClic) { this.saltar(28); this.alClic(); return; }
    const opciones = ["saltar", "girar", "saludar", "celebrar"];
    this.gesto(opciones[Math.floor(Math.random() * opciones.length)]);
    this.decir(this.frasesClic[Math.floor(Math.random() * this.frasesClic.length)], 2600, true);
  }

  // ------------------------------------------------------------ globo de texto
  // En equipo hablan por turnos (directo = true se salta la fila, por ejemplo al tocarlo).
  decir(texto, ms = 4200, directo = false) {
    if (!texto || this.oculto) return;
    if (this.equipo && !directo) { this.equipo.encolar(this, texto, ms); return; }
    if (this.equipo && directo) this.equipo.callarOtros(this);
    clearInterval(this.tEscribe); clearTimeout(this.tCalla);
    this.globoTexto.textContent = "";
    this.globo.classList.add("visible");
    let i = 0;
    const rapido = sinMovimiento();
    this.tEscribe = setInterval(() => {
      i = rapido ? texto.length : i + 1;
      this.globoTexto.textContent = texto.slice(0, i);
      if (i >= texto.length) clearInterval(this.tEscribe);
    }, 18);
    this.tCalla = setTimeout(() => this.callar(), ms + texto.length * 18);
  }
  callar() { clearInterval(this.tEscribe); clearTimeout(this.tCalla); this.globo.classList.remove("visible"); }

  // ------------------------------------------------------------ cuadro a cuadro
  cuadro(ahora) {
    this.raf = requestAnimationFrame(this.cuadro);
    const dt = Math.min(0.05, (ahora - this.antes) / 1000);
    this.antes = ahora;
    if (document.hidden || this.oculto) return;
    this.t += dt;
    const quieto = sinMovimiento();
    const g = this.g;

    const sy = scrollY;
    this.velScroll = mezclar(this.velScroll, (sy - this.scrollPrevio) / Math.max(dt, 0.001), 0.18);
    this.scrollPrevio = sy;

    let ancho = 1, alto = 1, giro = 0, inclinacion = 0, ladeo = 0;

    if (this.modo !== "estudio") {
      this.elegirDestino(false);
      if (this.vuelo) {
        const v = this.vuelo;
        v.t += dt;
        if (v.t < 0) {                                   // se agacha antes de saltar
          const a = Math.sin(((v.t + 0.12) / 0.12) * Math.PI * 0.5);
          ancho *= 1 + 0.12 * a; alto *= 1 - 0.15 * a;
        } else if (v.t < v.dur) {
          const u = v.t / v.dur;
          const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
          const nx = mezclar(v.x0, this.tx, e), ny = mezclar(v.y0, this.ty, e) - v.h * Math.sin(Math.PI * u);
          this.vx = (nx - this.x) / Math.max(dt, 0.001); this.vy = (ny - this.y) / Math.max(dt, 0.001);
          this.x = nx; this.y = ny; this.s = mezclar(v.s0, this.ts, e);
          const estira = 0.13 * Math.pow(Math.abs(2 * u - 1), 1.6);
          ancho *= 1 - estira * 0.55; alto *= 1 + estira;
          giro += 0.3 * v.dir * Math.sin(Math.PI * u);
          ladeo += -0.18 * v.dir * Math.sin(Math.PI * u);
        } else if (v.t < v.dur + 0.24) {                 // aterriza y se aplasta
          const b = (v.t - v.dur) / 0.24;
          const ap = 0.2 * Math.sin(Math.PI * b) * (1 - 0.35 * b);
          ancho *= 1 + ap * 0.75; alto *= 1 - ap;
          this.x = this.tx; this.y = this.ty; this.s = this.ts; this.vx = this.vy = 0;
        } else {
          this.vuelo = null;
        }
      }
      if (!this.vuelo) {
        if (quieto) { this.x = this.tx; this.y = this.ty; this.s = this.ts; }
        else {
          const k = 150, c = 2 * Math.sqrt(k) * 0.62;   // resorte poco amortiguado: es gel
          this.vx += (k * (this.tx - this.x) - c * this.vx) * dt; this.x += this.vx * dt;
          this.vy += (k * (this.ty - this.y) - c * this.vy) * dt; this.y += this.vy * dt;
          this.vs += (110 * (this.ts - this.s) - 2 * Math.sqrt(110) * this.vs) * dt; this.s += this.vs * dt;
          ladeo += limitar(-this.vx * 0.0005, -0.25, 0.25);
          const est = limitar(Math.abs(this.vy) * 0.00022, 0, 0.12);
          alto *= 1 + est; ancho *= 1 - est * 0.5;
        }
      }
      // Fuera de la pantalla y quieto: no se dibuja (ahorra batería)
      const fuera = this.claveActiva === "fuera" && !this.vuelo && (this.x < -this.s * 0.45 || this.x > innerWidth + this.s * 0.45);
      this.capa.classList.toggle("en-reposo", fuera);
      if (fuera) return;
    }

    if (!quieto) {
      const resp = Math.sin((2 * Math.PI * this.t) / 2.6 + this.indice);
      alto *= 1 + 0.018 * resp; ancho *= 1 - 0.01 * resp;
      inclinacion += 0.05 * Math.sin((2 * Math.PI * this.t) / 3.7 + this.indice);
      giro += 0.07 * Math.sin((2 * Math.PI * this.t) / 4.3 + 1.0 + this.indice);
    }

    let parpadeo = 0;
    if (this.t > this.proxParpadeo) { this.parpadeoT = this.t; this.proxParpadeo = this.t + 2.4 + Math.random() * 3.2; }
    const pb = (this.t - this.parpadeoT) / 0.17;
    if (pb >= 0 && pb < 1) parpadeo = Math.sin(Math.PI * pb);

    // mirada: al cursor, si no al sentido del scroll, si no curiosea
    const centro = this.centroPantalla();
    let mx = 0, my = 0;
    if (this.puntero && this.t - this.ultimoPuntero < 5) {
      mx = limitar((this.puntero.x - centro.x) / 320, -1, 1);
      my = limitar(-(this.puntero.y - centro.y) / 320, -1, 1);
    } else {
      mx = 0.5 * Math.sin(this.t * 0.37 + this.indice) * Math.sin(this.t * 0.11);
      my = 0.25 * Math.sin(this.t * 0.23 + this.indice);
    }
    my = limitar(my - this.velScroll / 2200, -1, 1);
    if (this.vuelo) { mx = this.vuelo.dir; my = 0.1; }
    mx = mezclar(mx, g.mirX, g.mirPeso); my = mezclar(my, g.mirY, g.mirPeso);
    this.mira.x = mezclar(this.mira.x, mx, quieto ? 1 : 0.12);
    this.mira.y = mezclar(this.mira.y, my, quieto ? 1 : 0.12);

    // de vez en cuando hace algo por su cuenta
    if (!quieto && this.modo !== "estudio" && !this.vuelo && this.t > this.proxOcio && this.t > this.ocupadoHasta) {
      this.proxOcio = this.t + 10 + Math.random() * 8;
      const r = Math.random();
      if (r < 0.35) this.saltar(24); else if (r < 0.6) this.asentir(); else if (r < 0.8) this.senalar(this.x > innerWidth / 2 ? -1 : 1); else this.girar();
    }

    const e = {
      ancho: ancho * g.sx, alto: alto * g.sy, giro: giro + g.giro, inclinacion: inclinacion + g.inclina, ladeo: ladeo + g.ladeo,
      parpadeo: g.feliz > 0.5 ? 0 : parpadeo, miradaX: this.mira.x, miradaY: this.mira.y,
      brazoI: g.brazoI, brazoD: g.brazoD, ola: g.ola, feliz: g.feliz, sorpresa: g.sorpresa, pulso: 0,
      sombra: this.modo === "estudio" ? 1 : limitar(1 - Math.abs(g.saltoY) / 60, 0, 1) * (this.vuelo ? 0 : 1) * (this.activo ? 1 : 0.6),
    };
    this.motor.dibujar(e);

    if (this.modo !== "estudio") {
      const esc = this.s / this.base;
      this.cuerpo.style.transform = `translate3d(${(this.x - this.base / 2).toFixed(1)}px, ${(this.y - this.base / 2 + g.saltoY * esc * 1.6).toFixed(1)}px, 0) scale(${esc.toFixed(4)})`;
      if (this.cerrar) this.cerrar.style.transform = `translate3d(${(this.x + this.s * 0.3).toFixed(1)}px, ${(this.y - this.s * 0.42).toFixed(1)}px, 0)`;
    } else {
      this.cuerpo.style.transform = `translate3d(0, ${g.saltoY.toFixed(1)}px, 0)`;
    }
    this.colocarGlobo();
  }

  centroPantalla() {
    if (this.modo !== "estudio") return { x: this.x, y: this.y };
    const r = this.cuerpo.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  colocarGlobo() {
    if (!this.globo.classList.contains("visible")) return;
    if (this.modo === "estudio") { this.globo.style.transform = "translate3d(-50%, 0, 0)"; return; }
    const gw = this.globo.offsetWidth, gh = this.globo.offsetHeight;
    // Encima de la cabeza (así no tapa los títulos de al lado); si no cabe, debajo.
    const s = this.s;
    const gx = limitar(this.x - gw / 2, 10, innerWidth - gw - 10);
    const minY = window.ABBA_GLOBO_MIN_Y || 10;   // la web de ABBA reserva su barra de arriba
    let gy = this.y - s * 0.4 - gh - 4;
    this.globo.dataset.lado = "arriba";
    if (gy < minY) { gy = this.y + s * 0.42 + 4; this.globo.dataset.lado = "abajo"; }
    this.globo.style.setProperty("--flecha", limitar(this.x - gx, 18, gw - 18).toFixed(0) + "px");
    this.globo.style.transform = `translate3d(${gx.toFixed(1)}px, ${gy.toFixed(1)}px, 0)`;
  }

  destruir() {
    cancelAnimationFrame(this.raf);
    removeEventListener("pointermove", this.alMoverPuntero);
    this.motor.destruir();
    this.capa.remove();
    if (this.volver) this.volver.remove();
  }
}

// ---------------------------------------------------------------- Equipo (los cuatro juntos)
// Crea a los cuatro personajes, con uno de líder (el asistente o acompañante principal de la app).
// Reparte los gestos, los oculta y los muestra juntos, y hace que se miren cuando uno llega.
const PRESENTACION = {
  dot: ["¡Hola! Soy DOT, el de la red ABBA.", "Yo cuido que todas las clínicas vayan bien.", "¿Seguimos?"],
  perla: ["Soy Perla. Ayudo a los doctores con su agenda.", "Las citas son lo mío.", "¿Ya confirmaste tus citas?"],
  brote: ["Soy Brote. Acompaño a los pacientes.", "Cada visita suma puntos.", "¡Me encanta que vuelvan!"],
  capi: ["Soy Capi. Me encantan los números.", "Todo lo que ves aquí está contado de verdad.", "¿Vemos las estadísticas?"],
};
export class Equipo {
  constructor({ modo = "acompanante", lider = "dot", miembros = EQUIPO, alClic = null, nombreLider = null } = {}) {
    const orden = [lider].concat(miembros.filter((m) => m !== lider));
    this.miembros = orden.map((forma, i) => new Personaje({
      modo, forma, lider: i === 0, equipo: this, indice: i,
      etiqueta: i === 0 && nombreLider ? nombreLider : null,
      alClic: i === 0 ? alClic : null,
      frasesClic: PRESENTACION[forma],
    }));
    this.lider = this.miembros[0];
    this.por = Object.fromEntries(this.miembros.map((m) => [m.forma, m]));
    this.volver = document.createElement("button");
    this.volver.type = "button";
    this.volver.className = "dot-volver";
    this.volver.textContent = "Mostrar personajes";
    this.volver.addEventListener("click", () => this.ocultar(false));
    document.body.appendChild(this.volver);
    let oculto = false;
    try { oculto = localStorage.getItem("abba_dot_oculto") === "1"; } catch (e) {}
    if (oculto) this.ocultar(true, true);
  }
  reubicar() { this.miembros.forEach((m) => m.reubicar()); }
  visibles() { return this.miembros.filter((m) => m.enEscena); }
  objetivo(quien) {
    if (quien === "todos") return this.visibles();
    const m = quien ? this.por[quien] : this.lider;
    return m ? [m] : [];
  }
  gesto(nombre, quien) {
    this.objetivo(quien).forEach((m, i) => {
      const hacer = () => (nombre === "pensar" ? m.pensar(true) : nombre === "pensar-fin" ? m.pensar(false) : m.gesto(nombre));
      if (i === 0) hacer(); else setTimeout(hacer, i * 140);
    });
  }
  decir(frase, quien) { const m = this.objetivo(quien === "todos" ? null : quien)[0]; if (m) m.decir(frase, 4200, true); }
  // Turnos para hablar: uno a la vez; lo que espera más de 7 s ya no se dice.
  encolar(m, texto, ms) {
    this.fila = (this.fila || []).filter((x) => x.m !== m);
    this.fila.push({ m, texto, ms, t: Date.now() });
    if (!this.hablando) this.siguiente();
  }
  siguiente() {
    clearTimeout(this.tTurno);
    this.hablando = null;
    let item;
    while ((item = (this.fila || []).shift())) {
      if (Date.now() - item.t < 7000 && item.m.enEscena) break;
    }
    if (!item) return;
    this.hablando = item.m;
    item.m.decir(item.texto, item.ms, true);
    this.tTurno = setTimeout(() => this.siguiente(), item.ms + item.texto.length * 18 + 300);
  }
  callarOtros(m) { this.miembros.forEach((o) => { if (o !== m) o.callar(); }); if (this.hablando && this.hablando !== m) { clearTimeout(this.tTurno); this.hablando = m; this.tTurno = setTimeout(() => this.siguiente(), 3600); } }
  alLlegar(quien) {
    this.miembros.forEach((m) => { if (m !== quien && m.enEscena && !m.vuelo) m.mirarA(quien.x, quien.y); });
  }
  ocultar(si, silencioso) {
    if (!silencioso) { try { localStorage.setItem("abba_dot_oculto", si ? "1" : "0"); } catch (e) {} }
    this.miembros.forEach((m) => m.ocultar(si));
    this.volver.classList.toggle("visible", si);
    if (!si) this.reubicar();
  }
}

window.ABBA_EQUIPO_CLASE = Equipo;
window.dispatchEvent(new Event("abba:personaje"));
</script></body></html>
