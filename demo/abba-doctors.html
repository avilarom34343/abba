  window.ABBA.auth = { normUser, normPhone, ROLES, AVISO_VERSION, getSession, setSession, logout, registerPatient, loginPatient, loginStaff, createClinicWithDoctor, loginWithCredentials, borrarClinica,
    cambiarContrasena, restablecerPaciente, restablecerDoctor };
})();


/* ---- lib/whatsapp.js ---- */
/**
 * js/lib/whatsapp.js
 * ---------------------------------------------------------------------------
 * Mensajes al paciente por WhatsApp, desde el número de SU clínica.
 * Aquí solo se deja el mensaje en `messages`; quien habla con WhatsApp (Meta)
 * es el servidor (supabase/functions/abba/whatsapp.js), que tiene las
 * credenciales de cada clínica. El navegador nunca las ve.
 *   - Sin WhatsApp conectado: "blocked" (queda registrado, no sale).
 *   - Conectado y con texto aprobado por WhatsApp: "queued" → el servidor lo
 *     manda y lo marca "sent" / "delivered" / "read" o "failed".
 *   - Conectado pero sin texto aprobado: "failed" (WhatsApp solo acepta
 *     mensajes con plantilla aprobada cuando la clínica escribe primero).
 *   - Paciente sin permiso (no aceptó al registrarse o escribió BAJA): "sin_permiso".
 * Nunca finge que un mensaje salió.
 * ---------------------------------------------------------------------------
 */
(function () {
  const provider = {
    /** ¿Esta clínica ya conectó su número? Lo marca el servidor al conectarlo. */
    isConnected(clinicId) {
      const c = clinicId && window.ABBA.store.get("clinics", clinicId);
      return !!(c && c.whatsapp_conectado);
    },

    /** plantilla: { nombre, idioma } aprobada por WhatsApp; variables: { nombre: "Ana", … }.
     *  @returns {{status:'queued'|'failed'|'blocked', reason?:string, message}} */
    sendMessage({ clinicId, patientId, body, plantilla, variables, automationId }) {
      const store = window.ABBA.store;
      const connected = this.isConnected(clinicId);
      // Solo a quien aceptó recibir WhatsApp (y no escribió BAJA).
      const p = patientId ? store.get("patients", patientId) : null;
      const conPermiso = !!(p && p.whatsapp_optin === true);
      const status = !connected ? "blocked" : !conPermiso ? "sin_permiso" : plantilla ? "queued" : "failed";
      const reason = !connected ? "WhatsApp no conectado" : !conPermiso ? "El paciente no aceptó recibir WhatsApp (o escribió BAJA)." : plantilla ? null : "WhatsApp todavía no aprueba este texto.";
      const row = store.insert("messages", {
        clinic_id: clinicId, patient_id: patientId, channel: "whatsapp", direction: "outbound", body, status,
        automation_id: automationId || null, plantilla: plantilla || null, variables: variables || null, error: status === "failed" ? reason : null
      });
      return { status, reason, message: row };
    }
  };

  window.ABBA = window.ABBA || {};
  window.ABBA.whatsapp = provider;
})();


/* ---- lib/automations.js ---- */
/**
 * js/lib/automations.js
 * ---------------------------------------------------------------------------
 * Mensajes automáticos de cada clínica (tabla `automations`). Cada uno tiene
 * un MOMENTO (ver DISPARADORES):
 *   - al_momento:   sale cuando pasa algo (cita agendada, canje, respuesta…).
 *   - antes_cita:   N horas antes de la cita (recordatorio).
 *   - despues_cita: N horas después de la cita (pedir opinión).
 *   - diario:       se revisa una vez al día (cumpleaños, días sin venir).
 * Los de horario los ejecuta el motor (lib/motor.js), que en producción corre
 * en el servidor aunque nadie tenga la app abierta. Cada envío queda en
 * `automation_logs` con una `ref`: así un recordatorio o un cumpleaños nunca
 * sale dos veces.
 * ---------------------------------------------------------------------------
 */
(function () {
  const { store, events, whatsapp } = window.ABBA;
  const EV = events.EVENTS;

  const V_BASE = ["nombre", "puntos", "clinica", "enlace"];
  const V_CITA = V_BASE.concat(["servicio", "fecha", "hora", "doctor"]);
  // cat: la categoría con la que se pide a WhatsApp (avisos de servicio = UTILITY; promociones = MARKETING, cuestan más).
  const DISPARADORES = [
    { key: EV.APPOINTMENT_BOOKED, label: "Cuando un paciente agenda una cita", tipo: "al_momento", vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_CONFIRMED, label: "Cuando confirmas una cita", tipo: "al_momento", vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_REMINDER, label: "Antes de la cita (recordatorio)", tipo: "antes_cita", horas: 24, vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_RESCHEDULED, label: "Cuando cambias la fecha de una cita", tipo: "al_momento", vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_COMPLETED, label: "Cuando el paciente asiste a su cita", tipo: "al_momento", vars: V_CITA.concat(["puntos_ganados"]), cat: "UTILITY" },
    { key: EV.REVIEW_REQUESTED, label: "Después de la cita (pedir opinión)", tipo: "despues_cita", horas: 3, vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_NO_SHOW, label: "Cuando el paciente no asiste", tipo: "al_momento", vars: V_CITA, cat: "UTILITY" },
    { key: EV.APPOINTMENT_CANCELLED, label: "Cuando se cancela una cita", tipo: "al_momento", vars: V_CITA, cat: "UTILITY" },
    { key: EV.CLINIC_REPLIED, label: "Cuando respondes un mensaje del paciente", tipo: "al_momento", vars: V_BASE, cat: "UTILITY" },
    { key: EV.PATIENT_INACTIVE, label: "Cuando un paciente cumple días sin venir", tipo: "diario", dias: 60, vars: V_BASE, cat: "MARKETING" },
    { key: EV.PATIENT_REGISTERED, label: "Cuando se registra un paciente nuevo", tipo: "al_momento", vars: V_BASE, cat: "UTILITY" },
    { key: EV.BIRTHDAY, label: "El día del cumpleaños del paciente", tipo: "diario", vars: V_BASE.concat(["puntos_ganados"]), cat: "MARKETING" },
    { key: EV.LEVEL_UP, label: "Cuando el paciente sube de nivel", tipo: "al_momento", vars: V_BASE.concat(["nivel"]), cat: "MARKETING" },
    { key: EV.REFERRAL_COMPLETED, label: "Cuando un paciente invita a alguien", tipo: "al_momento", vars: V_BASE.concat(["amigo", "puntos_ganados"]), cat: "MARKETING" },
    { key: EV.REWARD_REDEEMED, label: "Cuando el paciente canjea una recompensa", tipo: "al_momento", vars: V_BASE.concat(["recompensa", "codigo"]), cat: "UTILITY" }
  ];
  const VARIABLES = {
    nombre: "Nombre", puntos: "Puntos", clinica: "Clínica", enlace: "Enlace a su portal", servicio: "Servicio", fecha: "Fecha",
    hora: "Hora", doctor: "Doctor", puntos_ganados: "Puntos ganados", nivel: "Nivel", amigo: "Amigo", recompensa: "Recompensa", codigo: "Código de canje"
  };
  function disparador(key) { return DISPARADORES.find((d) => d.key === key) || null; }
  /** Horas antes (recordatorio) o después (opinión) que eligió el doctor. */
  function horas(a) { const h = a.params && Number(a.params.hours); if (h > 0) return h; const d = disparador(a.event_key); return (d && d.horas) || 0; }
  /** Días sin venir que eligió el doctor. */
  function dias(a) { const n = a.params && Number(a.params.days); return n > 0 ? n : 60; }

  function fillTemplate(tpl, vars) {
    return tpl.replace(/\{\{(\w+)\}\}/g, (_, key) => (vars[key] != null ? vars[key] : `{{${key}}}`));
  }

  /** El texto tal como se pide a WhatsApp. WhatsApp (Meta) rechaza mensajes que
   *  empiezan o terminan con un dato o que traen dos datos seguidos. El enlace
   *  al portal va como botón "Abrir mi portal", así que en el texto se quita.
   *  @returns {{ cuerpo: string, vars: string[], boton: boolean, error: string|null }} */
  function textoWhatsApp(texto) {
    const original = window.ABBA.icons.stripEmoji(String(texto || "")).trim();
    const boton = /\{\{enlace\}\}/.test(original);
    const cuerpo = original
      .replace(/[\s:,;-]*\{\{enlace\}\}[\s.!?]*$/, ".")
      .replace(/\{\{enlace\}\}/g, "tu portal")
      .replace(/[ \t]{2,}/g, " ")
      .replace(/\.{2,}$/, ".")
      .trim();
    const vars = [...new Set([...cuerpo.matchAll(/\{\{(\w+)\}\}/g)].map((m) => m[1]))];
    let error = null;
    if (!cuerpo) error = "Escribe el mensaje.";
    else if (cuerpo.length > 1024) error = "El mensaje es muy largo para WhatsApp: máximo 1,024 letras.";
    else if (/^[\s¡¿"'«(]*\{\{\w+\}\}/.test(cuerpo)) error = "WhatsApp no acepta mensajes que empiezan con un dato. Pon una palabra antes, por ejemplo: «Hola {{nombre}}, …».";
    else if (/\{\{\w+\}\}[\s.,;:!?)"'»]*$/.test(cuerpo)) error = "WhatsApp no acepta mensajes que terminan con un dato. Agrega unas palabras al final, por ejemplo: «… {{puntos}} puntos.».";
    else if (/\}\}[\s.,;:!?¡¿-]*\{\{/.test(cuerpo)) error = "WhatsApp no acepta dos datos seguidos. Pon palabras entre ellos.";
    return { cuerpo, vars, boton, error };
  }
  /** Un dato para WhatsApp: sin saltos de línea y nunca vacío. */
  function datoWhatsApp(v) {
    return String(v == null ? "" : v).replace(/[\r\n\t]+/g, " ").replace(/ {4,}/g, " ").trim().slice(0, 300) || "-";
  }

  /** Variables de un mensaje: del paciente, de la clínica y, si hay, de la cita. */
  function variables(ctx) {
    const U = window.ABBA.utils;
    const patient = ctx.patientId ? store.get("patients", ctx.patientId) : null;
    const clinic = store.get("clinics", ctx.clinicId);
    const appt = ctx.appointmentId ? store.get("appointments", ctx.appointmentId) : null;
    const v = {
      nombre: patient ? patient.first_name : "",
      puntos: patient ? Number(patient.points_balance || 0).toLocaleString("es-MX") : "",
      clinica: clinic ? clinic.name : "",
      enlace: window.ABBA.qr ? window.ABBA.qr.portalUrl(ctx.clinicId) : ""
    };
    if (appt) Object.assign(v, { servicio: appt.service_name || "", fecha: U.formatDateLong(appt.date), hora: U.normTime(appt.time), doctor: appt.doctor_name || "" });
    return Object.assign(v, ctx.vars || {});
  }

  function findAutomation(clinicId, eventKey) {
    return store.listByClinic("automations", clinicId, (a) => a.event_key === eventKey)[0] || null;
  }
  function findAutomations(clinicId, eventKey) {
    return store.listByClinic("automations", clinicId, (a) => a.event_key === eventKey);
  }

  /** ¿Ya salió (o se intentó) este mensaje para esta referencia? */
  function yaEnviado(automationId, ref) {
    return !!ref && store.list("automation_logs", (l) => l.automation_id === automationId && l.ref === ref && l.status !== "skipped_inactive").length > 0;
  }

  function run(eventKey, ctx) {
    if (!ctx || !ctx.clinicId) return [];
    return findAutomations(ctx.clinicId, eventKey).map((a) => runOne(a, ctx)).filter(Boolean);
  }

  /** Envía UNA automatización. ctx: { clinicId, patientId, appointmentId?, vars?, ref? } */
  function runOne(automation, ctx) {
    const { clinicId, patientId } = ctx;
    const ref = ctx.ref || null;
    if (ref && yaEnviado(automation.id, ref)) return null;
    if (!automation.active) {
      store.insert("automation_logs", { clinic_id: clinicId, automation_id: automation.id, patient_id: patientId, status: "skipped_inactive", ref });
      return null;
    }
    // Con WhatsApp conectado sale el último texto que aprobó WhatsApp (Meta); si aún no aprueba ninguno, espera.
    if (whatsapp.isConnected(clinicId) && !automation.plantilla_aprobada) {
      store.insert("automation_logs", { clinic_id: clinicId, automation_id: automation.id, patient_id: patientId, status: "pending_approval", ref });
      return { status: "pending_approval" };
    }
    const result = enviar(automation, ctx);
    store.insert("automation_logs", { clinic_id: clinicId, automation_id: automation.id, patient_id: patientId, status: result.status, ref });
    if (result.status === "failed" && window.ABBA.notify) {
      window.ABBA.notify.push({ clinic_id: clinicId, patient_id: patientId || null, type: "alert", priority: "high", title: `No se pudo enviar "${automation.name}"`, body: result.reason || "WhatsApp no aceptó el mensaje. Revisa el celular del paciente." });
    }
    return result;
  }

  /** Deja el mensaje listo: con WhatsApp conectado, con su texto aprobado y sus datos. */
  function enviar(automation, ctx) {
    const ap = whatsapp.isConnected(ctx.clinicId) && automation ? automation.plantilla_aprobada : null;
    const vars = variables(ctx);
    const texto = ap ? ap.texto : automation ? automation.message_template : ctx.texto;
    return whatsapp.sendMessage({
      clinicId: ctx.clinicId, patientId: ctx.patientId, automationId: automation ? automation.id : null,
      body: fillTemplate(window.ABBA.icons.stripEmoji(texto || ""), vars),
      plantilla: ap ? { nombre: ap.nombre, idioma: ap.idioma || "es_MX" } : null,
      variables: ap ? Object.fromEntries((ap.vars || []).map((k) => [k, datoWhatsApp(vars[k])])) : null
    });
  }

  /** Envío que pide el doctor a mano (p. ej. "Enviar mensaje" en En riesgo):
   *  sale aunque la automatización esté en pausa. */
  function enviarAhora(automation, ctx) {
    const result = enviar(automation, ctx);
    if (automation) store.insert("automation_logs", { clinic_id: ctx.clinicId, automation_id: automation.id, patient_id: ctx.patientId, status: result.status, ref: ctx.ref || null, manual: true });
    return Object.assign({ body: result.message ? result.message.body : "" }, result);
  }

  // --- Los que salen al momento escuchan su evento ------------------------
  DISPARADORES.filter((d) => d.tipo === "al_momento").forEach((d) => events.on(d.key, (ctx) => run(d.key, ctx)));

  /** Escaneo bajo demanda (no es un evento en tiempo real): pacientes inactivos. */
  /** Pacientes sin venir desde hace N días o más (días de calendario, hora
   *  de la clínica). Quien ya tiene una cita próxima NO está "en riesgo". Si
   *  nunca ha venido, se cuenta desde que se registró — antes salían con
   *  "9999 días". */
  function getPatientsAtRisk(clinicId, minDaysInactive) {
    const U = window.ABBA.utils;
    return store.listByClinic("patients", clinicId)
      .map((p) => {
        const v = U.patientVisitInfo(p);
        const days = v.neverVisited ? v.daysSinceSignup : v.daysSinceVisit;
        return Object.assign({}, p, { days_inactive: days, never_visited: v.neverVisited, last_visit_date: v.lastVisit, has_next: !!v.next });
      })
      .filter((p) => !p.has_next && p.days_inactive >= (minDaysInactive || 30))
      .sort((a, b) => b.days_inactive - a.days_inactive);
  }

  window.ABBA.automations = { DISPARADORES, VARIABLES, disparador, horas, dias, run, runOne, enviarAhora, fillTemplate, textoWhatsApp, datoWhatsApp, variables, yaEnviado, getPatientsAtRisk, findAutomation, findAutomations };
})();


/* ---- lib/notify.js ---- */
/**
 * js/lib/notify.js — notificaciones para el doctor.
 * ---------------------------------------------------------------------------
 * TODO lo que hace un paciente le avisa a la clínica: registro, cita nueva,
 * mensaje, reseña (las malas, urgentes y con botón para llamar), canje,
 * referido, subida de nivel… Cada aviso es una fila en `notifications`
 * (misma forma que tendría en Supabase). El panel del doctor la recibe al
 * instante (ver store.js → "abba:sync") y, si el doctor lo permitió, también
 * como notificación del sistema del teléfono o la computadora.
 *
 * Lo que hace el propio equipo de la clínica desde su panel NO se le
 * notifica a sí mismo (sería ruido).
 * ---------------------------------------------------------------------------
 */
(function () {
  const { store, events } = window.ABBA;
  const EV = events.EVENTS;
  EV.REVIEW_SUBMITTED = "REVIEW_SUBMITTED";
  EV.PATIENT_MESSAGE = "PATIENT_MESSAGE";

  function U() { return window.ABBA.utils; }
  function first(p) { return p ? (p.first_name || p.username || "Un paciente") : "Un paciente"; }

  /** Crea una notificación. priority: "urgent" | "high" | "normal".
   *  `ref` evita duplicados (p. ej. el resumen del día); `link` y `filtro`
   *  dicen a qué pantalla lleva al tocarla. */
  function push(n) {
    if (!n || !n.clinic_id) return null;
    if (n.ref && store.listByClinic("notifications", n.clinic_id, (x) => x.ref === n.ref).length) return null;
    return store.insert("notifications", Object.assign({ priority: "normal", read: false }, n));
  }

  function fromPatientSide() { return window.ABBA_APP !== "doctor" && window.ABBA_APP !== "admin"; }

  // ---- Eventos del paciente → notificación ------------------------------
  const handlers = {
    [EV.PATIENT_REGISTERED]: (ctx, p) => ({ type: "signup", title: `Nuevo paciente: ${U().patientName(p)}`, body: "Se acaba de registrar y recibió sus puntos de bienvenida." }),
    [EV.APPOINTMENT_BOOKED]: (ctx, p) => {
      const a = ctx.appointmentId ? store.get("appointments", ctx.appointmentId) : null;
      return { type: "booking", priority: "high", ref_id: a && a.id, title: `${first(p)} agendó una cita`, body: a ? `${a.service_name} · ${U().formatDateLong(a.date)} a las ${a.time}` : "Revisa tu agenda." };
    },
    [EV.APPOINTMENT_CANCELLED]: (ctx, p) => ({ type: "cancel", priority: "high", title: `${first(p)} canceló su cita`, body: "Ese horario quedó libre." }),
    [EV.REWARD_REDEEMED]: (ctx, p) => {
      const r = ctx.rewardId ? store.get("rewards", ctx.rewardId) : null;
      return { type: "reward", title: `${first(p)} canjeó una recompensa`, body: r ? `${r.name}. Entrégasela en su próxima visita.` : "Entrégasela en su próxima visita." };
    },
    [EV.REFERRAL_COMPLETED]: (ctx, p) => ({ type: "referral", title: `${first(p)} invitó a alguien`, body: ctx.referredName ? `${ctx.referredName} se registró con su código.` : "Un paciente nuevo llegó por su recomendación." }),
    [EV.LEVEL_UP]: (ctx, p) => ({ type: "level", title: `${first(p)} subió de nivel`, body: ctx.levelName ? `Ahora es ${ctx.levelName}.` : "Tiene nuevos beneficios." }),
    [EV.REVIEW_SUBMITTED]: (ctx, p) => {
      const n = ctx.rating;
      const quote = ctx.comment ? ` “${ctx.comment}”` : "";
      if (n <= 3) return { type: "review_low", priority: "urgent", title: `${first(p)} te dejó ${n} ${n === 1 ? "estrella" : "estrellas"}`, body: `Llámale rápido para saber qué pasó.${quote}` };
      return { type: "review_high", title: `${first(p)} te dejó ${n} estrellas`, body: ctx.wentToGoogle ? "La invitamos a compartirlo en Google." : `Paciente contento.${quote}` };
    },
    [EV.PATIENT_MESSAGE]: (ctx, p) => ({ type: "message", priority: ctx.topic === "No podré asistir" || ctx.topic === "Voy a llegar tarde" ? "urgent" : "high", ref_id: ctx.messageId, title: `${first(p)} te escribió`, body: `${ctx.topic ? ctx.topic + ": " : ""}“${String(ctx.body || "").slice(0, 140)}”` })
  };

  Object.keys(handlers).forEach((key) => {
    events.on(key, (ctx) => {
      if (!ctx || !ctx.clinicId) return;
      const origen = ctx.origen || window.ABBA_APP;
      if (origen === "doctor" || origen === "admin") return; // lo hizo el propio equipo
      if (!ctx.origen && !fromPatientSide()) return;
      const p = ctx.patientId ? store.get("patients", ctx.patientId) : null;
      const n = handlers[key](ctx, p);
      if (n) push(Object.assign({ clinic_id: ctx.clinicId, patient_id: ctx.patientId || null }, n));
    });
  });

  // ---- Acciones del paciente que generan aviso --------------------------
  function messageDoctor({ patient, topic, body, appointmentId }) {
    const m = store.insert("patient_messages", { clinic_id: patient.clinic_id, patient_id: patient.id, appointment_id: appointmentId || null, sender: "patient", topic: topic || null, body, read: false });
    events.emit(EV.PATIENT_MESSAGE, { clinicId: patient.clinic_id, patientId: patient.id, messageId: m.id, topic, body });
    return m;
  }
  function replyToPatient({ clinicId, patientId, body }) {
    store.listByClinic("patient_messages", clinicId, (m) => m.patient_id === patientId && m.sender === "patient" && !m.read).forEach((m) => store.update("patient_messages", m.id, { read: true }));
    return store.insert("patient_messages", { clinic_id: clinicId, patient_id: patientId, sender: "clinic", body, read: false });
  }
  /** Opinión dentro de la app. Da los puntos de "Opinión en la app" que puso
   *  el doctor, una sola vez por cita y sin importar las estrellas (los puntos
   *  nunca se dan por reseñas de Google: Google lo prohíbe). */
  function submitReview({ patient, appointmentId, rating, comment }) {
    const yaCalifico = appointmentId && store.listByClinic("reviews", patient.clinic_id, (r) => r.patient_id === patient.id && r.appointment_id === appointmentId).length > 0;
    const premio = yaCalifico ? 0 : window.ABBA.puntos.config(patient.clinic_id).resena;
    const r = store.insert("reviews", { clinic_id: patient.clinic_id, patient_id: patient.id, appointment_id: appointmentId || null, rating, comment: comment || null, left_review: false, points_awarded: premio });
    if (premio) window.ABBA.puntos.otorgar({ patientId: patient.id, amount: premio, type: "review", description: "Por calificar tu cita", ref: "opinion:" + (appointmentId || r.id) });
    events.emit(EV.REVIEW_SUBMITTED, { clinicId: patient.clinic_id, patientId: patient.id, rating, comment, reviewId: r.id });
    return r;
  }

  // ---- Lectura (panel del doctor) ----------------------------------------
  function list(clinicId) { return store.listByClinic("notifications", clinicId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); }
  function unreadCount(clinicId) { return store.listByClinic("notifications", clinicId, (n) => !n.read).length; }
  function markRead(id) { store.update("notifications", id, { read: true }); }
  function markAllRead(clinicId) { store.listByClinic("notifications", clinicId, (n) => !n.read).forEach((n) => store.update("notifications", n.id, { read: true })); }

  window.ABBA.notify = { push, messageDoctor, replyToPatient, submitReview, list, unreadCount, markRead, markAllRead };
})();


/* ---- lib/acciones.js ---- */
/**
 * js/lib/acciones.js — lo que puede hacer un paciente.
 * ---------------------------------------------------------------------------
 * Es lo ÚNICO que escribe datos desde ABBA Clientes. En la demo corre aquí
 * mismo; con la base de datos real corre en el servidor (el mismo código), así
 * nadie puede darse puntos, agendar en un horario ocupado ni tocar datos de
 * otro paciente. Cada acción devuelve un objeto; si algo falla, { error }.
 * ---------------------------------------------------------------------------
 */
(function () {
  function A() { return window.ABBA; }
  function error(msg) { return { error: msg }; }
  function yo() {
    const s = A().auth.getSession();
    return s && s.patientId ? A().store.get("patients", s.patientId) : null;
  }

  // ---- Agenda: horarios libres (los mismos que ve el paciente y que valida el servidor)
  function minutos(t) { const [h, m] = A().utils.normTime(t).split(":").map(Number); return h * 60 + m; }
  function hhmm(t) { return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; }
  function duracion(s) { return Math.max(15, Number(s && s.duration_min) || 30); }
  function contexto(clinicId) {
    const { store, utils } = A();
    const clinic = store.get("clinics", clinicId);
    // Citas que ocupan agenda: las que se ven y, con la base real, las de otros
    // pacientes (solo día, hora y doctor: "ocupados").
    const vistas = store.listByClinic("appointments", clinicId, (a) => a.status !== "cancelled");
    const ocupados = store.list("ocupados", (o) => o.clinic_id === clinicId && !store.get("appointments", o.id));
    const citas = vistas.concat(ocupados).map((a) => ({ id: a.id, doctor: a.doctor_id, date: a.date, ini: minutos(a.time), fin: minutos(a.time) + duracion(store.get("services", a.service_id)) }));
    return { H: utils.horarioClinica(clinic), doctors: store.listByClinic("doctors", clinicId, (d) => d.active !== false), citas };
  }
  /** Doctor libre para ese servicio, día y hora (o null). */
  function libreEn(ctx, service, iso, t, preferido, ignorarId) {
    const dur = duracion(service);
    if (!ctx.H.days.includes(A().utils.dayOfWeek(iso))) return null;
    if (t < minutos(ctx.H.open) || t + dur > minutos(ctx.H.close)) return null;
    const delDia = ctx.citas.filter((c) => c.date === iso && c.id !== ignorarId);
    const libre = (doc) => !delDia.some((c) => c.doctor === doc.id && c.ini < t + dur && t < c.fin);
    return (preferido && ctx.doctors.find((d) => d.id === preferido && libre(d))) || ctx.doctors.find(libre) || null;
  }
  function horariosLibres(clinicId, service, limit) {
    const { utils } = A();
    const ctx = contexto(clinicId);
    const today = utils.todayISO(), now = utils.nowHM();
    const slots = [];
    if (!ctx.doctors.length) return slots;
    const open = minutos(ctx.H.open), close = minutos(ctx.H.close);
    for (let d = 0; d <= 21 && slots.length < (limit || 60); d++) {
      const iso = utils.addDays(today, d);
      for (let t = open; t + duracion(service) <= close && slots.length < (limit || 60); t += 30) {
        if (iso === today && hhmm(t) <= now) continue;
        const doc = libreEn(ctx, service, iso, t);
        if (doc) slots.push({ date: iso, time: hhmm(t), doctorId: doc.id, doctorName: doc.name });
      }
    }
    return slots;
  }

  function agendar({ serviceId, date, time, doctorId }) {
    const { store, events, utils } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const service = store.get("services", serviceId);
    if (!service || service.clinic_id !== patient.clinic_id || service.active === false) return error("Ese servicio ya no está disponible.");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date)) || !/^\d{1,2}:\d{2}$/.test(String(time))) return error("Elige un día y una hora.");
    const hoy = utils.todayISO(), hora = utils.normTime(time);
    const dias = utils.daysBetween(hoy, date);
    if (dias < 0 || dias > 60 || (date === hoy && hora <= utils.nowHM())) return error("Ese horario ya no está disponible.");
    const doc = libreEn(contexto(patient.clinic_id), service, date, minutos(hora), doctorId);
    if (!doc) return error("Alguien acaba de tomar ese horario. Elige otro, por favor.");
    const appt = store.insert("appointments", {
      clinic_id: patient.clinic_id, patient_id: patient.id, doctor_id: doc.id, service_id: service.id,
      service_name: service.name, doctor_name: doc.name, date, time: hora, status: "pending"
    });
    events.emit(events.EVENTS.APPOINTMENT_BOOKED, { clinicId: patient.clinic_id, patientId: patient.id, appointmentId: appt.id });
    return { appointment: appt };
  }

  function canjear({ rewardId }) {
    const { store, events, puntos } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const reward = store.get("rewards", rewardId);
    if (!reward || reward.clinic_id !== patient.clinic_id || reward.active === false) return error("Esa recompensa ya no está disponible.");
    if ((patient.points_balance || 0) < reward.points_cost) return error("Ya no te alcanzan los puntos.");
    const code = "ABBA-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    const redemption = store.insert("reward_redemptions", { clinic_id: patient.clinic_id, patient_id: patient.id, reward_id: reward.id, status: "pending", code });
    puntos.otorgar({ patientId: patient.id, amount: -reward.points_cost, type: "redemption", description: `Canje: ${reward.name}`, ref: "canje:" + redemption.id });
    events.emit(events.EVENTS.REWARD_REDEEMED, { clinicId: patient.clinic_id, patientId: patient.id, rewardId: reward.id, vars: { recompensa: reward.name, codigo: code } });
    return { code, redemption };
  }

  function calificar({ appointmentId, rating, comment }) {
    const { store, notify } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const appt = store.get("appointments", appointmentId);
    if (!appt || appt.patient_id !== patient.id || appt.status !== "completed") return error("No encontramos esa cita.");
    rating = Math.round(Number(rating));
    if (!(rating >= 1 && rating <= 5)) return error("Elige de 1 a 5 estrellas.");
    if (store.listByClinic("reviews", patient.clinic_id, (r) => r.appointment_id === appointmentId).length) return error("Ya calificaste esta cita.");
    const review = notify.submitReview({ patient, appointmentId, rating, comment: String(comment || "").trim().slice(0, 1000) });
    return { review };
  }

  /** Marca que el paciente fue a dejar su reseña a Google (no da puntos). */
  function resenaGoogle({ appointmentId }) {
    const { store } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const r = store.listByClinic("reviews", patient.clinic_id, (x) => x.appointment_id === appointmentId && x.patient_id === patient.id)[0];
    if (r) store.update("reviews", r.id, { left_review: true });
    return {};
  }

  function mensaje({ topic, body, appointmentId }) {
    const { store, notify } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    body = String(body || "").trim().slice(0, 2000);
    if (!body) return error("Escribe tu mensaje.");
    const appt = appointmentId ? store.get("appointments", appointmentId) : null;
    const m = notify.messageDoctor({ patient, topic: topic ? String(topic).slice(0, 60) : null, body, appointmentId: appt && appt.patient_id === patient.id ? appt.id : null });
    return { message: m };
  }

  /** Sus datos. El celular es con lo que entra: no puede quedar repetido ni incompleto. */
  function perfil({ first_name, last_name, phone, email, birthday }) {
    const { store, auth } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    first_name = String(first_name || "").trim().replace(/\s+/g, " ").slice(0, 80);
    last_name = String(last_name || "").trim().replace(/\s+/g, " ").slice(0, 80);
    email = String(email || "").trim().slice(0, 120);
    const tel = auth.normPhone(phone);
    if (!first_name || !last_name) return error("Escribe tu nombre y tus apellidos.");
    if (tel.length < 10) return error("Tu celular debe tener 10 dígitos: con él entras a tu cuenta.");
    if (store.listByClinic("patients", patient.clinic_id, (x) => x.id !== patient.id && auth.normPhone(x.phone) === tel).length) return error("Ese celular ya lo usa otra cuenta de esta clínica.");
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return error("Revisa tu correo, parece incompleto.");
    if (birthday && !/^\d{4}-\d{2}-\d{2}$/.test(String(birthday))) return error("Revisa tu fecha de cumpleaños.");
    store.update("patients", patient.id, { first_name, last_name, phone: String(phone).trim().slice(0, 30), email: email || null, birthday: birthday || null });
    return { patient: store.get("patients", patient.id) };
  }

  /** Marca como leídas las respuestas de la clínica. */
  function leerMensajes() {
    const { store } = A();
    const patient = yo();
    if (!patient) return {};
    store.listByClinic("patient_messages", patient.clinic_id, (m) => m.patient_id === patient.id && m.sender === "clinic" && !m.read)
      .forEach((m) => store.update("patient_messages", m.id, { read: true }));
    return {};
  }

  /** El paciente acepta o deja de recibir WhatsApp (también puede escribir BAJA por WhatsApp). */
  function whatsappPreferencia({ acepta }) {
    const { store, auth } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const ahora = new Date().toISOString();
    store.update("patients", patient.id, acepta === true
      ? { whatsapp_optin: true, whatsapp_optin_at: ahora, whatsapp_optin_version: auth.AVISO_VERSION, whatsapp_baja_at: null }
      : { whatsapp_optin: false, whatsapp_baja_at: ahora });
    return { patient: store.get("patients", patient.id) };
  }

  /** Borra a un paciente y TODO lo suyo en su clínica (derecho de cancelación).
   *  Las solicitudes ARCO se conservan: son el registro de que lo pidió. */
  function borrarPaciente(patientId) {
    const { store } = A();
    const patient = store.get("patients", patientId);
    if (!patient) return { borrados: 0 };
    let n = 0;
    store.TABLES.forEach((t) => {
      if (t === "clinics" || t === "ocupados" || t === "arco_requests" || t === "patients") return;
      store.list(t, (r) => r.patient_id === patient.id).forEach((r) => { store.remove(t, r.id); n++; });
    });
    store.list("referrals", (r) => r.referred_patient_id === patient.id).forEach((r) => store.update("referrals", r.id, { referred_patient_id: null }));
    if (patient.user_id) store.remove("users", patient.user_id);
    store.remove("patients", patient.id);
    return { borrados: n + 1, clinicId: patient.clinic_id };
  }

  /** El paciente elimina su cuenta y todos sus datos. Al doctor le llega un aviso sin datos personales. */
  function eliminarCuenta() {
    const { notify, auth } = A();
    const patient = yo();
    if (!patient) return error("Tu sesión terminó. Vuelve a entrar.");
    const r = borrarPaciente(patient.id);
    notify.push({ clinic_id: r.clinicId, type: "arco", priority: "high", title: "Un paciente eliminó su cuenta", body: "Se borraron sus datos a petición suya (derecho de cancelación). No hay que hacer nada más." });
    if (!window.ABBA_SERVIDOR) auth.logout();
    return r;
  }

  /** Alguien escaneó el QR de recepción (sin cuenta todavía). */
  function escaneo({ clinicId, qrId }) {
    const { store } = A();
    const qr = qrId ? store.get("qr_codes", qrId) : null;
    if (!qr || qr.clinic_id !== clinicId) return {};
    store.update("qr_codes", qr.id, { scan_count: (qr.scan_count || 0) + 1 });
    store.insert("qr_scans", { clinic_id: clinicId, qr_id: qr.id, resulted_in_signup: false });
    return {};
  }

  window.ABBA.acciones = { agendar, canjear, calificar, resenaGoogle, mensaje, perfil, leerMensajes, escaneo, horariosLibres, whatsappPreferencia, eliminarCuenta, borrarPaciente };
})();


/* ---- lib/motor.js ---- */
/**
 * js/lib/motor.js — lo que tiene que pasar a su hora aunque nadie toque nada.
 * ---------------------------------------------------------------------------
 *  Al paciente (según las automatizaciones que tenga activas la clínica):
 *   - Recordatorio N horas antes de cada cita.
 *   - Pedir opinión N horas después de la cita.
 *   - Cumpleaños: los puntos de regalo (siempre) y su mensaje.
 *   - "Te extrañamos" cuando cumple N días sin venir.
 *  Al doctor (avisos en su panel y en su celular):
 *   - Resumen de la mañana, citas de mañana sin confirmar (en la tarde),
 *     cumpleaños de hoy y pacientes que acaban de entrar en riesgo.
 *
 * Se puede correr cada minuto: cada cosa sale UNA sola vez (automation_logs.ref,
 * points_transactions.ref y notifications.ref). Los mensajes con horario solo
 * salen de 8:00 a 21:00, hora de la clínica. En la demo corre dentro de ABBA
 * Doctors; en producción lo corre el servidor cada pocos minutos.
 * ---------------------------------------------------------------------------
 */
(function () {
  const HORARIO = { desde: "08:00", hasta: "21:00" }; // mensajes al paciente con horario
  const HORA_RESUMEN = "08:00", HORA_DIARIO = "09:00", HORA_PENDIENTES = "17:00";
  const HORA_MS = 3600000;

  function nombres(lista) {
    const n = lista.map((p) => p.first_name);
    if (n.length <= 1) return n.join("");
    if (n.length <= 3) return n.slice(0, -1).join(", ") + " y " + n[n.length - 1];
    return n.slice(0, 3).join(", ") + ` y ${n.length - 3} más`;
  }

  function revisar(clinicId) {
    if (window.ABBA_NUBE) return; // con la base de datos real lo corre el servidor cada 5 minutos
    const { store, utils: U, automations: AU, events, notify, puntos } = window.ABBA;
    const EV = events.EVENTS;
    const clinic = store.get("clinics", clinicId);
    if (!clinic || clinic.status === "inactive" || clinic.status === "paused") return;
    const ahora = Date.now(), hoy = U.todayISO(), hm = U.nowHM();
    const enHorario = hm >= HORARIO.desde && hm < HORARIO.hasta;
    const autos = store.listByClinic("automations", clinicId, (a) => a.active);
    const citas = store.listByClinic("appointments", clinicId);

    if (enHorario) {
      // 1) Recordatorio N horas antes de la cita.
      autos.filter((a) => a.event_key === EV.APPOINTMENT_REMINDER).forEach((a) => {
        const antes = AU.horas(a) * HORA_MS;
        citas.filter((c) => c.status === "pending" || c.status === "confirmed").forEach((c) => {
          const t = U.instante(c.date, c.time);
          if (ahora < t - antes || ahora >= t) return;
          // Si agendó cuando ya faltaba menos que eso, su confirmación ya trae fecha y hora.
          if (c.created_at && new Date(c.created_at).getTime() > t - antes) return;
          AU.runOne(a, { clinicId, patientId: c.patient_id, appointmentId: c.id, ref: `recordatorio:${c.id}:${c.date}T${U.normTime(c.time)}` });
        });
      });

      // 2) Pedir opinión N horas después de la cita (solo si asistió y aún no califica).
      autos.filter((a) => a.event_key === EV.REVIEW_REQUESTED).forEach((a) => {
        const despues = AU.horas(a) * HORA_MS;
        citas.filter((c) => c.status === "completed" && c.completed_at).forEach((c) => {
          const t = Math.max(U.instante(c.date, c.time), new Date(c.completed_at).getTime()) + despues;
          if (ahora < t || ahora - t > 3 * 24 * HORA_MS) return; // nada de pedir opiniones viejas
          if (store.listByClinic("reviews", clinicId, (r) => r.appointment_id === c.id).length) return;
          AU.runOne(a, { clinicId, patientId: c.patient_id, appointmentId: c.id, ref: `opinion:${c.id}` });
        });
      });
    }

    // 3) Una vez al día, desde las 9:00: cumpleaños y pacientes que cumplen N días sin venir.
    if (hm >= HORA_DIARIO && clinic.motor_diario !== hoy) {
      store.update("clinics", clinicId, { motor_diario: hoy });
      const cfg = puntos.config(clinic);
      const cumple = store.listByClinic("patients", clinicId, (p) => U.cumpleHoy(p.birthday, hoy));
      cumple.forEach((p) => {
        const ref = `cumple:${p.id}:${hoy.slice(0, 4)}`;
        if (cfg.cumpleanos > 0) puntos.otorgar({ patientId: p.id, amount: cfg.cumpleanos, type: "birthday", description: "Regalo de cumpleaños", ref });
        autos.filter((a) => a.event_key === EV.BIRTHDAY).forEach((a) => AU.runOne(a, { clinicId, patientId: p.id, vars: { puntos_ganados: cfg.cumpleanos }, ref }));
      });
      if (cumple.length) notify.push({
        clinic_id: clinicId, type: "birthday", ref: `cumple:${hoy}`, link: "#/doctor/patients",
        title: cumple.length === 1 ? `Hoy cumple años ${U.patientName(cumple[0])}` : `Hoy cumplen años ${cumple.length} pacientes`,
        body: (cumple.length > 1 ? nombres(cumple) + ". " : "") + (cfg.cumpleanos ? `Ya ${cumple.length === 1 ? "le" : "les"} sumamos ${cfg.cumpleanos} puntos de regalo.` : `Un buen día para ${cumple.length === 1 ? "felicitarle" : "felicitarles"}.`)
      });

      // "Te extrañamos": solo a quien ACABA de cumplir los días (no a todos los que llevan años sin venir).
      autos.filter((a) => a.event_key === EV.PATIENT_INACTIVE).forEach((a) => {
        const n = AU.dias(a);
        AU.getPatientsAtRisk(clinicId, n).filter((p) => p.days_inactive <= n + 7).forEach((p) => {
          AU.runOne(a, { clinicId, patientId: p.id, ref: `inactivo:${p.id}:${p.last_visit_date || "sin-visita"}` });
        });
      });

      // Aviso al doctor: quién entró hoy en riesgo.
      const auto = AU.findAutomation(clinicId, EV.PATIENT_INACTIVE);
      const umbral = auto ? AU.dias(auto) : 60;
      const nuevos = AU.getPatientsAtRisk(clinicId, umbral).filter((p) => p.days_inactive === umbral);
      if (nuevos.length) notify.push({
        clinic_id: clinicId, type: "risk", ref: `riesgo:${hoy}`, link: "#/doctor/at-risk",
        title: nuevos.length === 1 ? `${U.patientName(nuevos[0])} cumplió ${umbral} días sin venir` : `${nuevos.length} pacientes cumplieron ${umbral} días sin venir`,
        body: (nuevos.length > 1 ? nombres(nuevos) + ". " : "") + "No tienen cita agendada. Un mensaje o una llamada ayuda a que regresen."
      });
    }

    // 4) Resumen de la mañana para el doctor.
    if (hm >= HORA_RESUMEN) {
      const vivas = citas.filter((a) => a.status === "confirmed" || a.status === "pending");
      const deHoy = vivas.filter((a) => a.date === hoy).length;
      const manana = vivas.filter((a) => a.date === U.addDays(hoy, 1));
      const sinConfirmar = manana.filter((a) => a.status === "pending").length;
      const cumple = store.listByClinic("patients", clinicId, (p) => U.cumpleHoy(p.birthday, hoy));
      const riesgo = AU.getPatientsAtRisk(clinicId, 60).length;
      const partes = [`${deHoy} ${deHoy === 1 ? "cita" : "citas"} hoy`, `${manana.length} mañana${sinConfirmar ? ` (${sinConfirmar} sin confirmar)` : ""}`];
      if (cumple.length) partes.push(`cumpleaños: ${nombres(cumple)}`);
      if (riesgo) partes.push(`${riesgo} ${riesgo === 1 ? "paciente lleva" : "pacientes llevan"} más de 60 días sin venir`);
      notify.push({ clinic_id: clinicId, type: "digest", ref: `resumen:${hoy}`, link: "#/doctor/appointments", title: "Tu resumen de hoy", body: partes.join(" · ") });
    }

    // 5) En la tarde: citas de mañana que siguen sin confirmar.
    if (hm >= HORA_PENDIENTES) {
      const pend = citas.filter((a) => a.status === "pending" && a.date === U.addDays(hoy, 1));
      if (pend.length) {
        const pacientes = pend.map((a) => store.get("patients", a.patient_id)).filter(Boolean);
        notify.push({
          clinic_id: clinicId, type: "pending", priority: "high", ref: `pendientes:${hoy}`, link: "#/doctor/appointments", filtro: "pending",
          title: pend.length === 1 ? "Una cita de mañana sigue sin confirmar" : `${pend.length} citas de mañana siguen sin confirmar`,
          body: pend.length === 1 ? `${nombres(pacientes)}. Confírmala para que le llegue su aviso.` : `${nombres(pacientes)}. Confírmalas para que les llegue su aviso.`
        });
      }
    }
  }

  /** Arranca el motor en ABBA Doctors (demo): ahora y cada minuto. */
  function iniciar() {
    if (window.ABBA_NUBE) return;
    const tick = () => {
      const s = window.ABBA.auth.getSession();
      if (!s || !s.clinicId || (s.role !== "CLINIC_ADMIN" && s.role !== "STAFF")) return;
      try { revisar(s.clinicId); } catch (e) { console.error("[motor]", e); }
    };
    tick();
    setInterval(tick, 60000);
  }

  window.ABBA.motor = { revisar, iniciar, HORARIO };
})();


/* ---- lib/media.js ---- */
/**
 * js/lib/media.js — imágenes y videos de campañas.
 * ---------------------------------------------------------------------------
 * Los archivos NO van en localStorage (se llenaría con un solo video): se
 * guardan en IndexedDB del navegador y la campaña solo guarda su id, tipo,
 * nombre y tamaño. Al conectar Supabase, put() sube a Supabase Storage y
 * url() devuelve la URL pública — el resto de la app no cambia.
 * ---------------------------------------------------------------------------
 */
(function () {
  const DB = "abba_media_v1", STORE = "files";
  const MAX_IMAGE_SIDE = 1600;          // las fotos se reducen a esto (lado mayor)
  const MAX_VIDEO_BYTES = 60 * 1024 * 1024; // 60 MB por video

  function open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("Este navegador no permite guardar archivos."));
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const r = fn(t.objectStore(STORE));
      t.oncomplete = () => resolve(r && r.result);
      t.onerror = () => reject(t.error);
    });
  }

  /** Reduce fotos grandes a JPEG para que pesen poco (los videos se guardan tal cual). */
  function shrinkImage(file) {
    return new Promise((resolve) => {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.width, img.height));
        if (scale === 1 && file.size < 900 * 1024) { URL.revokeObjectURL(img.src); return resolve(file); }
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob((b) => resolve(b || file), "image/jpeg", 0.85);
      };
      img.onerror = () => resolve(file);
      img.src = URL.createObjectURL(file);
    });

  /** Guarda un archivo y devuelve {id, kind, name, size, type}. */
  async function put(file) {
    const kind = file.type.startsWith("video/") ? "video" : file.type.startsWith("image/") ? "image" : null;
    if (!kind) throw new Error("Solo se pueden subir imágenes o videos.");
    if (kind === "video" && file.size > MAX_VIDEO_BYTES) throw new Error("El video pesa más de 60 MB. Recórtalo o compártelo como enlace.");
    const blob = kind === "image" ? await shrinkImage(file) : file;
    const id = "med_" + Math.random().toString(36).slice(2, 10);
    await tx("readwrite", (s) => s.put(blob, id));
    return { id, kind, name: file.name, size: blob.size, type: blob.type || file.type };
  }

  async function remove(id) { return tx("readwrite", (s) => s.delete(id)); }

  /** URL temporal para mostrar el archivo en un <img>/<video>. */
  async function url(id) {
    if (cache[id]) return cache[id];
    const blob = await get(id);
    if (!blob) return null;
    return (cache[id] = URL.createObjectURL(blob));
  }

  window.ABBA = window.ABBA || {};
  window.ABBA.media = { put, get, remove, url, prettySize, MAX_VIDEO_BYTES };

/**

 *      temas legales, ni datos de otras personas, ni opiniones; no inventa; no
 *      cambia sus reglas aunque se lo pidan; siempre ofrece hablar con la clínica.
 *   3) DESPUÉS de la IA (filtrarRespuesta): si la respuesta trae algo médico,

(function () {

    BOOK_APPOINTMENT: "book_appointment",
    CANCEL_APPOINTMENT: "cancel_appointment",
    RESCHEDULE_APPOINTMENT: "reschedule_appointment",
    SHOW_APPOINTMENT: "show_appointment",
    SHOW_SERVICES: "show_services",

    MESSAGE_DOCTOR: "message_doctor",

    if (!r || !Array.isArray(r.updates)) return null;

      patientName: String(u.patientName || "").slice(0, 80),
      status: u.status,
      newDate: /^\d{4}-\d{2}-\d{2}$/.test(u.newDate || "") ? u.newDate : null,
      newTime: /^\d{2}:\d{2}$/.test(u.newTime || "") ? u.newTime : null
    })).filter((u) => ["confirmed", "pending", "completed", "cancelled", "no_show", "reschedule"].includes(u.status) && (u.status !== "reschedule" || (u.newDate && u.newTime)));
    return { updates, response: filtrarRespuesta(String(r.response || "").slice(0, 600), { tipo: "doctor" }) };
  }

  /** Lo que se le pide al modelo (lo usan el servidor y la prueba con la IA real). */
  const CON_RESPALDO = ["claude-opus-5-5", "claude-opus-5", "claude-fable-5-1", "claude-sonnet-5-5"];
  function parametrosClaude(pedido, modelo) {
    const m = modelo || "claude-opus-5-5";
    return Object.assign({
      model: m,
      max_tokens: 8000,
      output_config: { effort: "low", format: { type: "json_schema", schema: pedido.esquema } },
      system: pedido.system,
      messages: [{ role: "user", content: pedido.mensaje }]
    }, CON_RESPALDO.includes(m) ? { betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" } : {});
  }

  /** ¿Puede haber IA? Solo con el servidor (la demo usa reglas locales). */
  function isConfigured() { return !!window.ABBA_NUBE; }

  /**
   * Punto de entrada del asistente del paciente. Devuelve SIEMPRE una promesa.
   */
  async function detectIntent(ctx) {
    const seguro = revisarSeguridad(ctx.message);
    if (seguro) return seguro;
    if (window.ABBA_NUBE && window.ABBA.nube) {
      try {
        const r = await window.ABBA.nube.llamar("ia", { tipo: "paciente", mensaje: ctx.message });
        if (r && r.resultado && typeof r.resultado.response === "string") return r.resultado;
        if (r && r.error && /Demasiados/.test(r.error)) return respond("limite", r.error, ACTIONS.NONE, {});
      } catch (e) { /* sin red: reglas locales */ }
    }
    return detectIntentRules(ctx);
  }

  /** Motor de reglas por palabras clave (respaldo sin conexión / sin llave). */
  function detectIntentRules(ctx) {
    const { patient, clinic } = ctx;
    const msg = norm(ctx.message);
    const store = window.ABBA.store;
    const has = (...words) => words.some((w) => msg.includes(w));
    const info = infoClinica(clinic);

    if (has("cancelar", "no podre", "no voy a poder", "no puedo ir")) {
      return respond("message_doctor", "Los cambios de cita los confirma la clínica. Escríbele al doctor y te responderá por aquí.", ACTIONS.MESSAGE_DOCTOR, { topic: "No podré asistir" });
    }
    if (has("reprogramar", "reagendar", "cambiar mi cita", "mover mi cita", "cambiar la hora")) {
      return respond("message_doctor", "Claro. Escríbele al doctor qué día y hora te quedan mejor y la clínica te confirma.", ACTIONS.MESSAGE_DOCTOR, { topic: "Cambiar mi cita" });
    }
    if (has("tarde", "retraso")) {
      return respond("message_doctor", "Avísale al doctor que vas tarde para que te espere.", ACTIONS.MESSAGE_DOCTOR, { topic: "Voy a llegar tarde" });
    }
    if (has("precio", "cuesta", "costo", "cuanto sale", "cuanto cobran", "descuento", "promocion", "pago", "seguro", "factura")) {
      return respond("dinero", SEGURA.dinero, ACTIONS.MESSAGE_DOCTOR, { topic: "Tengo una pregunta" });
    }
    if (has("horario", "a que hora abren", "que hora cierran", "abren", "cierran", "estan abiertos", "que dias")) {
      const donde = has("direccion", "donde estan", "donde quedan", "ubicacion", "como llego", "como llegar") && info.direccion ? ` Está en ${info.direccion}.` : "";
      return respond("clinica", `${info.nombre} atiende ${info.horario.dias.join(", ")} de ${info.horario.abre} a ${info.horario.cierra}.${donde}`, ACTIONS.NONE, {});
    }
    if (has("direccion", "donde estan", "donde quedan", "ubicacion", "como llego", "como llegar")) {
      return respond("clinica", info.direccion ? `${info.nombre} está en ${info.direccion}.` : "La clínica todavía no tiene su dirección en la app. Escríbele y te la comparten.", info.direccion ? ACTIONS.NONE : ACTIONS.MESSAGE_DOCTOR, info.direccion ? {} : { topic: "Tengo una pregunta" });
    }
    if (has("telefono de la clinica", "numero de la clinica", "llamar a la clinica", "su telefono", "su numero")) {
      return respond("clinica", info.telefono ? `Puedes llamar a ${info.nombre} al ${info.telefono}.` : "Escríbele a la clínica desde aquí y te responden.", info.telefono ? ACTIONS.NONE : ACTIONS.MESSAGE_DOCTOR, info.telefono ? {} : { topic: "Tengo una pregunta" });
    }
    if (has("doctor", "doctora", "preguntar", "pregunta", "mensaje", "hablar con alguien", "persona", "humano")) {
      return respond("message_doctor", "Escríbele directamente a la clínica; le llega una notificación al momento.", ACTIONS.MESSAGE_DOCTOR, { topic: "Tengo una pregunta" });
    }
    if (has("agendar", "reservar", "quiero una cita", "sacar cita", "limpieza", "consulta", "revision")) {
      const services = store.listByClinic("services", clinic.id, (s) => s.active !== false);
      let service = services.find((s) => msg.includes(norm(s.name).split(" ")[0]));
      if (!service) service = services[0];
      return respond("book_appointment", service ? `Encontré disponibilidad para ${service.name}.` : "Vamos a agendar tu cita.", ACTIONS.BOOK_APPOINTMENT, { serviceId: service ? service.id : null });

      return respond("show_points", `Tienes ${patient.points_balance} puntos disponibles.`, ACTIONS.SHOW_POINTS, {});
    }
    if (has("cuando es mi cita", "proxima cita", "mi cita", "tengo cita")) {
      const appt = nextAppointment(store, patient.id);
      if (!appt) return respond("show_appointment", "No tienes ninguna cita próxima agendada.", ACTIONS.NAVIGATE_TO, { to: "#/patient/appointments" });
      return respond("show_appointment", `Tu próxima cita es ${appt.service_name} el ${appt.date} a las ${appt.time}.`, ACTIONS.SHOW_APPOINTMENT, { appointmentId: appt.id });
    }
    if (has("recompensa", "canjear", "premio", "beneficio")) {
      return respond("show_rewards", "Estas son las recompensas que puedes obtener con tus puntos.", ACTIONS.SHOW_REWARDS, {});
    }
    if (has("vip", "nivel", "premium")) {
      const lvl = window.ABBA.utils.computeLevel(patient.points_balance || 0, store.listByClinic("loyalty_levels", clinic.id));
      return respond("show_points", `Estás en el nivel ${lvl.current ? lvl.current.name : "Inicial"}. Sigue acumulando puntos para subir de nivel.`, ACTIONS.SHOW_POINTS, {});
    }
    if (has("que servicios", "servicios tienen", "que hacen")) {
      return respond("show_services", "Estos son los servicios disponibles en la clínica.", ACTIONS.SHOW_SERVICES, {});
    }
    if (has("cambiar mi telefono", "actualizar mi telefono", "cambiar mi numero", "actualizar mis datos")) {
      return respond("update_profile", "Vamos a tu perfil para actualizar tus datos.", ACTIONS.UPDATE_PROFILE, {});
    }
    if (has("hola", "buenas", "buenos dias", "que tal")) {
      return respond("saludo", "¡Hola! Puedo ayudarte a agendar una cita, ver tus puntos y recompensas, o darte el horario y la dirección de tu clínica.", ACTIONS.NONE, {});
    }
    return respond("unknown", "No estoy seguro de haber entendido. Puedo ayudarte a agendar una cita, revisar tus puntos y recompensas, ver tu próxima cita o darte el horario y la dirección de tu clínica. Si prefieres, escríbele a la clínica.", ACTIONS.NONE, {});
  }

  function nextAppointment(store, patientId) {
    const p = store.get("patients", patientId);
    return p ? window.ABBA.utils.patientVisitInfo(p).next : null;
  }

  // =========================================================================
  // Asistente del doctor — "Ximena no asistió, ¿qué citas tengo mañana?…"
  // El modelo NUNCA elige el appointmentId: solo dice a qué paciente se refiere
  // y qué estado le corresponde; el id real se resuelve comparando contra la
  // lista de citas que sí existen.
  // =========================================================================
  function norm2(s) { return norm(s); }

  /** "el martes", "mañana", "hoy" → fecha YYYY-MM-DD real (respaldo sin IA). */
  function resolveRelativeDate(text) {
    const t = norm2(text);
    const U = window.ABBA.utils, today = U.todayISO();
    if (/\bpasado manana\b/.test(t)) return U.addDays(today, 2);
    if (/\bmanana\b/.test(t)) return U.addDays(today, 1);
    if (/\bhoy\b/.test(t)) return today;
    for (let i = 0; i < DOW.length; i++) {
      if (t.includes(DOW[i])) {
        let diff = (i - U.dayOfWeek(today) + 7) % 7;
        if (diff === 0) diff = 7; // "el martes" dicho un martes = el próximo, no hoy
        return U.addDays(today, diff);
      }
    }
    return null;
  }

  /** "a las 8", "8:30", "4pm", "las 4 de la tarde" → "HH:MM" (respaldo sin IA). */
  function resolveTime(text) {
    const t = norm2(text);
    let m = t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
    if (!m) return null;
    let h = parseInt(m[1], 10), min = m[2] ? parseInt(m[2], 10) : 0;
    const suffix = m[3] || (/\btarde\b/.test(t) ? "pm" : /\bmanana\b/.test(t) ? "am" : null);
    if (suffix === "pm" && h < 12) h += 12;
    if (suffix === "am" && h === 12) h = 0;
    if (!suffix && h >= 1 && h <= 7) h += 12; // "a las 4" sin más contexto → tarde, típico de clínica
    if (h < 0 || h > 23) return null;
    return `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
  }

  /** Respaldo sin IA: preguntas sobre la agenda, o actualizar citas por palabras clave. */
  function parseDoctorUpdatesRules(message, appointments) {
    const t = norm2(message);
    const U = window.ABBA.utils, hoy = U.todayISO(), manana = U.addDays(hoy, 1);
    const pregunta = /\?|\b(que|cuales|cuantas|cuantos|quien|quienes|tengo|hay)\b/.test(t) && !/\b(no vino|no asistio|asistio|vino|cancelo|confirmo|reagenda|mueve|falto)\b/.test(t);
    if (pregunta) {
      const vivas = appointments.filter((a) => a.status === "pending" || a.status === "confirmed");
      const lista = (arr) => arr.length ? arr.map((a) => `${a.patientName} ${a.time} (${a.service})`).join("; ") : "ninguna";
      if (/confirm|pendiente/.test(t)) return { updates: [], response: `Sin confirmar: ${lista(vivas.filter((a) => a.status === "pending" && a.date >= hoy))}.` };
      if (/manana/.test(t)) return { updates: [], response: `Citas de mañana: ${lista(vivas.filter((a) => a.date === manana))}.` };
      if (/hoy/.test(t)) return { updates: [], response: `Citas de hoy: ${lista(vivas.filter((a) => a.date === hoy))}.` };
      return { updates: [], response: "Puedo decirte tus citas de hoy, las de mañana o las que faltan por confirmar, y actualizar citas (ej. \"Ana no vino\")." };
    }
    const clauses = message.split(/,| y (?=[A-ZÁÉÍÓÚÑ])|;|\./).map((c) => c.trim()).filter(Boolean);
    const updates = [];
    clauses.forEach((clause) => {
      const c = norm2(clause);
      const match = appointments.find((a) => c.includes(norm2(a.patientName.split(" ")[0])));
      if (!match) return;
      if (/\breagend|reprogram|mueve|cambia.*(cita|hora)/.test(c)) {
        const newDate = resolveRelativeDate(clause);
        const newTime = resolveTime(clause);
        if (newDate && newTime) updates.push({ patientName: match.patientName, status: "reschedule", newDate, newTime });
        return;
      }
      let status = null;
      if (/\bno\s+(asist|vino|llego|fue)/.test(c) || /\bfalto\b/.test(c)) status = "no_show";
      else if (/\bcancel/.test(c)) status = "cancelled";
      else if (/\bconfirm/.test(c)) status = "confirmed";
      else if (/\basist|vino|llego|complet/.test(c)) status = "completed";
      if (status) updates.push({ patientName: match.patientName, status, newDate: null, newTime: null });
    });
    return { updates, response: updates.length ? `Actualicé ${updates.length} ${updates.length === 1 ? "cita" : "citas"}.` : "No reconocí ningún cambio. Nombra al paciente como aparece en tu agenda, o pregúntame por tus citas de hoy o de mañana." };
  }

  /**
   * Asistente del doctor. Con el servidor, la IA arma la lista de citas ella
   * misma desde la base (nombre e inicial del apellido); sin servidor, reglas locales.
   * @param {{message:string, appointments:[{id,patientName,service,date,time,status}]}} ctx
   * @returns {Promise<{updates:[{patientName,status,newDate,newTime}], response:string, _fallback?:boolean}>}
   */
  async function parseDoctorUpdates(ctx) {
    const seguro = revisarSeguridadDoctor(ctx.message);
    if (seguro) return seguro;
    if (window.ABBA_NUBE && window.ABBA.nube) {
      try {
        const r = await window.ABBA.nube.llamar("ia", { tipo: "doctor", mensaje: ctx.message });
        if (r && r.resultado && Array.isArray(r.resultado.updates)) return r.resultado;
        if (r && r.error && /Demasiados/.test(r.error)) return { updates: [], response: r.error };
      } catch (e) { /* sin red: reglas locales */ }
    }
    return Object.assign(parseDoctorUpdatesRules(ctx.message, ctx.appointments), window.ABBA_NUBE ? { _fallback: true } : {});
  }

  window.ABBA = window.ABBA || {};
  window.ABBA.ai = { detectIntent, detectIntentRules, ACTIONS, AVISO, TOPICS, LINEA_VIDA, nextAppointment, isConfigured, parseDoctorUpdates, parseDoctorUpdatesRules,
    revisarSeguridad, revisarSeguridadDoctor, filtrarRespuesta, infoClinica, contextoPaciente, pedidoPaciente, validarPaciente,
    citasParaDoctor, resumenClinica, pedidoDoctor, validarDoctor, parametrosClaude };
})();

/**
 * js/lib/qr.js
 * ---------------------------------------------------------------------------
 * No generamos QR "reales" contra una API externa (no hace falta). Dibujamos
 * el QR en el propio navegador con una librería cargada por CDN (ver
 * index.html, <script src=".../qrcode.min.js">). Si el dispositivo está sin
 * internet esa librería no carga, así que hay una salida elegante: mostrar
 * la URL como texto en vez de romper la pantalla.
 * ---------------------------------------------------------------------------
 */
(function () {
  function joinUrl(clinicId, qrId) {
    const base = location.origin + location.pathname;
    return `${base}#/join/${clinicId}/${qrId}`;
  }

  /**
   * Dibuja un QR dentro de `container` (un elemento DOM). Devuelve true si
   * pudo dibujarlo, false si usó el respaldo en texto.
   */
  /** Link de registro de una clínica en la web universal de pacientes. */
  function patientSiteUrl(clinicId) {
    const base = location.origin + location.pathname.replace(/[^/]*$/, "") + "abba-clientes.html";
    return `${base}#/join/${encodeURIComponent(clinicId)}`;
  }
  function render(container, text, size) {
    container.innerHTML = "";
    if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
      const canvas = document.createElement("canvas");
      container.appendChild(canvas);
      window.QRCode.toCanvas(canvas, text, { width: size || 76, margin: 1, color: { dark: "#14161a", light: "#ffffff" } }, (err) => {
        if (err) renderFallback(container, text);
      });
      return true;
    }
    renderFallback(container, text);
    return false;
  }

  function renderFallback(container, text) {
    container.innerHTML = "";
    const box = document.createElement("div");
    box.style.cssText = "width:76px;height:76px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;";
    box.innerHTML = `<span style="font-size:9px;line-height:1.3;color:var(--text-soft);word-break:break-all;">QR no disponible sin conexión</span>`;
    container.appendChild(box);
  }

  window.ABBA = window.ABBA || {};
  /** Enlace para que el paciente entre a su portal (va en los mensajes). */
  function portalUrl(clinicId) {
    const base = location.origin + location.pathname.replace(/[^/]*$/, "") + "abba-clientes.html";
    return `${base}#/entrar?clinica=${encodeURIComponent(clinicId)}`;
  }
  window.ABBA.qr = { joinUrl, render, patientSiteUrl, portalUrl };
})();

   *  llevan fecha, hora y servicio. Lo que el doctor ya personalizó NO se toca. */
  function migrarAutomatizaciones(clinicId) {
    const store = window.ABBA.store, EV = window.ABBA.events.EVENTS, I = window.ABBA.icons;
    const norm = (t) => I.stripEmoji(String(t || "")).replace(/[¡!]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
    const viejos = new Set(TEXTOS_V1.map(norm));
    const nuevos = Object.fromEntries(defaultAutomations().map((a) => [a.event_key, a]));
    store.listByClinic("automations", clinicId).forEach((a) => {
      const patch = {};
      if (a.event_key === EV.APPOINTMENT_CONFIRMED && /recordatorio/i.test(a.name || "")) {
        patch.event_key = EV.APPOINTMENT_REMINDER;
        patch.params = Object.assign({ hours: 24 }, a.params || {});
      }
      if (a.event_key === EV.REVIEW_REQUESTED && !(a.params && a.params.hours)) patch.params = Object.assign({}, a.params || {}, { hours: 3 });
      if (a.event_key === EV.PATIENT_INACTIVE && !(a.params && a.params.days)) patch.params = Object.assign({}, a.params || {}, { days: 60 });
      const nuevo = nuevos[patch.event_key || a.event_key];
      if (nuevo && viejos.has(norm(a.message_template))) {
        patch.message_template = nuevo.message_template;
        if (NOMBRES_V1.includes(a.name)) patch.name = nuevo.name;
      }
      if (Object.keys(patch).length) store.update("automations", a.id, patch);
    });
    const tiene = new Set(store.listByClinic("automations", clinicId).map((a) => a.event_key));
    [EV.APPOINTMENT_CONFIRMED, EV.APPOINTMENT_RESCHEDULED, EV.APPOINTMENT_NO_SHOW, EV.CLINIC_REPLIED].forEach((k) => {
      if (!tiene.has(k) && nuevos[k]) store.insert("automations", Object.assign({ clinic_id: clinicId, channel: "whatsapp" }, nuevos[k]));

    store.update("clinics", clinicId, { automations_v2: true });

  window.ABBA = window.ABBA || {};
  function uniqueUsername(store, clinicId, first) {
    const base = String(first || "paciente").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "") || "paciente";
    let u = base, n = 2;
    while (store.listByClinic("patients", clinicId, (p) => p.username === u).length) u = base + n++;
    return u;
  }

  /** Se ejecuta SIEMPRE: pone al día datos guardados por versiones anteriores
   *  (emojis en plantillas y niveles, horas sin cero, pacientes sin usuario). */
  function migrate() {
    const store = window.ABBA.store, I = window.ABBA.icons, u = U();
    store.list("automations").forEach((a) => {
      const clean = I.stripEmoji(a.message_template);
      if (clean !== a.message_template) store.update("automations", a.id, { message_template: clean });
    });
    store.list("loyalty_levels").forEach((l) => {
      if (l.icon && /[^\x00-\x7F]/.test(l.icon)) store.update("loyalty_levels", l.id, { icon: I.levelKey(l.name).replace("lvl", "").toLowerCase() });
    });
    store.list("appointments").forEach((a) => {
      const t = u.normTime(a.time);
      if (t !== a.time) store.update("appointments", a.id, { time: t });
    });
    store.list("patients", (p) => !p.username && !p.password).forEach((p) => {
      store.update("patients", p.id, { username: uniqueUsername(store, p.clinic_id, p.first_name), password: "1234" });
    });
    store.list("clinics").forEach((c) => {
      if (!store.listByClinic("doctors", c.id).length || !store.listByClinic("automations", c.id).length) seedClinicDefaults(c.id);
    });
    store.list("clinics").forEach((c) => { if (!c.automations_v2) migrarAutomatizaciones(c.id); });
    store.list("clinics").forEach((c) => { if (!c.automations_v3) migrarTextosWhatsApp(c.id); });
    if (store.get("clinics", "clinic_aurora") && !store.listByClinic("notifications", "clinic_aurora").length && !localStorage.getItem("abba_demo_notifs_v1")) {
      seedDemoNotifications("clinic_aurora", store.listByClinic("patients", "clinic_aurora"));
      localStorage.setItem("abba_demo_notifs_v1", "1");
    }
    const aurora = store.get("clinics", "clinic_aurora");
    if (aurora && !aurora.google_demo) seedDemoGoogle("clinic_aurora");
  }

/* ---- lib/router.js ---- */
/**
 * js/lib/router.js
 * ---------------------------------------------------------------------------
 * Router por hash (funciona abriendo el archivo directamente, sin servidor).
 * Las rutas "conceptuales" del brief (/join/[clinicId]/[qrId], /admin, etc.)
 * viven aquí como "#/join/:clinicId/:qrId" — al migrar a Next.js, cada
 * patrón mapea 1:1 a una carpeta de app router.
 * ---------------------------------------------------------------------------
 */
(function () {
  const routes = [];

  function register(pattern, render, opts) {
    const path = pattern.replace(/^#/, "");
    const segments = path.split("/").filter(Boolean);
    routes.push({ pattern, render, roles: (opts && opts.roles) || null, segments });
  }

  function match(hash) {
    const path = hash.replace(/^#/, "").split("?")[0];
    const segs = path.split("/").filter(Boolean);
    for (const route of routes) {
      if (route.segments.length !== segs.length) continue;
      const params = {};
      let ok = true;
      for (let i = 0; i < segs.length; i++) {
        const rs = route.segments[i];
        if (rs.startsWith(":")) params[rs.slice(1)] = decodeURIComponent(segs[i]);
        else if (rs !== segs[i]) { ok = false; break; }
      }
      if (ok) return { route, params };
    }
    return null;
  }

  function guard(route) {
    if (!route.roles) return true;
    const session = window.ABBA.auth.getSession();
    if (!session) return false;
    // Si ABBA apagó la clínica de esta sesión mientras alguien la seguía usando,
    // se le corta el acceso aquí mismo — no solo en el login.
    if (session.clinicId) {
      const clinic = window.ABBA.store.get("clinics", session.clinicId);
      if (!clinic || clinic.status !== "active") {
        window.ABBA.auth.logout();
        return false;
      }
    }
    return route.roles.includes(session.role);
  }

  function fallbackFor(route) {
    const session = window.ABBA.auth.getSession();
    if (!session) {
      // No hay sesión: si la ruta pedía perfiles de staff/admin, mándalo a login correspondiente.
      if (route && route.roles && route.roles.includes("SUPER_ADMIN")) return "#/admin/login";
      if (route && route.roles && (route.roles.includes("CLINIC_ADMIN") || route.roles.includes("STAFF"))) return "#/doctor/login";
      return "#/";
    }
    if (session.role === "PATIENT") return "#/patient/home";
    if (session.role === "SUPER_ADMIN") return "#/admin";
    return "#/doctor/home";
  }

  function render(opts) {
    const keep = opts && opts.keepScroll ? window.scrollY : null;
    const app = document.getElementById("app");
    const found = match(location.hash || "#/");
    if (!found) {
      app.innerHTML = "";
      app.appendChild(window.ABBA.views.shared.notFound());
      return;
    }
    if (!guard(found.route)) {
      location.hash = fallbackFor(found.route);
      return;
    }
    // No re-renderizar encima de un formulario abierto (ej. sincronización en segundo plano).
    if (keep != null && document.querySelector("#modal-root.open")) return;
    app.innerHTML = "";
    found.route.render(found.params, app);
    window.scrollTo(0, keep != null ? keep : 0);
  }

  function start() {
    window.addEventListener("hashchange", render);
    if (!location.hash) location.hash = "#/";
    render();
  }

  function go(hash) { location.hash = hash; }

  window.ABBA = window.ABBA || {};
  window.ABBA.router = { register, start, go, match, render };
})();

    let avisado = false;
    const marcar = () => { avisado = false; try { localStorage.setItem(KEY, String(Date.now())); } catch (e) { /* sin almacenamiento */ } };
    const ultima = () => { try { return Number(localStorage.getItem(KEY)) || Date.now(); } catch (e) { return Date.now(); } };
    ["pointerdown", "keydown", "scroll", "touchstart", "mousemove"].forEach((ev) => window.addEventListener(ev, () => { if (Date.now() - ultima() > 15000) marcar(); }, { passive: true }));

        toast("Cerramos tu sesión por inactividad. Vuelve a entrar.");

  function recentActivity(cid) {

      if (t.type === "referral") items.push({ created_at: t.created_at, tipo: "registro", icono: "users", text: `${p.first_name} completó un referido` });
    });
    store.listByClinic("reward_redemptions", cid).forEach((r) => {

  // ============================================================ Citas
  function renderAppointments(params, container) {
    const cid = clinicId();

    content.appendChild(el("div", { class: "page-header", style: "padding-inline:0;" }, [el("h1", {}, ["Agenda"])]));

      }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      if (apptsList.length === 0) { listWrap.appendChild(emptyState({ title: "No hay citas en este rango", text: "" })); return; }

      table.appendChild(thead);

      chips.forEach(([c, r]) => c.classList.toggle("active", r === range));

  function statusSelect(appt) {
    const options = [["confirmed", "Confirmada"], ["pending", "Pendiente"], ["completed", "Completada"], ["cancelled", "Cancelada"], ["no_show", "No asistió"]];
    const select = el("select", {});
    options.forEach(([val, label]) => {

    });
    select.addEventListener("change", () => {
      setAppointmentStatus(appt, select.value);

    });
    return select;
