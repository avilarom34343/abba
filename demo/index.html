<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo · ABBA</title>
<style>
  /* Portada de la demo pública (abba-apps/demo/index.html): elegir Clientes o Doctors. */
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#0b2e22; color:#fff; text-align:center; padding:24px; box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; letter-spacing:-0.016em; }
  img{ height:52px; width:auto; }
  .cinta{ display:inline-block; margin-top:18px; font-size:11px; font-weight:800; letter-spacing:.08em; background:#f2c14e; color:#3a2a00; padding:3px 9px; border-radius:6px; }
  h1{ font-size:clamp(28px, 6vw, 40px); letter-spacing:-0.02em; margin:14px 0 8px; }
  p{ color:rgba(255,255,255,.72); margin:0 0 28px; font-size:17px; }
  .botones{ display:grid; gap:12px; width:min(380px, 100%); margin:0 auto; }
  a{ display:block; padding:16px 20px; border-radius:999px; background:#fff; color:#0b2e22; font-weight:700; font-size:17px; text-decoration:none; }
  a.otro{ background:transparent; color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); }
  small{ display:block; margin-top:26px; color:rgba(255,255,255,.55); font-size:13px; }
</style>
</head>
<body>
<main>
  <img src="logo-abba-blanco.png" alt="ABBA">
  <div><span class="cinta">DEMO</span></div>
  <h1>Prueba ABBA</h1>
  <p>Elige qué quieres ver. Todo funciona con datos de prueba.</p>
  <div class="botones">
    <a href="abba-clientes.html">ABBA Clientes · app del paciente</a>
    <a class="otro" href="abba-doctors.html">ABBA Doctors · panel de la clínica</a>
  </div>
  <small>Lo que hagas aquí se guarda solo en tu dispositivo.</small>
</main>
</body>
</html>
